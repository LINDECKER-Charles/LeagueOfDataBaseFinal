# Stand-in for the API (8080) and the SSR server (4000), reached by the image under test
# through the stack's aliases (lodb-api, lodb-web-ssr). Answers carry the lifetimes the real
# services set, so that nginx's caches behave as in the stack.
events {}

http {
    access_log off;

    server {
        listen 8080;

        location = /readyz {
            return 200 "ready\n";
        }

        location /sitemaps/ {
            add_header Cache-Control "public, max-age=3600";
            return 200 "<urlset/>\n";
        }

        location = /robots.txt {
            add_header Cache-Control "public, max-age=3600";
            return 200 "User-agent: *\n";
        }

        location /api/legacy/ {
            add_header Cache-Control "public, max-age=3600";
            return 301 /en/champions;
        }

        location / {
            return 200 "api\n";
        }
    }

    server {
        listen 4000;

        # The hashed bundles, immutable; a name no build has is a plain 404.
        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            return 200 "bundle\n";
        }

        location = /build/gone-ABCD1234.js {
            return 404;
        }

        # A page, compressed when asked for gzip and varying on it, as the SSR server does
        # (src/server/compression).
        location / {
            default_type    text/html;
            gzip            on;
            gzip_min_length 1;
            gzip_vary       on;
            add_header Cache-Control "public, max-age=0, s-maxage=300";
            return 200 "page\n";
        }
    }
}
