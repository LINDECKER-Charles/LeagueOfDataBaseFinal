# Stand-in for the API (8080), the SSR server (4000) and the page store (9000), reached by the
# image under test through the stack's aliases (lodb-api, lodb-web-ssr, lodb-pages-store).
# Answers carry the lifetimes the real services set, so that nginx's caches behave as in the
# stack.
events {}

http {
    access_log off;
    # What reached the page store, read by the checks (lib/stack.mjs).
    log_format store_requests '$request_method $request_uri';
    # What nginx reported to the robots journal (docker/nginx/njs/robot-journal.js), its
    # lines as posted, read by the checks (lib/stack.mjs).
    log_format robot_journal escape=none '$request_body';

    # Takes a report of the journal as the API does, once the location below read its body.
    server {
        listen 127.0.0.1:8099;
        return 202;
    }

    server {
        listen 8080;

        # The robots journal: the body kept in memory, logged, then taken (202).
        location = /internal/robots/journal {
            client_body_buffer_size 1m;
            access_log              /tmp/robot-journal.log robot_journal;
            proxy_pass              http://127.0.0.1:8099;
        }

        location = /readyz {
            return 200 "ready\n";
        }

        location /sitemaps/ {
            add_header Cache-Control "public, max-age=3600";
            return 200 "<urlset/>\n";
        }

        location = /robots.txt {
            add_header Cache-Control "public, max-age=3600";
            return 200 "User-agent: *\n";
        }

        location ~ "^/(?:sitemap\.xml|llms\.txt|5e5e5e5e5e5e5e5e\.txt)$" {
            add_header Cache-Control "public, max-age=3600";
            return 200 "crawler file\n";
        }

        # Tells what trace context the API received from nginx.
        location = /api/trace {
            add_header X-Seen-Traceparent "$http_traceparent";
            add_header X-Seen-Tracestate  "$http_tracestate";
            add_header X-Seen-Baggage     "$http_baggage";
            return 200 "api
";
        }

        # What the API receives of the edge's header: nothing, nginx keeps it.
        location = /api/edge-header {
            return 200 "[$http_x_lodb_edge]\n";
        }

        # An answer far larger than nginx's buffers (the file comes from lib/stack.mjs).
        location = /api/large {
            default_type application/octet-stream;
            alias        /tmp/large;
        }

        # Tells what path the API received, as nginx hands it a former URL.
        location /api/legacy/ {
            add_header Cache-Control "public, max-age=3600";
            add_header X-Seen-Uri    "$request_uri";
            return 301 /en/champions;
        }

        # A former URL the old site never served: the API's real 404.
        location = /api/legacy/champion/NotAChampion {
            return 404;
        }

        # The lists the renderer reads (src/LoDb.Api/Modules/Catalog/Meta), cut down to what
        # nginx reads of them (docker/nginx/njs/latest-version.js): the latest patch, 15.10.1.
        location = /api/meta {
            default_type application/json;
            add_header   Cache-Control "public, max-age=60";
            return 200 '{"latest":"15.10.1","versions":["15.10.1","15.9.1","15.8.1"]}\n';
        }

        location / {
            return 200 "api\n";
        }
    }

    server {
        listen 4000;

        # The hashed bundles, immutable; a name no build has (gone-), or that only an older
        # build had (old-), is a plain 404, in text as the real one.
        location /build/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            return 200 "bundle\n";
        }

        location ~ "^/build/(?:gone|old|brief)-" {
            types        { }
            default_type text/plain;
            charset      utf-8;
            return       404 "Not Found";
        }

        # What the SSR server receives of the prerender pass's marker: nothing, nginx clears it.
        location = /en/prerender-header {
            add_header Cache-Control "no-store";
            return 200 "[$http_x_lodb_prerender]\n";
        }

        # Tells what trace context the SSR server received; never kept, so each request shows
        # its own.
        location = /en/trace {
            add_header Cache-Control      "no-store";
            add_header X-Seen-Traceparent "$http_traceparent";
            return 200 "page
";
        }

        # The 404 page it renders for a former URL the API does not know.
        location = /champion/NotAChampion {
            default_type text/html;
            return 404 "not found\n";
        }

        # An account's page, never stored (core/routing/response/cache-control.ts).
        location ^~ /en/account/ {
            default_type text/html;
            add_header Cache-Control "private, no-store";
            return 200 "private\n";
        }

        # The latest patch (the API's /api/meta above) pinned in the path: a 301 to the short
        # URL, kept a minute (core/routing/canonical.ts, CACHE_CONTROL.transient).
        location ~ "^/(?<latest_locale>[a-z]{2}(?:-han[st])?)/15\.10\.1/(?<latest_page>.+)$" {
            add_header Cache-Control "public, max-age=0, s-maxage=60";
            return 301 /$latest_locale/$latest_page;
        }

        # A past patch's page, kept a year (core/routing/response/cache-control.ts), with the
        # policy its render hashed.
        location ~ "^/[a-z]{2}/[0-9]" {
            default_type    text/html;
            gzip            on;
            gzip_min_length 1;
            gzip_vary       on;
            add_header Cache-Control           "public, max-age=3600, s-maxage=31536000";
            add_header Content-Security-Policy "script-src 'sha256-rendered'";
            return 200 "archive\n";
        }

        # A page, compressed when asked for gzip and varying on it, as the SSR server does
        # (src/server/compression).
        location / {
            default_type    text/html;
            gzip            on;
            gzip_min_length 1;
            gzip_vary       on;
            add_header Cache-Control "public, max-age=0, s-maxage=300";
            return 200 "page\n";
        }
    }

    # The page store, an S3 bucket read in path style: lodb-pages, its pages on epoch 5. A key it
    # does not hold answers S3's 404 and its error document; one version stands for each of its
    # other answers. Every request it gets is logged. Over TLS (9443), its certificate is one
    # that no authority signed (lib/self-signed-certificate.mjs).
    server {
        listen 9000;
        listen 9443 ssl;
        ssl_certificate     /tmp/store.crt;
        ssl_certificate_key /tmp/store.key;
        access_log /tmp/store-requests.log store_requests;
        default_type application/xml;

        # A page as a pass stores it: compressed once (the file comes from lib/stack.mjs), its
        # own headers in metadata, the lifetime the SSR server sent then, a store's own headers,
        # those of the local stack's simulated one (moto, compose.override.yaml): no
        # x-amz-request-id, the upload's checksum and hash echoed, a CORS answer. Served from a
        # file, it carries the validators and the ranges S3 states of an object (ETag,
        # Last-Modified, Accept-Ranges).
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.2\.1/" {
            root         /tmp;
            try_files    /stored-page.gz =500;
            default_type text/html;
            charset      utf-8;
            add_header   Content-Encoding    gzip;
            add_header   Cache-Control       "public, max-age=3600, s-maxage=604800";
            add_header   x-amzn-requestid    stub-request;
            add_header   x-amz-id-2          stub-host;
            add_header   x-amz-storage-class ONEZONE_IA;
            add_header   x-amz-content-sha256 UNSIGNED-PAYLOAD;
            add_header   x-amz-sdk-checksum-algorithm CRC32;
            add_header   x-amz-checksum-crc32 AAAAAA==;
            add_header   Access-Control-Allow-Origin "*";
            add_header   x-amz-meta-content-security-policy "script-src 'sha256-stored'";
            add_header   x-amz-meta-content-security-policy-report-only
                         "require-trusted-types-for 'script'";
            add_header   x-amz-meta-reporting-endpoints 'csp="/api/csp-reports"';
            add_header   x-amz-meta-link "<https://ddragon.leagueoflegends.com>; rel=preconnect";
            add_header   x-amz-meta-lodb-build 5e5e5e5e;
        }

        # Tells what nginx sent along with a page's key: its Host, and none of the client's
        # headers.
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.8\.1/" {
            set $sent "$http_cookie$http_authorization$http_x_amz_security_token";
            set $sent "$sent$http_user_agent$http_x_forwarded_for$http_traceparent";
            add_header x-amz-request-id tx000000000000000000002-stub;
            return 200 "[$http_host][$sent]\n";
        }

        # A page of the open state (revisable), whose render chose that class's lifetime
        # (core/routing/response/cache-control.ts).
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/14\.1\.1/" {
            root         /tmp;
            try_files    /stored-page.gz =500;
            default_type text/html;
            add_header   Content-Encoding      gzip;
            add_header   Cache-Control
                         "public, max-age=3600, s-maxage=3600, stale-while-revalidate=3600";
            add_header   x-amz-meta-lodb-build 5e5e5e5e;
        }

        # A page whose object lives a second, beside the bundle of the same lifetime: nginx
        # reads the page from the store at every request, and keeps the bundle a year.
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/14\.2\.1/" {
            root         /tmp;
            try_files    /stored-page.gz =500;
            default_type text/html;
            add_header   Content-Encoding      gzip;
            add_header   Cache-Control         "public, max-age=3600, s-maxage=1";
            add_header   x-amz-meta-lodb-build 5e5e5e5e;
        }

        # A page stored without its policy nor its type: S3 then answers its default type.
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.9\.1/" {
            root         /tmp;
            try_files    /stored-page.gz =500;
            default_type binary/octet-stream;
            add_header   Content-Encoding      gzip;
            add_header   x-amz-meta-lodb-build 5e5e5e5e;
        }

        # A key no reader may see, or a missing one to a reader without the right to list.
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.3\.1/" {
            return 403 "<Error><Code>AccessDenied</Code></Error>\n";
        }

        # Scaleway's throttling: a 429, never S3's 503 SlowDown.
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.4\.1/" {
            return 429 "<Error><Code>TooManyRequests</Code></Error>\n";
        }

        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.5\.1/" {
            return 500 "<Error><Code>InternalError</Code></Error>\n";
        }

        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.6\.1/" {
            return 503 "<Error><Code>ServiceUnavailable</Code></Error>\n";
        }

        # A store that never answers: a listener that reads and stays silent (lib/stack.mjs).
        location ~ "^/lodb-pages/pages/5/[a-z]{2}/15\.7\.1/" {
            proxy_pass         http://127.0.0.1:9001;
            proxy_read_timeout 60s;
        }

        # The bundles of the older builds, copied by a pass before any of their pages. A name
        # it does not hold answers 403, as S3 to a reader without the right to list.
        location /lodb-pages/build/ {
            return 403 "<Error><Code>AccessDenied</Code></Error>\n";
        }

        location = /lodb-pages/build/old-ABCD1234.js {
            default_type text/javascript;
            add_header   Cache-Control    "public, max-age=31536000, immutable";
            add_header   ETag             '"0f343b0931126a20f133d67c2b018a3b"';
            add_header   Last-Modified    "Tue, 20 Oct 2026 08:00:00 GMT";
            add_header   Accept-Ranges    bytes;
            add_header   x-amz-request-id tx000000000000000000003-stub;
            add_header   x-amz-id-2       stub-host;
            add_header   x-amzn-requestid stub-request;
            add_header   Access-Control-Allow-Origin "*";
            return 200 "stored bundle\n";
        }

        # A bundle whose object says it lives a second: a bundle is kept a year whatever it says.
        location = /lodb-pages/build/brief-ABCD1234.js {
            default_type text/javascript;
            add_header   Cache-Control "public, max-age=1, s-maxage=1";
            return 200 "brief bundle\n";
        }

        location / {
            return 404 "<Error><Code>NoSuchKey</Code></Error>\n";
        }
    }
}
