# Overlay of compose.yaml + compose.override.yaml for check-secret-files.sh: the secrets reach
# the API, migrate and Postgres as files, as compose.deploy.yaml mounts them on a host, while
# the environment holds wrong values for some of them, which the files must override. The API
# signs in as its own role with the password split-env.sh drew, which migrate sets.
# LODB_SECRET_FILES_DIR is the folder split-env.sh wrote; LODB_CHECK_SMTP_AUTH the only
# login Mailpit then accepts.

x-database-password: &database-password
  source: LODB_DB_PASSWORD
  target: LoDb__Database__Password

services:
  api:
    environment:
      ConnectionStrings__LoDb: >-
        Host=postgres;Port=5432;Database=lodb;Username=lodb_app;Gss Encryption Mode=Disable;Timeout=5
      LoDb__Mail__Username: lodb
      LoDb__Mail__Password: wrong-password-from-the-environment
      LoDb__Billing__StripeWebhookSecret: whsec_wrong_secret_from_the_environment
      LoDb__Contact__Recipient: team@example.test
    secrets:
      - source: LODB_APP_DB_PASSWORD
        target: LoDb__Database__Password
      - LoDb__DataProtection__CertificatePassword
      - LoDb__Mail__Password
      - LoDb__Billing__StripeSecretKey
      - LoDb__Billing__StripeWebhookSecret
      - LoDb__Accounts__Google__ClientSecret
      - LoDb__Accounts__Google__AppClients__0__ClientSecret
      - LoDb__Accounts__Google__AppClients__1__ClientSecret
      - LoDb__Analytics__VisitorKey

  migrate:
    environment:
      ConnectionStrings__LoDb: >-
        Host=postgres;Port=5432;Database=lodb;Username=lodb;Gss Encryption Mode=Disable;Timeout=5
      LoDb__Database__AppRole__Password: wrong-app-password-from-the-environment
    secrets:
      - *database-password
      - source: LODB_APP_DB_PASSWORD
        target: LoDb__Database__AppRole__Password

  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
    secrets:
      - source: LODB_DB_PASSWORD
        target: postgres-password

  mailpit:
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: !reset null
      MP_SMTP_AUTH: ${LODB_CHECK_SMTP_AUTH:?LODB_CHECK_SMTP_AUTH is set by check-secret-files.sh}

secrets:
  LODB_DB_PASSWORD:
    file: ${LODB_SECRET_FILES_DIR:?}/LODB_DB_PASSWORD
  LODB_APP_DB_PASSWORD:
    file: ${LODB_SECRET_FILES_DIR:?}/LODB_APP_DB_PASSWORD
  LoDb__DataProtection__CertificatePassword:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__DataProtection__CertificatePassword
  LoDb__Mail__Password:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__Mail__Password
  LoDb__Billing__StripeSecretKey:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__Billing__StripeSecretKey
  LoDb__Billing__StripeWebhookSecret:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__Billing__StripeWebhookSecret
  LoDb__Accounts__Google__ClientSecret:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__Accounts__Google__ClientSecret
  LoDb__Accounts__Google__AppClients__0__ClientSecret:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__Accounts__Google__AppClients__0__ClientSecret
  LoDb__Accounts__Google__AppClients__1__ClientSecret:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__Accounts__Google__AppClients__1__ClientSecret
  LoDb__Analytics__VisitorKey:
    file: ${LODB_SECRET_FILES_DIR:?}/LoDb__Analytics__VisitorKey
