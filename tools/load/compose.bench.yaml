# Load bench overlay (tools/load/README.md), applied AFTER compose.override.yaml and never
# on a served host:
#
#   docker compose -p lodb-dev-e1 -f compose.yaml -f compose.override.yaml \
#     -f tools/load/compose.bench.yaml up -d --build --wait
#
# The dev overlay lifts the bounds of the SSR, the API and nginx for the E2E suite, which
# comes from one address far faster than a visitor. A bench run with those lifted measures
# nothing: every key lifted there gets back what a served host has. tools/load/test fails
# when one is left with its lifted value, a new one included.
#
# How each comes back, since Compose applies no per-key `!reset` of a third file to a key the
# second one added: the SSR's and nginx's get compose.yaml's own entry again (empty for the
# SSR, which then keeps its defaults; the image's default for nginx, which refuses an empty
# value); the API's, which compose.yaml does not set, are named without a value, as
# compose.deploy.yaml passes them, so the container gets none and the code's default applies.
# Exported in the caller's shell, any of them still reaches the stack: the way to bench a
# proposed bound.
#
# Each container also gets the memory limit of compose.deploy.yaml and the CPU quotas planned
# for the served host (4 shared vCPU): what the bench reads in cores is what the host gives.

services:
  api:
    environment:
      LoDb__Catalog__ColdLoadConcurrency:
      LoDb__Catalog__ColdLoadsPerSecond:
      LoDb__Catalog__PublicColdLoadsPerSecond:
      LoDb__Catalog__ColdLoadBurst:
      LoDb__Catalog__WarmUp__MaxStreams:
      LoDb__Catalog__WarmUp__MaxStreamsPerClient:
      LoDb__Catalog__WarmUp__PerClientPerHour:
      LoDb__Ingestion__ColdDatasetsPerMinute:
      LoDb__Ingestion__ColdImagesPerMinute:
      LoDb__Ingestion__MaxWaitingIngestions:
      LoDb__Ingestion__SlotWait:
      LoDb__RateLimiting__SignInPerWindow:
      LoDb__Builds__Votes__MinimumAccountAge:
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 1152m
          pids: 512

  migrate:
    deploy:
      resources:
        limits:
          memory: 128m

  web-ssr:
    environment:
      LODB_RENDER_MAX_IN_FLIGHT: ${LODB_RENDER_MAX_IN_FLIGHT:-}
      LODB_PINNED_RENDER_MAX_IN_FLIGHT: ${LODB_PINNED_RENDER_MAX_IN_FLIGHT:-}
      LODB_PINNED_RENDERS_PER_MINUTE: ${LODB_PINNED_RENDERS_PER_MINUTE:-}
      LODB_PINNED_RENDER_BURST: ${LODB_PINNED_RENDER_BURST:-}
      LODB_CURRENT_RENDERS_PER_MINUTE: ${LODB_CURRENT_RENDERS_PER_MINUTE:-}
      LODB_CURRENT_RENDER_BURST: ${LODB_CURRENT_RENDER_BURST:-}
      LODB_RENDER_PER_CLIENT_MAX_IN_FLIGHT: ${LODB_RENDER_PER_CLIENT_MAX_IN_FLIGHT:-}
      LODB_PINNED_RENDERS_PER_CLIENT_PER_MINUTE: ${LODB_PINNED_RENDERS_PER_CLIENT_PER_MINUTE:-}
      LODB_CURRENT_RENDERS_PER_CLIENT_PER_MINUTE: ${LODB_CURRENT_RENDERS_PER_CLIENT_PER_MINUTE:-}
      LODB_CURRENT_RENDER_PER_CLIENT_BURST: ${LODB_CURRENT_RENDER_PER_CLIENT_BURST:-}
      LODB_RENDER_DEADLINE_SECONDS: ${LODB_RENDER_DEADLINE_SECONDS:-}
      LODB_RENDER_API_TIMEOUT_SECONDS: ${LODB_RENDER_API_TIMEOUT_SECONDS:-}
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 704m
          pids: 256

  nginx:
    environment:
      LODB_PAGES_RATE: ${LODB_PAGES_RATE:-20r/s}
      LODB_PAGES_BURST: ${LODB_PAGES_BURST:-100}
      LODB_API_READS_RATE: ${LODB_API_READS_RATE:-10r/s}
      LODB_API_READS_BURST: ${LODB_API_READS_BURST:-40}
      LODB_LEGACY_RATE: ${LODB_LEGACY_RATE:-2r/s}
      LODB_LEGACY_BURST: ${LODB_LEGACY_BURST:-10}
      LODB_SITEMAPS_RATE: ${LODB_SITEMAPS_RATE:-1r/s}
      LODB_SITEMAPS_BURST: ${LODB_SITEMAPS_BURST:-20}
      # The load generator runs on this network and states each client's address in
      # X-Forwarded-For, as the shared edge does on a host: nginx believes this subnet only.
      LODB_EDGE_CIDR: ${LODB_BENCH_SUBNET:-10.213.7.0/24}
    cpu_shares: 2048
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m
          pids: 256

  postgres:
    cpu_shares: 1024
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
          pids: 256

networks:
  # A fixed subnet, outside Docker's default pools (172.17.0.0/12, 192.168.0.0/16), so that
  # LODB_EDGE_CIDR above can name it before the network exists.
  default:
    ipam:
      config:
        - subnet: ${LODB_BENCH_SUBNET:-10.213.7.0/24}
