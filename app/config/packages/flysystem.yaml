# DDragon storage: a local directory (the `storage` volume, shared read-only with
# nginx and go-api). The atomic-write adapter wrapping the local one is defined in
# services.yaml. Public visibility is required, not cosmetic: the local adapter
# creates directories 0700 by default, which nginx (another uid) cannot traverse.
flysystem:
    storages:
        ddragon.storage:
            service: 'App\Service\Storage\AtomicWriteAdapter'
            visibility: public
            directory_visibility: public
