# เนื้อหาสำหรับหน้า /about, /about/data และ /faq
# รหัส faq.* ถูกประกาศไว้ใน App\Controller\AboutController::FAQ_ENTRIES
eyebrow: "เกี่ยวกับ"

index:
  title: "เกี่ยวกับ League Of Data Base"
  lead: "League Of Data Base คือสารานุกรม League of Legends ที่ใช้งานฟรี รวมแชมเปียน ไอเทม รูน และสเปลผู้เรียกทั้งหมด สำหรับทุกแพตช์ ใน 21 ภาษา"
  what:
    title: "เว็บไซต์นี้คืออะไร"
    body: "League Of Data Base เป็นเว็บไซต์อ้างอิงสำหรับข้อมูลเกม League of Legends โดยเผยแพร่ไฟล์ของตัวเกมเอง ทั้งแชมเปียน ไอเทม รูน และสเปลผู้เรียก ในรูปแบบหน้าเว็บที่อ่านง่าย ค้นดู กรอง และเปรียบเทียบได้ ทุกค่ามาจาก Data Dragon ซึ่งเป็นชุดข้อมูลอย่างเป็นทางการของ Riot สิ่งที่คุณอ่านที่นี่จึงเป็นสิ่งที่อยู่ในเกมจริง ไม่ใช่การประมาณหรือการคาดเดาของชุมชน"
  audience:
    title: "เหมาะกับใคร"
    body: "ผู้เล่นที่ต้องการตรวจสอบสกิลของแชมเปียนหรือราคาไอเทมระหว่างเกม ผู้ที่เปรียบเทียบค่าต่าง ๆ ข้ามแพตช์ ครีเอเตอร์ที่ต้องการตัวเลขที่แม่นยำ และนักพัฒนาที่ต้องการข้อมูลเดียวกันผ่าน API ไม่มีส่วนใดถูกซ่อนหลังการเข้าสู่ระบบ การอ่านไม่ต้องใช้บัญชี"
  features:
    title: "คุณทำอะไรได้บ้างที่นี่"
    codex:
      title: "เปิดดูคลังข้อมูลทั้งหมด"
      body: "หน้ารายละเอียดของแชมเปียนทุกตัว (สกิล สกิน ค่าพื้นฐาน เนื้อเรื่อง) ไอเทมทุกชิ้น (ราคา ค่าสถานะ เส้นทางการอัปเกรด) รูนทุกสาย และสเปลผู้เรียกทุกอัน พร้อมการค้นหาทันทีและตัวกรองในทุกรายการ"
    patches:
      title: "ย้อนดูข้ามแพตช์"
      body: "สลับไปยังแพตช์ใดก็ได้ของ Data Dragon แล้วอ่านเว็บไซต์ในสภาพเดียวกับเวอร์ชันนั้น หน้าเก่ามีที่อยู่ของตัวเอง ลิงก์ไปยังแพตช์ในอดีตจึงยังคงถูกต้องเสมอ"
    languages:
      title: "อ่านในภาษาของคุณ"
      body: "ทั้งอินเทอร์เฟซและข้อมูลเกมมีให้ใน 21 ภาษาที่ Riot เผยแพร่ ตั้งแต่อังกฤษและฝรั่งเศส ไปจนถึงเกาหลี ญี่ปุ่น อาหรับ และภาษาจีนทั้งสองรูปแบบการเขียน"
    builds:
      title: "สร้างและแชร์บิลด์"
      body: "ประกอบบิลด์ไอเทมทีละขั้นในตัวแก้ไขคลังอาวุธ แล้วแชร์ด้วยลิงก์ บิลด์สามารถถูกโหวตได้ และโปรไฟล์สาธารณะจะรวบรวมบิลด์ที่คุณเผยแพร่"
    trends:
      title: "ดูว่าอะไรกำลังถูกค้นหา"
      body: "หน้าแนวโน้มจัดอันดับแชมเปียน ไอเทม และรูนที่ถูกเปิดดูมากที่สุดบนเว็บไซต์ ซึ่งสะท้อนความสนใจของชุมชน ไม่ใช่สถิติจากการแข่งขัน"
    api:
      title: "เรียกใช้ข้อมูลผ่านโปรแกรม"
      body: "API แบบ REST ที่ให้ผลลัพธ์เป็น JSON เปิดให้เข้าถึงโปรไฟล์สาธารณะ บิลด์ที่แชร์ และแนวโน้มการเข้าชม พร้อมระดับใช้งานฟรีและแพ็กเครดิตแบบเสียเงินสำหรับการใช้งานหนัก"
    offline:
      title: "ติดตั้งแล้วใช้งานต่อได้"
      body: "เว็บไซต์เป็นโปรเกรสซีฟเว็บแอปที่ติดตั้งได้ เพิ่มไว้ที่หน้าจอหลักของคุณ แล้วหน้าที่เคยเข้าชมจะยังอ่านได้แม้ไม่มีการเชื่อมต่อ"
  data:
    title: "ข้อมูลมาจากไหน"
    body: "ทุกค่าบนเว็บไซต์อ่านมาจาก Data Dragon ของ Riot Games ซึ่งเป็นการส่งออกข้อมูลเกม League of Legends แบบคงที่อย่างเป็นทางการ เสริมด้วย Community Dragon สำหรับสีโครมาของสกิน ไม่มีการแก้ไขด้วยมือ เว็บไซต์นี้ทำหน้าที่อ่าน ไม่ใช่แก้ไข"
    link: "อ่านหน้าข้อมูลและแหล่งที่มาฉบับเต็ม"
  who:
    title: "ใครเป็นผู้ดูแล"
    body: "League Of Data Base เป็นโครงการอิสระ สร้างและดูแลโดยนักพัฒนาเพียงคนเดียว และได้รับทุนจากการบริจาคโดยสมัครใจ ไม่มีโฆษณาและไม่ขายข้อมูลส่วนบุคคล"
    opensource: "ซอร์สโค้ดเปิดเผยต่อสาธารณะที่"
  more:
    title: "ดูเพิ่มเติม"

data:
  title: "ข้อมูลและแหล่งที่มา"
  lead: "เว็บไซต์นี้เผยแพร่อะไร มาจากไหน ใหม่แค่ไหน และอะไรที่ตั้งใจไม่กล่าวอ้าง"
  dataset_name: "ข้อมูลเกม League of Legends — แพตช์ %version%"
  snapshot:
    title: "ภาพรวมปัจจุบัน"
    patch: "แพตช์"
    languages: "ภาษา"
    patches: "แพตช์ทั้งหมด"
  sources:
    title: "แหล่งข้อมูลต้นทาง"
    body: "เว็บไซต์ไม่มีข้อมูลเกมเป็นของตนเอง ทุกสิ่งที่แสดงถูกดึงมาจากชุดข้อมูลอย่างเป็นทางการและนำเสนอตามที่เผยแพร่"
    ddragon:
      title: "Data Dragon (Riot Games)"
      body: "แหล่งข้อมูลหลัก คือการส่งออกข้อมูลคงที่อย่างเป็นทางการของ Riot ซึ่งออกในทุกแพตช์ ให้ทั้งแชมเปียน ไอเทม รูน สเปลผู้เรียก ข้อความที่แปลแล้ว และรูปภาพ"
    cdragon:
      title: "Community Dragon"
      body: "ใช้เพียงอย่างเดียวคือสีโครมาของสกินแชมเปียน ซึ่ง Data Dragon ระบุว่ามีอยู่แต่ไม่เคยอธิบาย ชื่อสีที่แสดงที่นี่มาจากเฉดสีจริงของภาพ ไม่ใช่ชื่อผลิตภัณฑ์ของ Riot"
  freshness:
    title: "ความใหม่ของข้อมูล"
    body: "แพตช์ใหม่จะถูกดึงจากรายการเวอร์ชันของ Riot ทันทีที่ปรากฏ โดยปกติภายในไม่กี่ชั่วโมงหลังแพตช์เข้าสู่เกม แพตช์ก่อนหน้าจะถูกเก็บไว้และยังเปิดดูได้ ไม่มีอะไรหายไปเมื่อมีแพตช์ใหม่"
  coverage:
    title: "ครอบคลุมอะไรบ้าง"
    body: "สำหรับแต่ละแพตช์และแต่ละภาษา เว็บไซต์เผยแพร่:"
    champions: "แชมเปียน — สกิล ค่าพื้นฐานและการเพิ่มต่อเลเวล บทบาท ประเภททรัพยากร สกินและโครมา เนื้อเรื่อง"
    items: "ไอเทม — ราคาทอง เส้นทางการอัปเกรด มูลค่าขาย ค่าสถานะ หมวดหมู่ และการใช้งานได้ตามแมป"
    runes: "สายรูน — ทุกช่อง รูนหลักและรูนรอง พร้อมข้อความอธิบายผล"
    summoners: "สเปลผู้เรียก — เวลาคูลดาวน์ ระยะ ระดับที่ปลดล็อก และโหมดเกม"
  limits:
    title: "ข้อจำกัดที่ยอมรับ"
    body: "เว็บไซต์นี้รายงานสิ่งที่อยู่ในไฟล์เกม ไม่คำนวณอัตราชนะ อัตราการเลือก หรือทีเรียลิสต์ และไม่เก็บประวัติการแข่งขัน สิ่งเหล่านั้นมาจากข้อมูลการเล่นจริงซึ่ง Data Dragon ไม่ได้ให้ไว้ ส่วนคำอธิบายสกิลที่ Riot ปล่อยตัวแปรไว้โดยไม่แทนค่า จะแสดงตามต้นฉบับแทนการเดา"
  reuse:
    title: "การนำข้อมูลไปใช้ต่อ"
    body: "ข้อมูลเกมเป็นของ Riot Games และยังคงอยู่ภายใต้เงื่อนไขของ Riot ส่วนข้อมูลที่เว็บไซต์สร้างขึ้นเอง ได้แก่ แนวโน้มการเข้าชม โปรไฟล์สาธารณะ และบิลด์ที่แชร์ สามารถเข้าถึงได้ผ่าน API แบบ JSON ที่มีเอกสารประกอบ"
    link: "ดู API สำหรับนักพัฒนา"
  disclaimer:
    title: "ข้อความปฏิเสธความรับผิดเกี่ยวกับ Riot Games"
    body: "League Of Data Base ไม่ได้รับการรับรองจาก Riot Games และไม่สะท้อนมุมมองหรือความคิดเห็นของ Riot Games หรือผู้ใดที่มีส่วนเกี่ยวข้องอย่างเป็นทางการในการผลิตหรือบริหารจัดการ League of Legends ทั้งนี้ League of Legends และ Riot Games เป็นเครื่องหมายการค้าหรือเครื่องหมายการค้าจดทะเบียนของ Riot Games, Inc."

faq:
  title: "คำถามที่พบบ่อย"
  lead: "คำตอบตรงไปตรงมาว่าเว็บไซต์นี้คืออะไร ข้อมูลมาจากไหน และคุณทำอะไรกับมันได้บ้าง"
  more:
    title: "ยังหาไม่เจอใช่ไหม"
    body: "หน้าเหล่านี้ให้รายละเอียดมากกว่า:"
  what-is-it:
    question: "League Of Data Base คืออะไร"
    answer: "League Of Data Base คือสารานุกรมออนไลน์ที่ใช้งานฟรีสำหรับ League of Legends ให้คุณค้นดูแชมเปียน ไอเทม รูน และสเปลผู้เรียกทุกอย่างในเกมพร้อมค่าสถานะที่แม่นยำ สำหรับทุกแพตช์และใน 21 ภาษา เป็นโครงการอิสระ ไม่ใช่เว็บไซต์อย่างเป็นทางการของ Riot Games"
  data-source:
    question: "ข้อมูลมาจากไหน"
    answer: "ข้อมูลเกมทั้งหมดมาจาก Data Dragon ซึ่งเป็นการส่งออกข้อมูลคงที่อย่างเป็นทางการที่ Riot Games เผยแพร่ในทุกแพตช์ ส่วนสีโครมาของสกินที่ Data Dragon ไม่ได้อธิบายไว้ มาจาก Community Dragon เว็บไซต์ไม่ได้แก้ไขค่าเหล่านี้ เพียงอ่านและนำเสนอเท่านั้น"
  freshness:
    question: "ข้อมูลอัปเดตบ่อยแค่ไหน"
    answer: "แพตช์ใหม่จะถูกตรวจพบจากรายการเวอร์ชันของ Riot ทันทีที่เผยแพร่ โดยปกติภายในไม่กี่ชั่วโมงหลังแพตช์เข้าสู่เกม แพตช์เก่ายังคงเปิดดูได้ คุณจึงย้อนกลับไปอ่านเว็บไซต์ในสภาพของเวอร์ชันก่อนหน้าได้เสมอ"
  languages:
    question: "มีภาษาอะไรบ้าง"
    answer: "เว็บไซต์มีให้ใน 21 ภาษาที่ Riot เผยแพร่ข้อมูลเกม ได้แก่ อังกฤษ ฝรั่งเศส เยอรมัน สเปน อิตาลี โปรตุเกส โปแลนด์ โรมาเนีย ฮังการี กรีก เช็ก ตุรกี รัสเซีย อาหรับ ไทย เวียดนาม อินโดนีเซีย ญี่ปุ่น เกาหลี จีนตัวย่อ และจีนตัวเต็ม ทั้งอินเทอร์เฟซและข้อความในเกมจะเป็นไปตามภาษาที่คุณเลือก"
  old-patches:
    question: "ดูแพตช์เก่าได้ไหม"
    answer: "ได้ ทุกแพตช์ที่ Riot เผยแพร่ผ่าน Data Dragon ยังเปิดดูได้ และหน้าเก่ามีที่อยู่ถาวรของตัวเอง จึงเปรียบเทียบแชมเปียนหรือไอเทมระหว่างสองเวอร์ชันได้ หรือแชร์ลิงก์ไปยังสภาพที่แน่นอนของแพตช์หนึ่ง ๆ ได้"
  free:
    question: "ใช้ฟรีหรือไม่"
    answer: "ใช่ ทั้งเว็บไซต์ใช้งานได้ฟรี ไม่มีโฆษณาและไม่มีกำแพงเก็บเงิน โดยได้รับทุนจากการบริจาคโดยสมัครใจ มีเพียงการใช้งาน API สำหรับนักพัฒนาอย่างหนักเท่านั้นที่ต้องใช้แพ็กเครดิตแบบเสียเงิน และแม้กระทั่งส่วนนั้นก็ยังมีระดับใช้งานฟรี"
  account:
    question: "ต้องมีบัญชีไหม"
    answer: "ไม่ต้อง การเปิดดูแชมเปียน ไอเทม รูน สเปลผู้เรียก หรือแพตช์ใด ๆ ไม่ต้องใช้บัญชี บัญชีจำเป็นเฉพาะเมื่อต้องการบันทึกรายการโปรด สร้างและแชร์บิลด์ไอเทม และโหวตบิลด์ที่ผู้อื่นแชร์"
  builds:
    question: "สร้างและแชร์บิลด์ไอเทมได้ไหม"
    answer: "ได้ ตัวแก้ไขคลังอาวุธให้คุณประกอบบิลด์ทีละขั้น แล้วเผยแพร่ผ่านลิงก์ที่แชร์ได้ ผู้เข้าชมคนอื่นสามารถโหวตบิลด์ที่แชร์ไว้ และโปรไฟล์สาธารณะของคุณจะแสดงรายการบิลด์ที่คุณเผยแพร่"
  api:
    question: "มี API หรือไม่"
    answer: "มี API แบบ REST ที่ให้ผลลัพธ์เป็น JSON เปิดให้เข้าถึงข้อมูลของเว็บไซต์เอง ได้แก่ โปรไฟล์สาธารณะ บิลด์ที่แชร์ และแนวโน้มการเข้าชม พร้อมระดับใช้งานฟรีและแพ็กเครดิตสำหรับปริมาณที่มากขึ้น ส่วนข้อมูลเกมของ Riot ยังคงเข้าถึงได้โดยตรงจาก Data Dragon"
  offline:
    question: "ใช้งานออฟไลน์ได้ไหม"
    answer: "ได้บางส่วน เว็บไซต์เป็นโปรเกรสซีฟเว็บแอปที่ติดตั้งได้ คุณเพิ่มไว้ที่หน้าจอหลักหรือเดสก์ท็อปได้ และหน้าที่เคยเข้าชมจะยังอ่านได้แม้ไม่มีการเชื่อมต่อ ส่วนหน้าใหม่ยังต้องใช้การเชื่อมต่อเครือข่าย"
  riot-affiliation:
    question: "เว็บไซต์นี้เกี่ยวข้องกับ Riot Games หรือไม่"
    answer: "ไม่เกี่ยวข้อง League Of Data Base เป็นโครงการอิสระ ไม่ได้รับการรับรองจาก Riot Games และไม่สะท้อนมุมมองหรือความคิดเห็นของ Riot Games หรือผู้ใดที่มีส่วนเกี่ยวข้องอย่างเป็นทางการในการผลิตหรือบริหารจัดการ League of Legends ทั้งนี้ League of Legends และ Riot Games เป็นเครื่องหมายการค้าหรือเครื่องหมายการค้าจดทะเบียนของ Riot Games, Inc."
