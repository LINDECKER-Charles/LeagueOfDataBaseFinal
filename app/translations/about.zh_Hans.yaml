# /about、/about/data 与 /faq 页面的正文内容。
# faq.* 的标识符在 App\Controller\Editorial\AboutController::FAQ_ENTRIES 中声明。
eyebrow: "关于"

index:
  title: "关于 League Of Data Base"
  lead: "League Of Data Base 是一个免费的《英雄联盟》资料库：涵盖全部英雄、装备、符文与召唤师技能，适用于任意版本，支持 21 种语言。"
  what:
    title: "本站是什么"
    body: "League Of Data Base 是《英雄联盟》游戏数据的参考站点。它把游戏本身的文件——英雄、装备、符文与召唤师技能——发布为可浏览、可筛选、可对比的页面。每一项数值都来自拳头官方的 Data Dragon 数据包：你在这里看到的就是游戏中的内容，而不是估算或社区推测。"
  audience:
    title: "适合谁使用"
    body: "适合在对局间隙查看英雄技能或装备价格的玩家，适合跨版本比较数值的研究者，适合需要精确数字的内容创作者，也适合希望通过 API 获取同一份数据的开发者。没有任何内容需要登录才能查看——阅读无需账号。"
  features:
    title: "你可以在这里做什么"
    codex:
      title: "浏览完整资料"
      body: "为每个英雄（技能、皮肤、基础属性、背景故事）、每件装备（价格、属性、合成路径）、每条符文系与每个召唤师技能提供详情页，所有列表均带即时搜索与筛选。"
    patches:
      title: "在版本之间穿梭"
      body: "切换到任意 Data Dragon 版本，即可按当时的状态阅读本站。历史页面保留各自的网址，因此指向旧版本的链接将永远准确。"
    languages:
      title: "用你的语言阅读"
      body: "界面与游戏数据支持拳头发布的 21 种语言——从英语、法语到韩语、日语、阿拉伯语，以及中文的简体与繁体两种书写形式。"
    builds:
      title: "创建并分享出装"
      body: "在军械库编辑器中逐步搭建装备方案，然后通过链接分享。出装可以被投票，公开主页会汇总你发布的方案。"
    trends:
      title: "查看大家在查什么"
      body: "趋势页面按站内浏览量对英雄、装备与符文排序，反映的是社区关注度，而非对局统计。"
    api:
      title: "通过程序查询数据"
      body: "JSON 格式的 REST API 提供公开主页、分享的出装与浏览趋势，设有免费额度，并为高强度使用提供付费额度包。"
    offline:
      title: "安装后继续查阅"
      body: "本站是可安装的渐进式网页应用：添加到主屏幕后，已访问过的页面在无网络时仍可阅读。"
  data:
    title: "数据来自哪里"
    body: "站内每一项数值都读取自拳头游戏的 Data Dragon 数据包，即《英雄联盟》游戏数据的官方静态导出，并由 Community Dragon 补充皮肤的炫彩信息。没有任何内容经过人工编辑：本站是读取方，而非编辑方。"
    link: "阅读完整的数据与来源页面"
  who:
    title: "由谁运营"
    body: "League Of Data Base 是一个独立项目，由一位开发者独自构建与维护，依靠自愿捐助运作。站内不投放广告，也不出售个人数据。"
    opensource: "源代码公开于"
  more:
    title: "了解更多"

data:
  title: "数据与来源"
  lead: "本站发布了什么、来自何处、更新到什么程度，以及有意不作出的声明。"
  dataset_name: "《英雄联盟》游戏数据 — 版本 %version%"
  snapshot:
    title: "当前快照"
    patch: "版本"
    languages: "语言"
    patches: "版本数"
  sources:
    title: "上游来源"
    body: "本站没有自有的游戏数据。所有展示内容均取自官方数据包，并按发布时的原样提供。"
    ddragon:
      title: "Data Dragon（拳头游戏）"
      body: "主要来源：拳头随每个版本发布的官方静态数据导出，提供英雄、装备、符文、召唤师技能及其本地化文本与图像。"
    cdragon:
      title: "Community Dragon"
      body: "仅用于一件事：英雄皮肤的炫彩变体——Data Dragon 只标记其存在，却从不加以描述。此处显示的颜色名称由图像的实际色相推导而来，并非拳头的产品名称。"
  freshness:
    title: "数据的新鲜度"
    body: "新版本一经发布即从拳头的版本列表中获取，通常在游戏版本上线后数小时内完成。此前的版本会被保留并可继续浏览：新版本到来时不会有内容消失。"
  coverage:
    title: "覆盖范围"
    body: "对每个版本、每种语言，本站发布："
    champions: "英雄——技能、基础属性与每级成长、定位、资源类型、皮肤与炫彩、背景故事。"
    items: "装备——金币价格、合成路径、出售价格、属性、分类以及各地图的可用性。"
    runes: "符文系——每个槽位、基石符文与次级符文及其效果说明。"
    summoners: "召唤师技能——冷却时间、施放距离、解锁等级与适用模式。"
  limits:
    title: "明确的局限"
    body: "本站呈现的是游戏文件中的内容。它不计算胜率、选取率或强度榜，也不保存对局记录：那些数据来自实时对局，而 Data Dragon 并不提供。对于拳头未替换变量的技能描述，本站按原样显示，而不加以猜测。"
  reuse:
    title: "数据的再利用"
    body: "游戏数据归拳头游戏所有，并持续受其条款约束。本站自有的内容——浏览趋势、公开主页与分享的出装——可通过有文档的 JSON API 获取。"
    link: "查看开发者 API"
  disclaimer:
    title: "拳头游戏声明"
    body: "League Of Data Base 未获得拳头游戏认可，也不代表拳头游戏或任何正式参与《英雄联盟》制作或运营人员的观点或意见。《英雄联盟》与 Riot Games 是 Riot Games, Inc. 的商标或注册商标。"

faq:
  title: "常见问题"
  lead: "关于本站是什么、数据从何而来、你可以用它做什么的直接解答。"
  more:
    title: "还没找到答案？"
    body: "以下页面有更详细的说明："
  what-is-it:
    question: "League Of Data Base 是什么？"
    answer: "League Of Data Base 是一个专注于《英雄联盟》的免费在线资料库。你可以在其中查阅游戏中的每个英雄、装备、符文与召唤师技能及其精确数值，适用于任意版本，支持 21 种语言。它是一个独立项目，并非拳头游戏的官方站点。"
  data-source:
    question: "数据从哪里来？"
    answer: "所有游戏数据都来自 Data Dragon，即拳头游戏随每个版本发布的官方静态数据导出。Data Dragon 未加描述的皮肤炫彩则来自 Community Dragon。本站不会修改这些数值，只是读取并呈现它们。"
  freshness:
    question: "数据多久更新一次？"
    answer: "新版本一经发布即从拳头的版本列表中检测到，通常在版本上线后数小时内。旧版本会继续保留，因此你随时可以回溯，按此前版本的状态阅读本站。"
  languages:
    question: "支持哪些语言？"
    answer: "本站支持拳头发布游戏数据所使用的 21 种语言：英语、法语、德语、西班牙语、意大利语、葡萄牙语、波兰语、罗马尼亚语、匈牙利语、希腊语、捷克语、土耳其语、俄语、阿拉伯语、泰语、越南语、印尼语、日语、韩语、简体中文与繁体中文。界面与游戏文本都会随你选择的语言变化。"
  old-patches:
    question: "可以查看旧版本吗？"
    answer: "可以。拳头通过 Data Dragon 发布过的每个版本都可继续浏览，历史页面各有固定网址。因此你能在两个版本之间比较某个英雄或装备，也能分享指向特定版本状态的链接。"
  free:
    question: "是免费的吗？"
    answer: "是的，整个站点免费使用，没有广告，也没有付费墙，由自愿捐助支持运作。只有大量以程序方式调用开发者 API 才涉及付费额度包，而且该 API 同样设有免费额度。"
  account:
    question: "需要账号吗？"
    answer: "不需要。浏览英雄、装备、符文、召唤师技能或任何版本都无需账号。只有在收藏内容、创建并分享装备方案，以及为他人分享的方案投票时才需要账号。"
  builds:
    question: "可以创建并分享装备方案吗？"
    answer: "可以。军械库编辑器让你逐步搭建方案，并以可分享的链接发布。已分享的方案可由其他访客投票，你的公开主页会列出你发布过的方案。"
  api:
    question: "有 API 吗？"
    answer: "有。JSON 格式的 REST API 提供本站自有的数据——公开主页、分享的出装与浏览趋势——设有免费额度，并为更大用量提供额度包。拳头的游戏数据本身仍可直接从 Data Dragon 获取。"
  offline:
    question: "可以离线使用吗？"
    answer: "可以部分离线。本站是可安装的渐进式网页应用：你可以将它添加到主屏幕或桌面，已访问过的页面在无网络时仍可阅读。打开新页面仍需要网络连接。"
  riot-affiliation:
    question: "本站与拳头游戏有关联吗？"
    answer: "没有。League Of Data Base 是一个独立项目，未获得拳头游戏认可，也不代表拳头游戏或任何正式参与《英雄联盟》制作或运营人员的观点或意见。《英雄联盟》与 Riot Games 是 Riot Games, Inc. 的商标或注册商标。"
