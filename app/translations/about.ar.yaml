eyebrow: "حول"

index:
  title: "حول League Of Data Base"
  lead: "‏League Of Data Base موسوعة مجانية للعبة League of Legends: جميع الأبطال والأغراض والشيفرات وتعاويذ المستدعي، لأي تحديث، وبـ21 لغة."
  what:
    title: "ما هذا الموقع"
    body: "‏League Of Data Base موقع مرجعي لبيانات لعبة League of Legends. ينشر ملفات اللعبة نفسها — الأبطال والأغراض والشيفرات وتعاويذ المستدعي — في صفحات مقروءة يمكن تصفحها وتصفيتها ومقارنتها. كل قيمة مأخوذة من توزيعة Data Dragon الرسمية من Riot: ما تقرأه هنا هو ما تتضمنه اللعبة، وليس تقديرًا ولا تخمينًا من المجتمع."
  audience:
    title: "لمن هذا الموقع"
    body: "للاعبين الذين يتحققون من قدرات بطل أو سعر غرض بين المباريات؛ ولمن يقارنون القيم بين تحديث وآخر؛ ولصنّاع المحتوى الذين يحتاجون أرقامًا دقيقة؛ وللمطوّرين الراغبين في البيانات نفسها عبر واجهة برمجية. لا شيء خلف تسجيل الدخول — القراءة لا تتطلب حسابًا."
  features:
    title: "ما يمكنك فعله هنا"
    codex:
      title: "تصفَّح الفهرس كاملًا"
      body: "صفحات مفصّلة لكل بطل (القدرات، الأزياء، الإحصاءات الأساسية، القصة)، ولكل غرض (السعر، الإحصاءات، مسار التركيب)، ولكل مسار شيفرات ولكل تعويذة مستدعٍ، مع بحث فوري ومرشّحات في كل قائمة."
    patches:
      title: "تنقّل بين التحديثات"
      body: "انتقل إلى أي تحديث من Data Dragon واقرأ الموقع كما كان في تلك النسخة. تحتفظ الصفحات التاريخية بعناوينها الخاصة: يظل الرابط إلى تحديث قديم دقيقًا إلى الأبد."
    languages:
      title: "اقرأ بلغتك"
      body: "الواجهة وبيانات اللعبة متاحة بـ21 لغة تنشرها Riot — من الإنجليزية والفرنسية إلى الكورية واليابانية والعربية وكلا نظامَي الكتابة الصينية."
    builds:
      title: "أنشئ تركيبات وشاركها"
      body: "كوّن تركيبة أغراض خطوة بخطوة في محرّر مستودع الأسلحة، ثم شاركها برابط. يمكن التصويت على التركيبات، ويجمع الملف الشخصي العام ما تنشره منها."
    trends:
      title: "اطّلع على الأكثر بحثًا"
      body: "ترتّب صفحة الاتجاهات الأبطال والأغراض والشيفرات الأكثر اطّلاعًا عليها في الموقع — وهي مقياس لاهتمام المجتمع، لا إحصاءات مباريات."
    api:
      title: "استعلم عن البيانات برمجيًا"
      body: "تتيح واجهة REST بصيغة JSON الملفات الشخصية العامة والتركيبات المشتركة واتجاهات الاطّلاع، مع مستوى مجاني وحزم أرصدة مدفوعة للاستخدام المكثّف."
    offline:
      title: "ثبِّته وواصل التصفح"
      body: "الموقع تطبيق ويب تقدّمي قابل للتثبيت: أضفه إلى شاشتك الرئيسية، وستبقى الصفحات التي زرتها سابقًا مقروءة دون اتصال."
  data:
    title: "من أين تأتي البيانات"
    body: "كل قيمة في الموقع تُقرأ من توزيعة Data Dragon من Riot Games، وهي التصدير الثابت الرسمي لبيانات لعبة League of Legends، مع استكمالها من Community Dragon لألوان الأزياء. لا شيء يُحرَّر يدويًا: الموقع قارئ لا محرِّر."
    link: "اقرأ صفحة البيانات والمصادر كاملة"
  who:
    title: "من يديره"
    body: "‏League Of Data Base مشروع مستقل، يبنيه ويصونه مطوّر واحد، ويُموَّل بتبرّعات طوعية. لا يعرض إعلانات ولا يبيع بيانات شخصية."
    opensource: "الشيفرة المصدرية متاحة للعموم على"
  more:
    title: "للمزيد"

data:
  title: "البيانات والمصادر"
  lead: "ما ينشره هذا الموقع، ومن أين يأتي، ومدى حداثته، وما لا يدّعيه عن قصد."
  dataset_name: "بيانات لعبة League of Legends — التحديث %version%"
  snapshot:
    title: "اللقطة الحالية"
    patch: "التحديث"
    languages: "اللغات"
    patches: "التحديثات"
  sources:
    title: "المصادر الأصلية"
    body: "لا يملك الموقع بيانات لعبة خاصة به. كل ما يُعرض يُجلب من توزيعات رسمية ويُقدَّم كما نُشر."
    ddragon:
      title: "‏Data Dragon (‏Riot Games)"
      body: "المصدر الأساسي: التصدير الرسمي للبيانات الثابتة من Riot، الصادر مع كل تحديث. يوفّر الأبطال والأغراض والشيفرات وتعاويذ المستدعي ونصوصها المترجمة وصورها."
    cdragon:
      title: "‏Community Dragon"
      body: "يُستخدم لغرض واحد فقط: تنويعات ألوان أزياء الأبطال، التي يشير إليها Data Dragon دون أن يصفها قط. أسماء الألوان المعروضة هنا مشتقة من درجة اللون الفعلية للصورة، لا من أسماء منتجات Riot."
  freshness:
    title: "مدى حداثة البيانات"
    body: "تُلتقط التحديثات الجديدة من قائمة نسخ Riot فور ظهورها، عادةً خلال ساعات من إطلاق تحديث اللعبة. وتُحفظ التحديثات السابقة وتبقى قابلة للتصفح: لا شيء يختفي عند وصول تحديث جديد."
  coverage:
    title: "ما الذي يشمله"
    body: "لكل تحديث ولكل لغة، ينشر الموقع:"
    champions: "الأبطال — القدرات، الإحصاءات الأساسية والنمو لكل مستوى، الأدوار، نوع المورد، الأزياء والألوان، القصة."
    items: "الأغراض — التكلفة بالذهب، مسار التركيب، قيمة البيع، الإحصاءات، الفئات والتوافر حسب الخريطة."
    runes: "مسارات الشيفرات — كل خانة وشيفرة رئيسية وشيفرة ثانوية مع نص تأثيرها."
    summoners: "تعاويذ المستدعي — زمن الانتظار، المدى، مستوى الفتح، وأنماط اللعب."
  limits:
    title: "حدود معلنة"
    body: "ينقل هذا الموقع ما تحتويه ملفات اللعبة. لا يحسب نسب الفوز أو نسب الاختيار أو قوائم التصنيف، ولا يحتفظ بسجل المباريات: فتلك مشتقة من بيانات اللعب المباشر التي لا يوفرها Data Dragon. أما أوصاف القدرات التي تترك Riot متغيراتها دون حل، فتُعرض كما وردت بدل تخمينها."
  reuse:
    title: "إعادة استخدام البيانات"
    body: "بيانات اللعبة ملك لـ Riot Games وتبقى خاضعة لشروطها. أما إضافات الموقع الخاصة — اتجاهات الاطّلاع والملفات الشخصية العامة والتركيبات المشتركة — فمتاحة عبر واجهة JSON موثّقة."
    link: "اطّلع على واجهة المطوّرين"
  disclaimer:
    title: "إخلاء مسؤولية Riot Games"
    body: "‏League Of Data Base غير معتمد من Riot Games ولا يعكس آراء أو وجهات نظر Riot Games ولا أي شخص مشارك رسميًا في إنتاج League of Legends أو إدارتها. ‏League of Legends و Riot Games علامتان تجاريتان أو علامتان تجاريتان مسجّلتان لشركة Riot Games, Inc."

faq:
  title: "الأسئلة الشائعة"
  lead: "إجابات مباشرة عن ماهية هذا الموقع، ومن أين تأتي بياناته، وما يمكنك فعله بها."
  more:
    title: "ما زلت تبحث؟"
    body: "هذه الصفحات تدخل في تفاصيل أكثر:"
  what-is-it:
    question: "ما هو League Of Data Base؟"
    answer: "‏League Of Data Base موسوعة إلكترونية مجانية مخصصة للعبة League of Legends. تتيح الاطّلاع على كل بطل وغرض وشيفرة وتعويذة مستدعٍ في اللعبة بإحصاءاتها الدقيقة، لأي تحديث وبـ21 لغة. وهو مشروع مستقل، وليس موقعًا رسميًا لـ Riot Games."
  data-source:
    question: "من أين تأتي البيانات؟"
    answer: "تأتي جميع بيانات اللعبة من Data Dragon، وهو التصدير الرسمي للبيانات الثابتة الذي تنشره Riot Games مع كل تحديث. أما ألوان الأزياء التي لا يصفها Data Dragon فتأتي من Community Dragon. لا يعدّل الموقع هذه القيم: بل يقرأها ويعرضها."
  freshness:
    question: "كم مرة تُحدَّث البيانات؟"
    answer: "تُكتشف التحديثات الجديدة من قائمة نسخ Riot فور نشرها، عادةً خلال ساعات من إطلاقها. وتبقى التحديثات القديمة متاحة، فيمكنك دائمًا العودة وقراءة الموقع كما كان في نسخة سابقة."
  languages:
    question: "ما اللغات المتاحة؟"
    answer: "الموقع متاح بـ21 لغة تنشر بها Riot بيانات اللعبة: الإنجليزية والفرنسية والألمانية والإسبانية والإيطالية والبرتغالية والبولندية والرومانية والمجرية واليونانية والتشيكية والتركية والروسية والعربية والتايلاندية والفيتنامية والإندونيسية واليابانية والكورية والصينية المبسطة والصينية التقليدية. وتتبع الواجهة ونصوص اللعبة معًا اللغة التي تختارها."
  old-patches:
    question: "هل يمكنني الاطّلاع على تحديث قديم؟"
    answer: "نعم. يبقى كل تحديث نشرته Riot عبر Data Dragon قابلًا للتصفح، وللصفحات التاريخية عناوين دائمة خاصة بها. يتيح ذلك مقارنة بطل أو غرض بين نسختين، أو مشاركة رابط للحالة الدقيقة لتحديث معيّن."
  free:
    question: "هل هو مجاني؟"
    answer: "نعم، الموقع بأكمله مجاني، بلا إعلانات وبلا محتوى مدفوع. ويُموَّل بتبرعات طوعية. الاستخدام البرمجي المكثّف لواجهة المطوّرين وحده يستلزم حزم أرصدة مدفوعة، وحتى تلك لها مستوى مجاني."
  account:
    question: "هل أحتاج إلى حساب؟"
    answer: "لا، لا يلزم حساب لتصفح الأبطال أو الأغراض أو الشيفرات أو تعاويذ المستدعي أو أي تحديث. الحساب مطلوب فقط لحفظ المفضّلات وإنشاء تركيبات الأغراض ومشاركتها والتصويت على تركيبات الآخرين."
  builds:
    question: "هل يمكنني إنشاء تركيبات أغراض ومشاركتها؟"
    answer: "نعم. يتيح محرّر مستودع الأسلحة تكوين تركيبة خطوة بخطوة ثم نشرها برابط قابل للمشاركة. ويمكن للزوار الآخرين التصويت على التركيبات المشتركة، ويعرض ملفك الشخصي العام ما نشرته منها."
  api:
    question: "هل توجد واجهة برمجية؟"
    answer: "نعم. تتيح واجهة REST بصيغة JSON بيانات الموقع الخاصة — الملفات الشخصية العامة والتركيبات المشتركة واتجاهات الاطّلاع — مع مستوى مجاني وحزم أرصدة للأحجام الأكبر. أما بيانات لعبة Riot نفسها فتبقى متاحة مباشرةً من Data Dragon."
  offline:
    question: "هل يعمل دون اتصال؟"
    answer: "جزئيًا. الموقع تطبيق ويب تقدّمي قابل للتثبيت: يمكنك إضافته إلى شاشتك الرئيسية أو سطح مكتبك، وتبقى الصفحات التي زرتها سابقًا مقروءة دون اتصال. أما الصفحات الجديدة فما زالت تحتاج إلى اتصال بالشبكة."
  riot-affiliation:
    question: "هل هذا الموقع تابع لـ Riot Games؟"
    answer: "لا. ‏League Of Data Base مشروع مستقل، غير معتمد من Riot Games، ولا يعكس آراء أو وجهات نظر Riot Games ولا أي شخص مشارك رسميًا في إنتاج League of Legends أو إدارتها. ‏League of Legends و Riot Games علامتان تجاريتان أو علامتان تجاريتان مسجّلتان لشركة Riot Games, Inc."
