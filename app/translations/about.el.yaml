# Συντακτικό περιεχόμενο για τις σελίδες /about, /about/data και /faq.
# Τα αναγνωριστικά faq.* δηλώνονται στο App\Controller\AboutController::FAQ_ENTRIES.
eyebrow: "Σχετικά"

index:
  title: "Σχετικά με το League Of Data Base"
  lead: "Το League Of Data Base είναι μια δωρεάν εγκυκλοπαίδεια για το League of Legends: όλοι οι ήρωες, τα αντικείμενα, οι ρούνοι και τα ξόρκια επικαλεστή, για κάθε patch, σε 21 γλώσσες."
  what:
    title: "Τι είναι αυτός ο ιστότοπος"
    body: "Το League Of Data Base είναι ιστότοπος αναφοράς για τα δεδομένα του League of Legends. Δημοσιεύει τα ίδια τα αρχεία του παιχνιδιού — ήρωες, αντικείμενα, ρούνους και ξόρκια επικαλεστή — ως ευανάγνωστες σελίδες που μπορείτε να περιηγηθείτε, να φιλτράρετε και να συγκρίνετε. Κάθε τιμή προέρχεται από την επίσημη διανομή Data Dragon της Riot: ό,τι διαβάζετε εδώ είναι ό,τι περιέχει το παιχνίδι, όχι εκτίμηση ή εικασία της κοινότητας."
  audience:
    title: "Σε ποιους απευθύνεται"
    body: "Σε παίκτες που ελέγχουν τις ικανότητες ενός ήρωα ή την τιμή ενός αντικειμένου ανάμεσα σε παιχνίδια· σε όσους συγκρίνουν τιμές από patch σε patch· σε δημιουργούς περιεχομένου που χρειάζονται ακριβή νούμερα· και σε προγραμματιστές που θέλουν τα ίδια δεδομένα μέσω API. Τίποτα δεν απαιτεί σύνδεση — η ανάγνωση δεν χρειάζεται λογαριασμό."
  features:
    title: "Τι μπορείτε να κάνετε εδώ"
    codex:
      title: "Περιηγηθείτε σε ολόκληρο τον κώδικα"
      body: "Αναλυτικές σελίδες για κάθε ήρωα (ικανότητες, εμφανίσεις, βασικά στατιστικά, ιστορία), κάθε αντικείμενο (τιμή, στατιστικά, διαδρομή κατασκευής), κάθε κλάδο ρούνων και κάθε ξόρκι επικαλεστή, με άμεση αναζήτηση και φίλτρα σε κάθε λίστα."
    patches:
      title: "Ταξιδέψτε ανάμεσα στα patch"
      body: "Αλλάξτε σε οποιοδήποτε patch του Data Dragon και διαβάστε τον ιστότοπο όπως ήταν σε εκείνη την έκδοση. Οι ιστορικές σελίδες διατηρούν τη δική τους διεύθυνση: ένας σύνδεσμος προς παλιό patch παραμένει ακριβής για πάντα."
    languages:
      title: "Διαβάστε στη γλώσσα σας"
      body: "Η διεπαφή και τα δεδομένα του παιχνιδιού είναι διαθέσιμα στις 21 γλώσσες που δημοσιεύει η Riot — από τα αγγλικά και τα γαλλικά έως τα κορεατικά, τα ιαπωνικά, τα αραβικά και τις δύο γραφές των κινεζικών."
    builds:
      title: "Δημιουργήστε και μοιραστείτε builds"
      body: "Συνθέστε ένα build αντικειμένων βήμα βήμα στον επεξεργαστή οπλοστασίου και μοιραστείτε το με έναν σύνδεσμο. Τα builds μπορούν να ψηφιστούν και ένα δημόσιο προφίλ συγκεντρώνει όσα δημοσιεύετε."
    trends:
      title: "Δείτε τι αναζητείται"
      body: "Η σελίδα τάσεων κατατάσσει τους ήρωες, τα αντικείμενα και τους ρούνους με τις περισσότερες προβολές στον ιστότοπο — μέτρο της προσοχής της κοινότητας, όχι στατιστικά αγώνων."
    api:
      title: "Αντλήστε τα δεδομένα προγραμματιστικά"
      body: "Ένα REST API σε JSON εκθέτει δημόσια προφίλ, κοινοποιημένα builds και τάσεις προβολών, με δωρεάν επίπεδο και επί πληρωμή πακέτα μονάδων για εντατικότερη χρήση."
    offline:
      title: "Εγκαταστήστε το και συνεχίστε"
      body: "Ο ιστότοπος είναι εγκαταστάσιμη προοδευτική εφαρμογή ιστού: προσθέστε τον στην αρχική οθόνη και οι σελίδες που έχετε ήδη επισκεφθεί παραμένουν αναγνώσιμες χωρίς σύνδεση."
  data:
    title: "Από πού προέρχονται τα δεδομένα"
    body: "Κάθε τιμή του ιστότοπου διαβάζεται από τη διανομή Data Dragon της Riot Games, την επίσημη στατική εξαγωγή των δεδομένων του League of Legends, συμπληρωμένη από το Community Dragon για τα chroma των εμφανίσεων. Τίποτα δεν επεξεργάζεται χειροκίνητα: ο ιστότοπος διαβάζει, δεν συντάσσει."
    link: "Διαβάστε την πλήρη σελίδα για τα δεδομένα και τις πηγές"
  who:
    title: "Ποιος τον λειτουργεί"
    body: "Το League Of Data Base είναι ανεξάρτητο έργο, φτιαγμένο και συντηρούμενο από έναν μόνο προγραμματιστή και χρηματοδοτούμενο από εθελοντικές δωρεές. Δεν προβάλλει διαφημίσεις και δεν πουλά προσωπικά δεδομένα."
    opensource: "Ο πηγαίος κώδικας είναι δημόσιος στο"
  more:
    title: "Πηγαίνετε παρακάτω"

data:
  title: "Δεδομένα και πηγές"
  lead: "Τι δημοσιεύει αυτός ο ιστότοπος, από πού προέρχεται, πόσο πρόσφατο είναι και τι σκόπιμα δεν ισχυρίζεται."
  dataset_name: "Δεδομένα παιχνιδιού League of Legends — patch %version%"
  snapshot:
    title: "Τρέχον στιγμιότυπο"
    patch: "Patch"
    languages: "Γλώσσες"
    patches: "Patch"
  sources:
    title: "Πηγές προέλευσης"
    body: "Ο ιστότοπος δεν διαθέτει δικά του δεδομένα παιχνιδιού. Ό,τι εμφανίζεται αντλείται από επίσημες διανομές και σερβίρεται όπως δημοσιεύτηκε."
    ddragon:
      title: "Data Dragon (Riot Games)"
      body: "Η κύρια πηγή: η επίσημη εξαγωγή στατικών δεδομένων της Riot, που κυκλοφορεί σε κάθε patch. Παρέχει ήρωες, αντικείμενα, ρούνους, ξόρκια επικαλεστή, τα μεταφρασμένα κείμενά τους και τις εικόνες τους."
    cdragon:
      title: "Community Dragon"
      body: "Χρησιμοποιείται για ένα μόνο πράγμα: τις παραλλαγές chroma των εμφανίσεων ηρώων, τις οποίες το Data Dragon επισημαίνει αλλά ποτέ δεν περιγράφει. Οι ετικέτες χρώματος εδώ προκύπτουν από την πραγματική απόχρωση της εικόνας, όχι από εμπορικές ονομασίες της Riot."
  freshness:
    title: "Πόσο πρόσφατα είναι"
    body: "Τα νέα patch εντοπίζονται στη λίστα εκδόσεων της Riot μόλις εμφανιστούν, συνήθως μέσα σε λίγες ώρες από τη δημοσίευση ενός patch. Τα προηγούμενα patch διατηρούνται και παραμένουν προσβάσιμα: τίποτα δεν χάνεται όταν έρχεται καινούριο."
  coverage:
    title: "Τι καλύπτεται"
    body: "Για κάθε patch και κάθε γλώσσα, ο ιστότοπος δημοσιεύει:"
    champions: "Ήρωες — ικανότητες, βασικά στατιστικά και ανάπτυξη ανά επίπεδο, ρόλοι, τύπος πόρου, εμφανίσεις και chroma, ιστορία."
    items: "Αντικείμενα — κόστος σε χρυσό, διαδρομή κατασκευής, αξία πώλησης, στατιστικά, κατηγορίες και διαθεσιμότητα ανά χάρτη."
    runes: "Κλάδοι ρούνων — κάθε θέση, βασικός ρούνος και δευτερεύων ρούνος με το κείμενο του εφέ του."
    summoners: "Ξόρκια επικαλεστή — χρόνος επαναφόρτισης, εμβέλεια, επίπεδο ξεκλειδώματος και λειτουργίες παιχνιδιού."
  limits:
    title: "Αποδεκτά όρια"
    body: "Αυτός ο ιστότοπος αποδίδει όσα περιέχουν τα αρχεία του παιχνιδιού. Δεν υπολογίζει ποσοστά νίκης, ποσοστά επιλογής ή tier lists και δεν κρατά ιστορικό αγώνων: αυτά προκύπτουν από ζωντανά δεδομένα παιχνιδιού, τα οποία το Data Dragon δεν παρέχει. Οι περιγραφές ικανοτήτων των οποίων οι μεταβλητές μένουν άλυτες από τη Riot εμφανίζονται όπως παραδίδονται, χωρίς εικασίες."
  reuse:
    title: "Επαναχρησιμοποίηση των δεδομένων"
    body: "Τα δεδομένα του παιχνιδιού ανήκουν στη Riot Games και εξακολουθούν να υπόκεινται στους όρους της. Οι δικές του προσθήκες — τάσεις προβολών, δημόσια προφίλ και κοινοποιημένα builds — διατίθενται μέσω τεκμηριωμένου JSON API."
    link: "Δείτε το API για προγραμματιστές"
  disclaimer:
    title: "Δήλωση για τη Riot Games"
    body: "Το League Of Data Base δεν υποστηρίζεται από τη Riot Games και δεν αντικατοπτρίζει τις απόψεις ή τις θέσεις της Riot Games ή οποιουδήποτε εμπλέκεται επισήμως στην παραγωγή ή τη διαχείριση του League of Legends. Το League of Legends και η Riot Games είναι εμπορικά σήματα ή σήματα κατατεθέντα της Riot Games, Inc."

faq:
  title: "Συχνές ερωτήσεις"
  lead: "Ξεκάθαρες απαντήσεις για το τι είναι αυτός ο ιστότοπος, από πού προέρχονται τα δεδομένα του και τι μπορείτε να κάνετε με αυτά."
  more:
    title: "Ψάχνετε ακόμη;"
    body: "Αυτές οι σελίδες έχουν περισσότερες λεπτομέρειες:"
  what-is-it:
    question: "Τι είναι το League Of Data Base;"
    answer: "Το League Of Data Base είναι μια δωρεάν διαδικτυακή εγκυκλοπαίδεια αφιερωμένη στο League of Legends. Επιτρέπει την αναζήτηση κάθε ήρωα, αντικειμένου, ρούνου και ξορκιού επικαλεστή του παιχνιδιού, με τα ακριβή στατιστικά τους, για οποιοδήποτε patch και σε 21 γλώσσες. Είναι ανεξάρτητο έργο, όχι επίσημος ιστότοπος της Riot Games."
  data-source:
    question: "Από πού προέρχονται τα δεδομένα;"
    answer: "Όλα τα δεδομένα του παιχνιδιού προέρχονται από το Data Dragon, την επίσημη εξαγωγή στατικών δεδομένων που δημοσιεύει η Riot Games σε κάθε patch. Τα chroma των εμφανίσεων, τα οποία το Data Dragon δεν περιγράφει, προέρχονται από το Community Dragon. Ο ιστότοπος δεν τροποποιεί αυτές τις τιμές: τις διαβάζει και τις παρουσιάζει."
  freshness:
    question: "Πόσο συχνά ενημερώνονται τα δεδομένα;"
    answer: "Τα νέα patch εντοπίζονται στη λίστα εκδόσεων της Riot μόλις δημοσιευτούν, συνήθως μέσα σε λίγες ώρες από τη διάθεσή τους. Τα παλαιότερα patch παραμένουν διαθέσιμα, οπότε μπορείτε πάντα να γυρίσετε πίσω και να διαβάσετε τον ιστότοπο όπως ήταν σε προηγούμενη έκδοση."
  languages:
    question: "Ποιες γλώσσες είναι διαθέσιμες;"
    answer: "Ο ιστότοπος είναι διαθέσιμος στις 21 γλώσσες στις οποίες η Riot δημοσιεύει δεδομένα παιχνιδιού: αγγλικά, γαλλικά, γερμανικά, ισπανικά, ιταλικά, πορτογαλικά, πολωνικά, ρουμανικά, ουγγρικά, ελληνικά, τσεχικά, τουρκικά, ρωσικά, αραβικά, ταϊλανδικά, βιετναμικά, ινδονησιακά, ιαπωνικά, κορεατικά, απλοποιημένα και παραδοσιακά κινεζικά. Τόσο η διεπαφή όσο και τα κείμενα του παιχνιδιού ακολουθούν τη γλώσσα που επιλέγετε."
  old-patches:
    question: "Μπορώ να δω παλαιότερο patch;"
    answer: "Ναι. Κάθε patch που έχει δημοσιεύσει η Riot μέσω του Data Dragon παραμένει προσβάσιμο και οι ιστορικές σελίδες έχουν τη δική τους μόνιμη διεύθυνση. Έτσι μπορείτε να συγκρίνετε έναν ήρωα ή ένα αντικείμενο ανάμεσα σε δύο εκδόσεις ή να παραπέμψετε στην ακριβή κατάσταση ενός συγκεκριμένου patch."
  free:
    question: "Είναι δωρεάν;"
    answer: "Ναι, όλος ο ιστότοπος είναι δωρεάν, χωρίς διαφημίσεις και χωρίς συνδρομητικό τοίχο. Χρηματοδοτείται από εθελοντικές δωρεές. Μόνο η εντατική προγραμματιστική χρήση του API απαιτεί επί πληρωμή πακέτα μονάδων, και ακόμη κι εκεί υπάρχει δωρεάν επίπεδο."
  account:
    question: "Χρειάζομαι λογαριασμό;"
    answer: "Όχι, δεν χρειάζεται λογαριασμός για την περιήγηση σε ήρωες, αντικείμενα, ρούνους, ξόρκια επικαλεστή ή οποιοδήποτε patch. Λογαριασμός απαιτείται μόνο για την αποθήκευση αγαπημένων, τη δημιουργία και κοινοποίηση builds αντικειμένων και την ψηφοφορία σε builds που μοιράζονται άλλοι."
  builds:
    question: "Μπορώ να δημιουργήσω και να μοιραστώ builds αντικειμένων;"
    answer: "Ναι. Ο επεξεργαστής οπλοστασίου επιτρέπει τη σύνθεση ενός build βήμα βήμα και τη δημοσίευσή του με σύνδεσμο κοινοποίησης. Τα κοινοποιημένα builds μπορούν να ψηφιστούν από άλλους επισκέπτες και το δημόσιο προφίλ σας απαριθμεί όσα έχετε δημοσιεύσει."
  api:
    question: "Υπάρχει API;"
    answer: "Ναι. Ένα REST API σε JSON εκθέτει τα δικά του δεδομένα — δημόσια προφίλ, κοινοποιημένα builds και τάσεις προβολών — με δωρεάν επίπεδο και πακέτα μονάδων για μεγαλύτερους όγκους. Τα δεδομένα του παιχνιδιού της Riot παραμένουν διαθέσιμα απευθείας από το Data Dragon."
  offline:
    question: "Λειτουργεί εκτός σύνδεσης;"
    answer: "Εν μέρει. Ο ιστότοπος είναι εγκαταστάσιμη προοδευτική εφαρμογή ιστού: μπορείτε να τον προσθέσετε στην αρχική οθόνη ή στην επιφάνεια εργασίας και οι σελίδες που έχετε ήδη επισκεφθεί παραμένουν αναγνώσιμες χωρίς σύνδεση. Οι νέες σελίδες εξακολουθούν να απαιτούν πρόσβαση στο δίκτυο."
  riot-affiliation:
    question: "Συνδέεται αυτός ο ιστότοπος με τη Riot Games;"
    answer: "Όχι. Το League Of Data Base είναι ανεξάρτητο έργο, δεν υποστηρίζεται από τη Riot Games και δεν αντικατοπτρίζει τις απόψεις ή τις θέσεις της Riot Games ή οποιουδήποτε εμπλέκεται επισήμως στην παραγωγή ή τη διαχείριση του League of Legends. Το League of Legends και η Riot Games είναι εμπορικά σήματα ή σήματα κατατεθέντα της Riot Games, Inc."
