# /about, /about/data, /faq 페이지의 본문입니다.
# faq.* 식별자는 App\Controller\AboutController::FAQ_ENTRIES에 선언되어 있습니다.
eyebrow: "소개"

index:
  title: "League Of Data Base 소개"
  lead: "League Of Data Base는 무료 리그 오브 레전드 백과사전입니다. 모든 챔피언, 아이템, 룬, 소환사 주문을 어떤 패치에서든 21개 언어로 제공합니다."
  what:
    title: "이 사이트는 무엇인가"
    body: "League Of Data Base는 리그 오브 레전드 게임 데이터를 위한 참고 사이트입니다. 게임 자체의 파일인 챔피언, 아이템, 룬, 소환사 주문을 탐색하고 걸러내고 비교할 수 있는 읽기 쉬운 페이지로 공개합니다. 모든 수치는 라이엇의 공식 Data Dragon 배포본에서 가져오므로, 여기에서 보는 내용은 게임에 실제로 담긴 값이며 추정치나 커뮤니티의 짐작이 아닙니다."
  audience:
    title: "누구를 위한 것인가"
    body: "경기 사이에 챔피언의 스킬이나 아이템 가격을 확인하는 플레이어, 패치 간 수치를 비교하는 이용자, 정확한 숫자가 필요한 콘텐츠 제작자, 그리고 같은 데이터를 API로 쓰려는 개발자를 위한 사이트입니다. 로그인 뒤에 숨겨진 내용은 없으며, 열람에 계정이 필요하지 않습니다."
  features:
    title: "여기에서 할 수 있는 것"
    codex:
      title: "전체 자료 살펴보기"
      body: "챔피언별(스킬, 스킨, 기본 능력치, 배경 이야기), 아이템별(가격, 능력치, 조합 경로), 룬 계열별, 소환사 주문별 상세 페이지를 제공합니다. 모든 목록에 즉시 검색과 필터가 있습니다."
    patches:
      title: "패치 사이를 오가기"
      body: "Data Dragon의 어떤 패치로든 전환해 그 버전 당시의 모습 그대로 사이트를 볼 수 있습니다. 과거 페이지는 고유 주소를 유지하므로, 지난 패치로 연결한 링크는 언제까지나 정확합니다."
    languages:
      title: "원하는 언어로 읽기"
      body: "인터페이스와 게임 데이터는 라이엇이 배포하는 21개 언어로 제공됩니다. 영어와 프랑스어부터 한국어, 일본어, 아랍어, 그리고 중국어 간체와 번체까지 지원합니다."
    builds:
      title: "빌드 만들고 공유하기"
      body: "무기고 편집기에서 아이템 빌드를 단계별로 구성한 뒤 링크로 공유할 수 있습니다. 빌드에는 투표할 수 있고, 공개 프로필에 게시한 빌드가 모입니다."
    trends:
      title: "무엇을 많이 찾는지 보기"
      body: "트렌드 페이지는 사이트에서 가장 많이 조회된 챔피언, 아이템, 룬의 순위를 보여 줍니다. 경기 통계가 아니라 커뮤니티의 관심을 나타내는 지표입니다."
    api:
      title: "프로그램으로 데이터 조회하기"
      body: "JSON 형식의 REST API가 공개 프로필, 공유된 빌드, 조회 트렌드를 제공합니다. 무료 등급과 함께 사용량이 많은 경우를 위한 유료 크레딧 패키지도 있습니다."
    offline:
      title: "설치해서 계속 보기"
      body: "이 사이트는 설치할 수 있는 프로그레시브 웹 앱입니다. 홈 화면에 추가해 두면 이미 방문한 페이지는 연결이 없어도 읽을 수 있습니다."
  data:
    title: "데이터의 출처"
    body: "사이트의 모든 수치는 리그 오브 레전드 게임 데이터의 공식 정적 내보내기인 라이엇 게임즈의 Data Dragon 배포본에서 읽어 옵니다. 스킨의 크로마는 Community Dragon으로 보완합니다. 수작업 편집은 전혀 하지 않으며, 이 사이트는 읽는 쪽이지 편집하는 쪽이 아닙니다."
    link: "데이터와 출처 페이지 전문 읽기"
  who:
    title: "누가 운영하는가"
    body: "League Of Data Base는 개발자 한 명이 만들고 유지하며 자발적인 후원으로 운영되는 독립 프로젝트입니다. 광고를 싣지 않고 개인 정보를 판매하지 않습니다."
    opensource: "소스 코드는 다음에서 공개되어 있습니다:"
  more:
    title: "더 알아보기"

data:
  title: "데이터와 출처"
  lead: "이 사이트가 무엇을 공개하는지, 어디에서 왔는지, 얼마나 최신인지, 그리고 의도적으로 주장하지 않는 것은 무엇인지."
  dataset_name: "리그 오브 레전드 게임 데이터 — 패치 %version%"
  snapshot:
    title: "현재 상태"
    patch: "패치"
    languages: "언어"
    patches: "패치 수"
  sources:
    title: "상위 출처"
    body: "이 사이트에는 자체 게임 데이터가 없습니다. 표시되는 모든 내용은 공식 배포본에서 가져와 공개된 형태 그대로 제공합니다."
    ddragon:
      title: "Data Dragon (라이엇 게임즈)"
      body: "주요 출처입니다. 라이엇이 패치마다 공개하는 공식 정적 데이터 내보내기로, 챔피언, 아이템, 룬, 소환사 주문과 그 현지화 문구 및 이미지를 제공합니다."
    cdragon:
      title: "Community Dragon"
      body: "오직 한 가지 용도로만 사용합니다. Data Dragon이 존재만 알리고 설명하지 않는 챔피언 스킨의 크로마입니다. 여기 표시되는 색상 이름은 라이엇의 제품명이 아니라 이미지의 실제 색조에서 도출한 것입니다."
  freshness:
    title: "얼마나 최신인가"
    body: "새 패치는 공개되는 즉시 라이엇의 버전 목록에서 가져오며, 보통 게임 패치가 적용된 뒤 몇 시간 이내입니다. 이전 패치도 보존되어 계속 열람할 수 있으므로, 새 패치가 나와도 사라지는 것은 없습니다."
  coverage:
    title: "다루는 범위"
    body: "각 패치와 각 언어에 대해 이 사이트는 다음을 공개합니다."
    champions: "챔피언 — 스킬, 기본 능력치와 레벨당 상승치, 역할, 자원 유형, 스킨과 크로마, 배경 이야기."
    items: "아이템 — 골드 비용, 조합 경로, 판매 가격, 능력치, 분류, 맵별 사용 가능 여부."
    runes: "룬 계열 — 각 슬롯과 핵심 룬, 하위 룬 및 그 효과 설명."
    summoners: "소환사 주문 — 재사용 대기시간, 사거리, 해금 레벨, 게임 모드."
  limits:
    title: "인정하는 한계"
    body: "이 사이트는 게임 파일에 담긴 내용을 전달합니다. 승률, 픽률, 티어 목록을 계산하지 않으며 경기 기록도 보관하지 않습니다. 그런 값은 실시간 대전 데이터에서 나오며 Data Dragon은 이를 제공하지 않기 때문입니다. 라이엇이 변수를 그대로 남겨 둔 스킬 설명은 추측하지 않고 제공된 그대로 표시합니다."
  reuse:
    title: "데이터 재사용"
    body: "게임 데이터는 라이엇 게임즈의 소유이며 계속해서 라이엇의 약관을 따릅니다. 사이트가 자체적으로 만든 자료인 조회 트렌드, 공개 프로필, 공유된 빌드는 문서화된 JSON API로 이용할 수 있습니다."
    link: "개발자 API 보기"
  disclaimer:
    title: "라이엇 게임즈 고지"
    body: "League Of Data Base는 라이엇 게임즈의 승인을 받지 않았으며, 라이엇 게임즈 또는 리그 오브 레전드의 제작이나 운영에 공식적으로 관여하는 어떤 사람의 견해나 의견도 대변하지 않습니다. 리그 오브 레전드와 라이엇 게임즈는 Riot Games, Inc.의 상표 또는 등록 상표입니다."

faq:
  title: "자주 묻는 질문"
  lead: "이 사이트가 무엇인지, 데이터는 어디에서 오는지, 무엇을 할 수 있는지에 대한 명확한 답변입니다."
  more:
    title: "찾는 내용이 없나요?"
    body: "다음 페이지에서 더 자세히 다룹니다."
  what-is-it:
    question: "League Of Data Base는 무엇인가요?"
    answer: "League Of Data Base는 리그 오브 레전드를 위한 무료 온라인 백과사전입니다. 게임의 모든 챔피언, 아이템, 룬, 소환사 주문을 정확한 능력치와 함께 어떤 패치에서든 21개 언어로 찾아볼 수 있습니다. 독립 프로젝트이며 라이엇 게임즈의 공식 사이트가 아닙니다."
  data-source:
    question: "데이터는 어디에서 오나요?"
    answer: "모든 게임 데이터는 라이엇 게임즈가 패치마다 공개하는 공식 정적 데이터 내보내기인 Data Dragon에서 옵니다. Data Dragon이 설명하지 않는 스킨 크로마는 Community Dragon에서 가져옵니다. 사이트는 이 값을 수정하지 않고 읽어서 보여 줄 뿐입니다."
  freshness:
    question: "데이터는 얼마나 자주 갱신되나요?"
    answer: "새 패치는 공개되는 즉시 라이엇의 버전 목록에서 감지하며, 보통 패치가 적용된 뒤 몇 시간 이내입니다. 이전 패치도 계속 이용할 수 있으므로 언제든 되돌아가 예전 버전 당시의 사이트를 볼 수 있습니다."
  languages:
    question: "어떤 언어를 지원하나요?"
    answer: "라이엇이 게임 데이터를 공개하는 21개 언어를 지원합니다. 영어, 프랑스어, 독일어, 스페인어, 이탈리아어, 포르투갈어, 폴란드어, 루마니아어, 헝가리어, 그리스어, 체코어, 튀르키예어, 러시아어, 아랍어, 태국어, 베트남어, 인도네시아어, 일본어, 한국어, 중국어 간체, 중국어 번체입니다. 인터페이스와 게임 문구 모두 선택한 언어를 따릅니다."
  old-patches:
    question: "예전 패치를 찾아볼 수 있나요?"
    answer: "네. 라이엇이 Data Dragon으로 공개한 모든 패치는 계속 열람할 수 있고, 과거 페이지에는 고유한 영구 주소가 있습니다. 덕분에 두 버전 사이에서 챔피언이나 아이템을 비교하거나, 특정 패치 당시의 상태로 링크를 공유할 수 있습니다."
  free:
    question: "무료인가요?"
    answer: "네, 사이트 전체를 무료로 이용할 수 있으며 광고나 유료 장벽이 없습니다. 자발적인 후원으로 운영됩니다. 유료 크레딧 패키지가 필요한 경우는 개발자 API를 대량으로 사용할 때뿐이며, 그마저도 무료 등급이 있습니다."
  account:
    question: "계정이 필요한가요?"
    answer: "아니요. 챔피언, 아이템, 룬, 소환사 주문이나 어떤 패치를 열람하는 데에도 계정은 필요하지 않습니다. 계정은 즐겨찾기를 저장하거나 아이템 빌드를 만들어 공유하고, 다른 사람이 공유한 빌드에 투표할 때만 필요합니다."
  builds:
    question: "아이템 빌드를 만들고 공유할 수 있나요?"
    answer: "네. 무기고 편집기에서 빌드를 단계별로 구성한 뒤 공유 가능한 링크로 게시할 수 있습니다. 공유된 빌드에는 다른 방문자가 투표할 수 있고, 공개 프로필에 게시한 빌드가 나열됩니다."
  api:
    question: "API가 있나요?"
    answer: "있습니다. JSON 형식의 REST API가 사이트 자체 데이터인 공개 프로필, 공유된 빌드, 조회 트렌드를 제공하며, 무료 등급과 대량 사용을 위한 크레딧 패키지가 있습니다. 라이엇의 게임 데이터 자체는 Data Dragon에서 직접 이용할 수 있습니다."
  offline:
    question: "오프라인에서도 작동하나요?"
    answer: "부분적으로 가능합니다. 이 사이트는 설치할 수 있는 프로그레시브 웹 앱이라 홈 화면이나 바탕화면에 추가할 수 있고, 이미 방문한 페이지는 연결이 없어도 읽을 수 있습니다. 새로운 페이지를 열려면 여전히 네트워크 연결이 필요합니다."
  riot-affiliation:
    question: "이 사이트는 라이엇 게임즈와 관련이 있나요?"
    answer: "아니요. League Of Data Base는 독립 프로젝트로 라이엇 게임즈의 승인을 받지 않았으며, 라이엇 게임즈 또는 리그 오브 레전드의 제작이나 운영에 공식적으로 관여하는 어떤 사람의 견해나 의견도 대변하지 않습니다. 리그 오브 레전드와 라이엇 게임즈는 Riot Games, Inc.의 상표 또는 등록 상표입니다."
