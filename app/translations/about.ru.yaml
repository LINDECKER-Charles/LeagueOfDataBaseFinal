# Редакционные тексты страниц /about, /about/data и /faq.
# Идентификаторы faq.* объявлены в App\Controller\Editorial\AboutController::FAQ_ENTRIES.
eyebrow: "О проекте"

index:
  title: "О League Of Data Base"
  lead: "League Of Data Base — бесплатная энциклопедия League of Legends: все чемпионы, предметы, руны и заклинания призывателя, для любого патча, на 21 языке."
  what:
    title: "Что это за сайт"
    body: "League Of Data Base — справочный сайт по игровым данным League of Legends. Он публикует сами файлы игры — чемпионов, предметы, руны и заклинания призывателя — в виде читаемых страниц, которые можно просматривать, фильтровать и сравнивать. Каждое значение берётся из официальной поставки Data Dragon от Riot: то, что вы здесь читаете, — это содержимое игры, а не оценка и не догадка сообщества."
  audience:
    title: "Кому он нужен"
    body: "Игрокам, которые между матчами проверяют способности чемпиона или цену предмета; тем, кто сравнивает значения от патча к патчу; авторам контента, которым нужны точные числа; и разработчикам, желающим получить те же данные через API. Ничего не спрятано за входом — для чтения аккаунт не нужен."
  features:
    title: "Что здесь можно сделать"
    codex:
      title: "Просматривать полный кодекс"
      body: "Подробные страницы для каждого чемпиона (способности, образы, базовые характеристики, история), каждого предмета (цена, характеристики, путь сборки), каждой ветви рун и каждого заклинания призывателя — с мгновенным поиском и фильтрами в каждом списке."
    patches:
      title: "Путешествовать между патчами"
      body: "Переключитесь на любой патч Data Dragon и читайте сайт таким, каким он был в этой версии. Исторические страницы сохраняют собственные адреса: ссылка на прошлый патч останется точной навсегда."
    languages:
      title: "Читать на своём языке"
      body: "Интерфейс и игровые данные доступны на 21 языке, которые публикует Riot, — от английского и французского до корейского, японского, арабского и обоих вариантов письма китайского."
    builds:
      title: "Создавать и делиться сборками"
      body: "Соберите сборку предметов шаг за шагом в редакторе оружейной, затем поделитесь ею по ссылке. За сборки можно голосовать, а публичный профиль собирает те, что вы опубликовали."
    trends:
      title: "Видеть, что смотрят"
      body: "Страница трендов ранжирует чемпионов, предметы и руны, которые чаще всего просматривают на сайте, — это мера внимания сообщества, а не статистика матчей."
    api:
      title: "Запрашивать данные программно"
      body: "REST API в формате JSON предоставляет публичные профили, опубликованные сборки и тренды просмотров, с бесплатным уровнем и платными пакетами кредитов для интенсивного использования."
    offline:
      title: "Установить и продолжать читать"
      body: "Сайт — устанавливаемое прогрессивное веб-приложение: добавьте его на главный экран, и уже посещённые страницы останутся доступными без подключения."
  data:
    title: "Откуда берутся данные"
    body: "Каждое значение на сайте читается из поставки Data Dragon компании Riot Games — официального статического экспорта игровых данных League of Legends, дополненного Community Dragon для хром образов. Ничего не редактируется вручную: сайт — читатель, а не редактор."
    link: "Прочитать полную страницу о данных и источниках"
  who:
    title: "Кто им занимается"
    body: "League Of Data Base — независимый проект, созданный и поддерживаемый одним разработчиком и финансируемый добровольными пожертвованиями. Он не показывает рекламу и не продаёт персональные данные."
    opensource: "Исходный код открыт на"
  more:
    title: "Дальше"

data:
  title: "Данные и источники"
  lead: "Что этот сайт публикует, откуда это берётся, насколько это свежо и на что он намеренно не претендует."
  dataset_name: "Игровые данные League of Legends — патч %version%"
  snapshot:
    title: "Текущий срез"
    patch: "Патч"
    languages: "Языки"
    patches: "Патчи"
  sources:
    title: "Исходные источники"
    body: "У сайта нет собственных игровых данных. Всё отображаемое загружается из официальных поставок и подаётся в том виде, в каком опубликовано."
    ddragon:
      title: "Data Dragon (Riot Games)"
      body: "Основной источник: официальный экспорт статических данных Riot, выходящий к каждому патчу. Он даёт чемпионов, предметы, руны, заклинания призывателя, их локализованные тексты и изображения."
    cdragon:
      title: "Community Dragon"
      body: "Используется только для одного: хром-вариантов образов чемпионов, которые Data Dragon отмечает, но никогда не описывает. Показанные здесь названия цветов выведены из реального оттенка изображения, а не из продуктовых названий Riot."
  freshness:
    title: "Насколько свежи данные"
    body: "Новые патчи подхватываются из списка версий Riot сразу после появления, обычно в течение нескольких часов после выхода игрового патча. Предыдущие патчи сохраняются и остаются доступными: с приходом нового ничего не исчезает."
  coverage:
    title: "Что покрыто"
    body: "Для каждого патча и каждого языка сайт публикует:"
    champions: "Чемпионы — способности, базовые характеристики и прирост за уровень, роли, тип ресурса, образы и хромы, история."
    items: "Предметы — стоимость в золоте, путь сборки, цена продажи, характеристики, категории и доступность по картам."
    runes: "Ветви рун — каждый слот, ключевая руна и малая руна с текстом эффекта."
    summoners: "Заклинания призывателя — перезарядка, дальность, уровень открытия и режимы игры."
  limits:
    title: "Признаваемые ограничения"
    body: "Этот сайт передаёт то, что содержится в файлах игры. Он не вычисляет процент побед, частоту выбора или тир-листы и не хранит историю матчей: это берётся из данных живых игр, которых Data Dragon не предоставляет. Описания способностей, в которых Riot оставляет неразрешённые переменные, показываются как есть, а не додумываются."
  reuse:
    title: "Повторное использование данных"
    body: "Игровые данные принадлежат Riot Games и остаются предметом её условий. Собственные материалы сайта — тренды просмотров, публичные профили и опубликованные сборки — доступны через документированный JSON API."
    link: "Смотреть API для разработчиков"
  disclaimer:
    title: "Уведомление о Riot Games"
    body: "League Of Data Base не поддерживается Riot Games и не отражает взгляды или мнения Riot Games либо кого-либо, официально причастного к созданию или управлению League of Legends. League of Legends и Riot Games являются товарными знаками или зарегистрированными товарными знаками Riot Games, Inc."

faq:
  title: "Часто задаваемые вопросы"
  lead: "Прямые ответы о том, что это за сайт, откуда его данные и что с ними можно делать."
  more:
    title: "Всё ещё ищете?"
    body: "Эти страницы раскрывают подробности:"
  what-is-it:
    question: "Что такое League Of Data Base?"
    answer: "League Of Data Base — бесплатная онлайн-энциклопедия, посвящённая League of Legends. Она позволяет посмотреть каждого чемпиона, предмет, руну и заклинание призывателя с точными характеристиками, для любого патча и на 21 языке. Это независимый проект, а не официальный сайт Riot Games."
  data-source:
    question: "Откуда берутся данные?"
    answer: "Все игровые данные берутся из Data Dragon — официального экспорта статических данных, который Riot Games публикует к каждому патчу. Хромы образов, которые Data Dragon не описывает, берутся из Community Dragon. Сайт не изменяет эти значения: он их читает и показывает."
  freshness:
    question: "Как часто обновляются данные?"
    answer: "Новые патчи определяются по списку версий Riot сразу после публикации, обычно в течение нескольких часов после выхода патча. Старые патчи остаются доступными, поэтому вы всегда можете вернуться и прочитать сайт таким, каким он был в предыдущей версии."
  languages:
    question: "Какие языки доступны?"
    answer: "Сайт доступен на 21 языке, на которых Riot публикует игровые данные: английский, французский, немецкий, испанский, итальянский, португальский, польский, румынский, венгерский, греческий, чешский, турецкий, русский, арабский, тайский, вьетнамский, индонезийский, японский, корейский, китайский упрощённый и китайский традиционный. И интерфейс, и игровые тексты следуют выбранному языку."
  old-patches:
    question: "Можно ли посмотреть старый патч?"
    answer: "Да. Каждый патч, опубликованный Riot через Data Dragon, остаётся доступным, а исторические страницы имеют собственные постоянные адреса. Это позволяет сравнить чемпиона или предмет между двумя версиями либо сослаться на точное состояние конкретного патча."
  free:
    question: "Это бесплатно?"
    answer: "Да, весь сайт бесплатен, без рекламы и платного доступа. Он финансируется добровольными пожертвованиями. Только интенсивное программное использование API для разработчиков предполагает платные пакеты кредитов, но и там есть бесплатный уровень."
  account:
    question: "Нужен ли аккаунт?"
    answer: "Нет, для просмотра чемпионов, предметов, рун, заклинаний призывателя или любого патча аккаунт не нужен. Аккаунт требуется только для сохранения избранного, создания и публикации сборок предметов и голосования за сборки других."
  builds:
    question: "Можно ли создавать и публиковать сборки предметов?"
    answer: "Да. Редактор оружейной позволяет собрать сборку шаг за шагом и опубликовать её по ссылке для обмена. За опубликованные сборки могут голосовать другие посетители, а ваш публичный профиль перечисляет те, что вы опубликовали."
  api:
    question: "Есть ли API?"
    answer: "Да. REST API в формате JSON предоставляет собственные данные сайта — публичные профили, опубликованные сборки и тренды просмотров — с бесплатным уровнем и пакетами кредитов для больших объёмов. Сами игровые данные Riot остаются доступными напрямую из Data Dragon."
  offline:
    question: "Работает ли сайт офлайн?"
    answer: "Частично. Сайт — устанавливаемое прогрессивное веб-приложение: его можно добавить на главный экран или рабочий стол, и уже посещённые страницы останутся читаемыми без подключения. Для новых страниц по-прежнему нужен доступ к сети."
  riot-affiliation:
    question: "Связан ли этот сайт с Riot Games?"
    answer: "Нет. League Of Data Base — независимый проект, не поддерживаемый Riot Games, и он не отражает взгляды или мнения Riot Games либо кого-либо, официально причастного к созданию или управлению League of Legends. League of Legends и Riot Games являются товарными знаками или зарегистрированными товарными знаками Riot Games, Inc."
