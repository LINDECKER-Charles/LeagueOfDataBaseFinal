# /about、/about/data 與 /faq 頁面的正文內容。
# faq.* 的識別碼在 App\Controller\Editorial\AboutController::FAQ_ENTRIES 中宣告。
eyebrow: "關於"

index:
  title: "關於 League Of Data Base"
  lead: "League Of Data Base 是免費的《英雄聯盟》資料庫：涵蓋全部英雄、裝備、符文與召喚師技能，適用於任何版本，支援 21 種語言。"
  what:
    title: "本站是什麼"
    body: "League Of Data Base 是《英雄聯盟》遊戲資料的參考網站。它把遊戲本身的檔案——英雄、裝備、符文與召喚師技能——發佈為可瀏覽、可篩選、可比較的頁面。每一項數值都取自拳頭官方的 Data Dragon 資料包：你在這裡看到的就是遊戲中的內容，而不是估算或社群的臆測。"
  audience:
    title: "適合誰使用"
    body: "適合在對局之間查看英雄技能或裝備價格的玩家，適合跨版本比較數值的研究者，適合需要精確數字的內容創作者，也適合希望透過 API 取得同一份資料的開發者。沒有任何內容需要登入才能查看——閱讀不需要帳號。"
  features:
    title: "你可以在這裡做什麼"
    codex:
      title: "瀏覽完整資料"
      body: "為每位英雄（技能、造型、基礎數值、背景故事）、每件裝備（價格、數值、合成路徑）、每條符文系與每個召喚師技能提供詳細頁面，所有清單皆附即時搜尋與篩選。"
    patches:
      title: "在版本之間穿梭"
      body: "切換到任何 Data Dragon 版本，即可依當時的狀態閱讀本站。歷史頁面保有各自的網址，因此指向舊版本的連結永遠準確。"
    languages:
      title: "用你的語言閱讀"
      body: "介面與遊戲資料支援拳頭發佈的 21 種語言——從英文、法文到韓文、日文、阿拉伯文，以及中文的簡體與繁體兩種書寫形式。"
    builds:
      title: "建立並分享出裝"
      body: "在軍械庫編輯器中逐步組出裝備配置，再以連結分享。出裝可以被投票，公開個人頁會彙整你發佈的配置。"
    trends:
      title: "看看大家在查什麼"
      body: "趨勢頁面依站內瀏覽次數排列英雄、裝備與符文，反映的是社群關注度，而非對局統計。"
    api:
      title: "以程式查詢資料"
      body: "JSON 格式的 REST API 提供公開個人頁、分享的出裝與瀏覽趨勢，設有免費額度，並為高用量提供付費點數包。"
    offline:
      title: "安裝後繼續查閱"
      body: "本站是可安裝的漸進式網頁應用程式：加入主畫面後，已造訪過的頁面在沒有網路時仍可閱讀。"
  data:
    title: "資料來自何處"
    body: "站內每一項數值都讀取自拳頭遊戲的 Data Dragon 資料包，也就是《英雄聯盟》遊戲資料的官方靜態匯出，並以 Community Dragon 補上造型的炫彩資訊。沒有任何內容經過人工編輯：本站是讀取方，而非編輯方。"
    link: "閱讀完整的資料與來源頁面"
  who:
    title: "由誰營運"
    body: "League Of Data Base 是獨立專案，由一位開發者獨自打造與維護，靠自願贊助運作。站內不投放廣告，也不販售個人資料。"
    opensource: "原始碼公開於"
  more:
    title: "了解更多"

data:
  title: "資料與來源"
  lead: "本站發佈了什麼、來自何處、更新到什麼程度，以及刻意不作出的宣稱。"
  dataset_name: "《英雄聯盟》遊戲資料 — 版本 %version%"
  snapshot:
    title: "目前快照"
    patch: "版本"
    languages: "語言"
    patches: "版本數"
  sources:
    title: "上游來源"
    body: "本站沒有自有的遊戲資料。所有顯示內容皆取自官方資料包，並依發佈時的原樣提供。"
    ddragon:
      title: "Data Dragon（拳頭遊戲）"
      body: "主要來源：拳頭隨每個版本發佈的官方靜態資料匯出，提供英雄、裝備、符文、召喚師技能及其在地化文字與圖片。"
    cdragon:
      title: "Community Dragon"
      body: "僅用於一件事：英雄造型的炫彩變體——Data Dragon 只標示其存在，卻從不加以描述。此處顯示的顏色名稱由圖片的實際色相推導而來，並非拳頭的產品名稱。"
  freshness:
    title: "資料的新鮮度"
    body: "新版本一經發佈即從拳頭的版本清單取得，通常在遊戲版本上線後數小時內完成。先前的版本會被保留並可繼續瀏覽：新版本到來時不會有內容消失。"
  coverage:
    title: "涵蓋範圍"
    body: "對每個版本、每種語言，本站發佈："
    champions: "英雄——技能、基礎數值與每級成長、定位、資源類型、造型與炫彩、背景故事。"
    items: "裝備——金幣價格、合成路徑、賣出價格、數值、分類以及各地圖的可用性。"
    runes: "符文系——每個欄位、核心符文與次要符文及其效果說明。"
    summoners: "召喚師技能——冷卻時間、施放距離、解鎖等級與適用模式。"
  limits:
    title: "明確的限制"
    body: "本站呈現的是遊戲檔案中的內容。它不計算勝率、選用率或強度榜，也不保存對戰紀錄：那些資料來自即時對局，而 Data Dragon 並不提供。至於拳頭未替換變數的技能說明，本站依原樣顯示，而不加以猜測。"
  reuse:
    title: "資料的再利用"
    body: "遊戲資料屬於拳頭遊戲，並持續受其條款約束。本站自有的內容——瀏覽趨勢、公開個人頁與分享的出裝——可透過附有文件的 JSON API 取得。"
    link: "查看開發者 API"
  disclaimer:
    title: "拳頭遊戲聲明"
    body: "League Of Data Base 未獲拳頭遊戲認可，也不代表拳頭遊戲或任何正式參與《英雄聯盟》製作或營運人員的觀點或意見。《英雄聯盟》與 Riot Games 為 Riot Games, Inc. 的商標或註冊商標。"

faq:
  title: "常見問題"
  lead: "關於本站是什麼、資料從何而來、你能用它做什麼的直接解答。"
  more:
    title: "還沒找到答案？"
    body: "以下頁面有更詳細的說明："
  what-is-it:
    question: "League Of Data Base 是什麼？"
    answer: "League Of Data Base 是專注於《英雄聯盟》的免費線上資料庫。你可以在其中查閱遊戲中的每位英雄、裝備、符文與召喚師技能及其精確數值，適用於任何版本，支援 21 種語言。它是獨立專案，並非拳頭遊戲的官方網站。"
  data-source:
    question: "資料從哪裡來？"
    answer: "所有遊戲資料都來自 Data Dragon，也就是拳頭遊戲隨每個版本發佈的官方靜態資料匯出。Data Dragon 未加描述的造型炫彩則來自 Community Dragon。本站不會修改這些數值，只是讀取並呈現它們。"
  freshness:
    question: "資料多久更新一次？"
    answer: "新版本一經發佈即從拳頭的版本清單偵測到，通常在版本上線後數小時內。舊版本會繼續保留，因此你隨時可以回頭，依先前版本的狀態閱讀本站。"
  languages:
    question: "支援哪些語言？"
    answer: "本站支援拳頭發佈遊戲資料所使用的 21 種語言：英文、法文、德文、西班牙文、義大利文、葡萄牙文、波蘭文、羅馬尼亞文、匈牙利文、希臘文、捷克文、土耳其文、俄文、阿拉伯文、泰文、越南文、印尼文、日文、韓文、簡體中文與繁體中文。介面與遊戲文字都會隨你選擇的語言變化。"
  old-patches:
    question: "可以查看舊版本嗎？"
    answer: "可以。拳頭透過 Data Dragon 發佈過的每個版本都能繼續瀏覽，歷史頁面各有固定網址。因此你能在兩個版本之間比較某位英雄或某件裝備，也能分享指向特定版本狀態的連結。"
  free:
    question: "是免費的嗎？"
    answer: "是的，整個網站免費使用，沒有廣告，也沒有付費牆，由自願贊助支持運作。只有大量以程式呼叫開發者 API 才涉及付費點數包，而該 API 同樣設有免費額度。"
  account:
    question: "需要帳號嗎？"
    answer: "不需要。瀏覽英雄、裝備、符文、召喚師技能或任何版本都不需要帳號。只有在收藏內容、建立並分享裝備配置，以及為他人分享的配置投票時才需要帳號。"
  builds:
    question: "可以建立並分享裝備配置嗎？"
    answer: "可以。軍械庫編輯器讓你逐步組出配置，並以可分享的連結發佈。已分享的配置可由其他訪客投票，你的公開個人頁會列出你發佈過的配置。"
  api:
    question: "有 API 嗎？"
    answer: "有。JSON 格式的 REST API 提供本站自有的資料——公開個人頁、分享的出裝與瀏覽趨勢——設有免費額度，並為更大用量提供點數包。拳頭的遊戲資料本身仍可直接從 Data Dragon 取得。"
  offline:
    question: "可以離線使用嗎？"
    answer: "可以部分離線。本站是可安裝的漸進式網頁應用程式：你可以把它加入主畫面或桌面，已造訪過的頁面在沒有網路時仍可閱讀。開啟新頁面仍需要網路連線。"
  riot-affiliation:
    question: "本站與拳頭遊戲有關聯嗎？"
    answer: "沒有。League Of Data Base 是獨立專案，未獲拳頭遊戲認可，也不代表拳頭遊戲或任何正式參與《英雄聯盟》製作或營運人員的觀點或意見。《英雄聯盟》與 Riot Games 為 Riot Games, Inc. 的商標或註冊商標。"
