name: Build

# Reusable: build the three images and push them to GHCR, tagged with the commit SHA
# (immutable) and a moving tag (preprod). Called by ci.yml on a push of dev, once its
# blocking jobs are green. Uses the automatic GITHUB_TOKEN.
#
# Images: ghcr.io/<owner>/lodb/{api,web-ssr,nginx}. The legacy _build.yml also pushes
# lodb/nginx, but only under its own tags (<sha of dev>, staging, prod, latest).
on:
  workflow_call:
    inputs:
      moving_tag:
        description: Moving tag applied alongside the immutable SHA tag.
        required: false
        type: string
        default: preprod

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [api, web-ssr, nginx]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image name (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lodb/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APP_REVISION feeds the OCI revision label and the lodb_build_info metric.
      - name: Build and push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ inputs.moving_tag }}
