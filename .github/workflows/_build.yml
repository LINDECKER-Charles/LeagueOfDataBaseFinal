name: _build

# Reusable: build the 3 images and push them to GHCR, tagged with the triggering SHA
# (immutable) plus a moving tag (default: staging). Single responsibility = "produce the
# candidate artifacts". Uses the automatic GITHUB_TOKEN (no extra secret needed).
#
# Images: ghcr.io/<owner>/lodb/{api,web-ssr,nginx}. lodb/nginx is the name the legacy stack
# used too: its immutable <sha> tags stay in the registry for a rollback.
on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build from (e.g. the test branch after merge).
        required: true
        type: string
      moving_tag:
        description: Moving tag applied alongside the immutable SHA tag (e.g. staging).
        required: false
        type: string
        default: staging

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        image: [api, web-ssr, nginx]
    steps:
      - name: Checkout ${{ inputs.ref }}
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Compute image name (lowercase owner)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lodb/${{ matrix.image }}" >> "$GITHUB_ENV"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # APP_REVISION feeds the OCI revision label and the lodb_build_info metric.
      - name: Build & push ${{ matrix.image }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/${{ matrix.image }}/Dockerfile
          push: true
          build-args: |
            APP_REVISION=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:${{ inputs.moving_tag }}
