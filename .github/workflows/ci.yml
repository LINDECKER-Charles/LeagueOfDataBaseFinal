name: CI/CD

# Continuous integration (.NET 10 + Angular) and delivery. The legacy stack's workflows are
# archived under legacy/.github/workflows/ and no longer run; changes under legacy/ trigger
# nothing. The checks run in parallel: build and tests .NET, front checks, API contract,
# i18n report (informative), the workflows themselves (actions pinned to a commit,
# actionlint, deploy tools), the supply chain (base images pinned by digest, npm audit) and
# E2E on the local stack. No sensitive value here: hosts, paths and app secrets are repository
# secrets / live inside the per-host ENV_FILE. The deploy jobs run in the GitHub environments
# `staging` and `production` (_deploy.yml).
#
# Two-stage promotion (build once, promote the same artifact, by digest):
#   push dev  ─▶ checks ─▶ merge dev→test ─▶ _build (:sha, scan, :staging) ─▶ _deploy STAGING
#             ─▶ :staging-validated
#   push main ─▶ _promote (:staging-validated → :prod) ─▶ _deploy PROD
#
# `test` never triggers this workflow. `main` is reached only by a manual test→main
# merge — that human gate promotes to production (prod never rebuilds nor reruns checks).
on:
  push:
    # Only the branches that deploy: a push runs this workflow with the deployment secrets.
    # .trivyignore is what the image scan of _build.yml accepts: a change of it alone must
    # rebuild and rescan, or an accepted finding would never unblock the pipeline.
    branches: [dev, main]
    paths: &stack-paths
      - src/**
      - tests/**
      - tools/**
      - docker/**
      - compose*.yaml
      - LoDb.slnx
      - Directory.*
      - global.json
      - .github/workflows/**
      - .trivyignore
  pull_request:
    paths: *stack-paths

permissions:
  contents: read

# A newer push of the same ref makes the running checks obsolete, except on dev and main:
# their runs end with a deploy, which a cancellation would cut halfway through. They queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' && github.ref != 'refs/heads/main' }}

jobs:
  # ───────────────────────────── checks (not on main) ────────────────────────
  dotnet:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build LoDb.slnx -c Release

      # Testcontainers starts its own Postgres through the runner's Docker.
      - name: Test
        run: dotnet test LoDb.slnx -c Release --no-build

  front:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LoDb.Web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LoDb.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      # The translation report (tools/i18n), which compiles each message with this app's ICU
      # compiler: run here, where its packages are installed. The tests of the conversion of
      # the legacy catalogues are left out: they go with legacy/.
      - name: Test the translation report
        working-directory: .
        run: node --test tools/i18n/test/report/*.test.mjs

      - name: Build web (SSR)
        run: npm run build:web

      - name: Build shell (desktop and Android)
        run: npm run build:shell

  # Drift between the API's OpenAPI documents and the committed client (L2.2). The SDK is
  # installed now because the check builds the API to regenerate the documents.
  contract:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LoDb.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix src/LoDb.Web

      - name: Check the API contract
        run: npm --prefix src/LoDb.Web run api:check

  # Translation completeness: reported, never blocking.
  i18n:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LoDb.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix src/LoDb.Web

      - name: Report translation completeness
        run: npm --prefix src/LoDb.Web run i18n:report

  # The workflows themselves (tools/ci): every action pinned to a full commit SHA, so that a
  # moved tag never changes what runs with the secrets, then actionlint, its release archive
  # checked against the SHA-256 of its checksums.txt before it runs.
  workflows:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    # The bucket script's bench (tools/prerender) pulls two images and runs a container per call.
    timeout-minutes: 15
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Test the pin check
        run: node --test tools/ci/test/*.test.mjs

      # The split of the dotenv into secret files on the host, and the overlay that mounts
      # them (Compose renders it from the .env templates).
      - name: Test the deploy tools
        run: node --test tools/deploy/test/*.test.mjs

      # The desktop release signs its update feed with these tools: release-desktop.yml runs
      # them only when a release is cut, too late to learn they broke.
      - name: Test the desktop update signing
        run: node --test tools/desktop-update-signing/test/*.test.mjs

      # The website id of the production's declaration to Umami, against the front's copy.
      - name: Test the audience declaration
        run: node --test tools/umami/test/*.test.mjs

      # What Compose makes of the served overlays (the production's hardening, the staging's
      # share and login), and the deploy job's own check of the staging login (_deploy.yml),
      # which only a deployment would run otherwise. `compose config` reads, it starts nothing.
      - name: Test the served overlays
        run: node --test tools/compose/test/*.test.mjs

      # The constraints ADR 0007 puts on the Android project, read from the committed files,
      # and the site's links the app handles.
      - name: Test the Android project
        run: node --test tools/android/test/*.test.mjs

      # The Android release signs its live updates and its packages with these tools:
      # release-android.yml runs them only when a release is cut, too late to learn they broke.
      - name: Test the Android release tools
        run: node --test tools/live-update/test/*.test.mjs tools/android-release/test/*.test.mjs

      # The load bench's overlay must undo every bound the dev overlay lifts for the E2E suite
      # (docs/architecture/pieges.md), or the bench measures a stack without them; its plan and
      # report are checked without running it.
      - name: Test the load bench
        run: node --test tools/load/test/*.test.mjs

      # The bucket script of the pre-rendered pages, against the AWS CLI it pins and an S3
      # played by moto: the operator runs it by hand, too rarely to learn then that it broke.
      - name: Test the pre-rendered pages' bucket script
        timeout-minutes: 8
        run: node --test tools/prerender/test/*.test.mjs

      # The reading of `git status` that api:check (job contract) decides the drift by.
      - name: Test the contract check
        run: node --test tools/api/test/*.test.mjs

      - name: Actions pinned to a full commit SHA
        run: node tools/ci/check-pinned-actions.mjs

      - name: actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          base="https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "$base/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # What the images are made of (tools/ci): every base image pinned to its digest, so that the
  # build and the scan of _build.yml see what the pull request reviewed; no advisory from
  # `high` up against a production dependency of the web app (bundled into the SSR server and
  # the browser), except the dated entries of tools/ci/npm-audit-allowlist.json.
  supply-chain:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Base images pinned by digest
        run: node tools/ci/check-pinned-images.mjs

      # From the lockfile: nothing is installed, no package script runs.
      - name: npm audit of the production dependencies
        run: node tools/ci/check-npm-audit.mjs

  e2e:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: lodb-dev
      COMPOSE_FILE: compose.yaml:compose.override.yaml
      APP_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Start the lodb-dev stack (waits for every probe)
        run: docker compose up -d --build --wait --wait-timeout 300

      # A fresh stack indexes its latest patch alone: the en_US of the patches before it, then the
      # states service again, give the URL grammar and the E2E closed and open states to check
      # (docs/produit/seo-une-page-par-etat.md, § 8).
      - name: Index the patches before the latest
        run: bash tools/states/index-past-patches.sh

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/LoDb.E2E/package-lock.json

      # The request-level checks the Playwright suite leaves to them: the URL grammar of ADR 0005
      # on the started stack (curl and jq), then the nginx image Compose built for it, behind
      # stubs of its upstreams (tools/nginx). Compose names a built image <project>-<service>.
      - name: Check the URL grammar
        run: bash tools/routing/check-urls.sh

      - name: Test the nginx image
        run: LODB_NGINX_IMAGE="$COMPOSE_PROJECT_NAME-nginx" node --test tools/nginx/test/*.test.mjs tools/nginx/test/*/*.test.mjs

      - name: Install dependencies
        run: npm ci --prefix tests/LoDb.E2E

      - name: Install the browser
        working-directory: tests/LoDb.E2E
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm --prefix tests/LoDb.E2E test

      - name: Stack state and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            tests/LoDb.E2E/playwright-report/
            tests/LoDb.E2E/test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  # ───────────────────────────────── dev path ────────────────────────────────
  merge-to-test:
    needs: [dotnet, front, contract, workflows, supply-chain, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # pushes the test branch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Merge dev → test (create from main if missing)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch --all --prune
          if git show-ref --verify --quiet refs/remotes/origin/test; then
            git checkout -B test origin/test
          else
            git checkout -B test origin/main
          fi
          git merge --no-ff --no-edit "${GITHUB_SHA}"
          git push origin HEAD:test

  build:
    needs: merge-to-test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_build.yml
    with:
      ref: test
      moving_tag: staging

  deploy-staging:
    needs: build
    permissions:
      contents: read
      packages: read   # the host pulls the images with this run's token
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: staging
      branch: test
    secrets:
      SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
      SSH_HOST: ${{ secrets.STAGING_HOST }}
      DEPLOY_PATH: ${{ secrets.STAGING_PATH }}
      SSH_USER: ${{ secrets.STAGING_SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.STAGING_SSH_KNOWN_HOSTS }}
      ENV_FILE: ${{ secrets.ENV_STAGING }}
      DATA_PROTECTION_PFX: ${{ secrets.STAGING_DATA_PROTECTION_PFX }}

  # Staging served these digests and passed its smoke tests: `:staging-validated` names them,
  # the only images _promote.yml may promote. They are the build's outputs, which `:staging`
  # still named when the deploy pulled it: runs of dev queue (concurrency above).
  staging-validated:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout the tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/ci

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the digests staging validated
        env:
          API_DIGEST: ${{ needs.build.outputs.api-digest }}
          WEB_SSR_DIGEST: ${{ needs.build.outputs.web-ssr-digest }}
          NGINX_DIGEST: ${{ needs.build.outputs.nginx-digest }}
        run: |
          prefix="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lodb"
          bash tools/ci/tag-image.sh "$prefix/api" "$API_DIGEST" staging-validated
          bash tools/ci/tag-image.sh "$prefix/web-ssr" "$WEB_SSR_DIGEST" staging-validated
          bash tools/ci/tag-image.sh "$prefix/nginx" "$NGINX_DIGEST" staging-validated

  # ──────────────────────────────── main path ────────────────────────────────
  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/_promote.yml
    with:
      source_tag: staging
      validated_tag: staging-validated
      target_tags: prod latest

  deploy-prod:
    needs: promote
    permissions:
      contents: read
      packages: read   # the host pulls the images with this run's token
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: prod
      branch: main
    secrets:
      SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
      SSH_HOST: ${{ secrets.PROD_HOST }}
      DEPLOY_PATH: ${{ secrets.PROD_PATH }}
      SSH_USER: ${{ secrets.PROD_SSH_USER }}
      SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
      ENV_FILE: ${{ secrets.ENV_PROD }}
      DATA_PROTECTION_PFX: ${{ secrets.PROD_DATA_PROTECTION_PFX }}
