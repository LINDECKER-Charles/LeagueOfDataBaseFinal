name: next promote

# Puts the new stack in production: the images of one commit, built once by next-build.yml
# and validated on next, become :next-prod by retag and are deployed by next-deploy.yml.
# The deploy job runs in the environment `production`: its required reviewers approve the
# run before the retag, the only gate between next and prod.
#
# Tag :next-prod, not :prod: ghcr.io/<owner>/lodb/nginx is shared with the legacy stack,
# whose deploys pull :prod, and the cutover's rollback needs that image untouched.
#
# The revision to promote is the one the next deploy reported ("Deployed revision").
on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to promote (as reported by the next deploy).
        required: true
        type: string
      branch:
        description: Branch the host checks out for its compose files.
        required: true
        type: string
        default: dev
      take_over_domains:
        description: >-
          Cutover: once the migrations pass, stop the containers of other projects that
          claim the production domains (the legacy nginx and go-api).
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: next-promote
  cancel-in-progress: false

jobs:
  # Before anyone is asked to approve: the three images of the revision exist.
  candidate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Validate the revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
            echo "The revision must be a full commit SHA, got '$REVISION'." >&2
            exit 1
          fi

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Find the images of the revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lodb"
          for image in api web-ssr nginx; do
            if ! docker buildx imagetools inspect "$registry/$image:$REVISION" >/dev/null; then
              echo "No image $image:$REVISION: was it built by next-build.yml?" >&2
              exit 1
            fi
          done
          # Informative: :next has moved on if the integration branch was pushed since.
          next="$(docker buildx imagetools inspect --format '{{ json .Manifest }}' \
            "$registry/api:next" | jq -r .digest)"
          candidate="$(docker buildx imagetools inspect --format '{{ json .Manifest }}' \
            "$registry/api:$REVISION" | jq -r .digest)"
          if [ "$next" != "$candidate" ]; then
            echo "::warning title=Not the current :next::$REVISION is not what :next points to."
          fi

  deploy:
    needs: candidate
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/next-deploy.yml
    with:
      environment: production
      branch: ${{ inputs.branch }}
      revision: ${{ inputs.revision }}
      take_over_domains: ${{ inputs.take_over_domains }}
    secrets: inherit
