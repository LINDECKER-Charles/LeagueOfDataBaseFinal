name: Release desktop

# Release of the desktop app (ADR 0008, docs/guides/release-desktop.md): Velopack packages
# of LoDb.Desktop for every RID, signed, with real deltas, published to the GitHub Releases
# of this repository, which the installed apps read (Updates/Engine/UpdateFeeds.cs).
#
# Called after a deployment, on the exact SHA deployed: `stable` after prod (a
# desktop-vX.Y.Z tag on the SHA gives the version; without one, nothing is released),
# `beta` after staging (VersionPrefix-beta.N). The caller grants contents: write and
# id-token: write. Can also be run by hand on a SHA.
#
# shell (npm) -> per RID: build (dotnet publish, no secret) -> pack (vpk download of N-1
# BEFORE vpk pack, so that vpk writes the delta N-1 -> N; signing: Authenticode through
# Azure Artifact Signing, Developer ID + notarisation; no build) -> sign (the feed of every
# RID, Ed25519, Node only) -> gate (no secret: N-1 installed, updated to N from the signed
# feed; --smoke must show N and the key it trusts, and N must ignore a tampered feed) ->
# publish (the signed feeds replace vpk's, then are read back and verified). Nothing is
# published unless every required RID passed. The release is created as a pre-release and
# promoted once every RID is uploaded (stable), or stays a pre-release (beta).
#
# Environment desktop-release: the signing secrets and variables of the guide, given to
# `pack` and `sign` only, the jobs that neither build nor run what the build produced. An
# unsigned build is never published: the signing steps fail when their configuration is
# missing, and the app reads no feed without its signature (Updates/Engine/Signing).
on:
  workflow_call:
    inputs:
      sha:
        description: Deployed commit (40 hex characters).
        required: true
        type: string
      channel:
        description: stable (after prod) or beta (after staging).
        required: false
        type: string
        default: stable
  workflow_dispatch:
    inputs:
      sha:
        description: Deployed commit (40 hex characters).
        required: true
        type: string
      channel:
        description: Release channel.
        required: true
        type: choice
        options: [stable, beta]
        default: stable

permissions:
  contents: read

# Releases of a channel never overlap: the next beta number depends on the previous one.
concurrency:
  group: release-desktop-${{ inputs.channel }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  E2E: tools/desktop-update-e2e
  SIGNING: tools/desktop-update-signing

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      vpk: ${{ steps.version.outputs.vpk }}
    env:
      SHA: ${{ inputs.sha }}
      CHANNEL: ${{ inputs.channel }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate the inputs
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full commit SHA, got '$SHA'"
            exit 1
          fi
          case "$CHANNEL" in
            stable | beta) ;;
            *) echo "::error::channel must be stable or beta, got '$CHANNEL'"; exit 1 ;;
          esac

      # Every tag: the stable tag of the SHA, and the beta tags to number the next one.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # A commit of this repository's own history only: the SHA of a fork's pull request is
      # fetchable here too, and these jobs build, sign and publish what they check out. Every
      # later job needs this one, so nothing of an outside commit ever runs.
      - name: Check the commit is on main or test
        run: |
          if ! git branch --remotes --contains "$SHA" | grep -qE '^ *origin/(main|test)$'; then
            echo "::error::$SHA is on neither main nor test: refused"
            exit 1
          fi

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      # The scripts that `sign`, `gate` and `publish` run, tested before any of them runs.
      - name: Test the feed signing tools
        run: node --test "$SIGNING"/test/*.test.mjs

      - name: Resolve the version
        id: version
        run: |
          props="$(dotnet msbuild src/LoDb.Desktop/LoDb.Desktop.csproj \
            -getProperty:VersionPrefix -getItem:PackageVersion)"
          prefix="$(jq -r .Properties.VersionPrefix <<<"$props")"
          # vpk must match the Velopack package the app is built with.
          vpk="$(jq -r '[.Items.PackageVersion[] | select(.Identity == "Velopack")
            | .Version][0] // empty' <<<"$props")"
          [ -n "$vpk" ] || { echo "::error::no Velopack PackageVersion"; exit 1; }
          "$E2E/release-version.sh" --channel "$CHANNEL" --sha "$SHA" --prefix "$prefix" \
            > "$RUNNER_TEMP/version"
          value() { sed -n "s/^$1=//p" "$RUNNER_TEMP/version"; }
          release="$(value release)" tag="$(value tag)" reason="$(value reason)"

          # A re-run after a promoted release has nothing left to do.
          if [ "$release" = true ] && [ "$CHANNEL" = stable ] \
            && [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq .isPrerelease 2>/dev/null)" = false ]; then
            release=false reason="$tag is already published"
          fi

          {
            echo "release=$release"
            echo "version=$(value version)"
            echo "vpk=$vpk"
          } >> "$GITHUB_OUTPUT"
          if [ "$release" = true ]; then
            echo "Desktop $(value version) ($CHANNEL), tag $tag, vpk $vpk" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No desktop release: $reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No desktop release: $reason"
          fi

  shell:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/LoDb.Web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # A release is built from a clean slate: a cache other runs of the branch can write
          # would reach the packages this job hands to signing.
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build shell
        run: npm run build:shell

      - name: Upload the shell
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-shell
          path: src/LoDb.Web/dist/shell/browser/
          if-no-files-found: error
          retention-days: 1

  # No environment, no secret: the .NET build runs the MSBuild targets of its NuGet
  # packages. The publish folder goes to `pack` as a tar, which keeps the executable bits
  # that an artifact drops.
  build:
    name: build (${{ matrix.rid }})
    needs: [prepare, shell]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, best-effort: false }
          - { rid: osx-arm64, os: macos-15, best-effort: false }
          - { rid: osx-x64, os: macos-15-intel, best-effort: false }
          # Best effort (ADR 0008): published when it passes, never blocking.
          - { rid: linux-x64, os: ubuntu-24.04, best-effort: true }
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the shell
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-shell
          path: shell

      - name: Build (dotnet publish)
        run: |
          "$E2E/build.sh" --rid "$RID" --version "$VERSION" --channel "$CHANNEL" \
            --shell-dir shell --publish-dir publish
          # COPYFILE_DISABLE: no AppleDouble entries from macOS' bsdtar, which codesign refuses.
          COPYFILE_DISABLE=1 tar -C publish -cf desktop-publish.tar .

      - name: Upload the publish folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-publish-${{ matrix.rid }}
          path: desktop-publish.tar
          if-no-files-found: error
          retention-days: 1

  # The only job holding the platform signing material. It builds nothing, restores no
  # cache, and runs nothing the build produced: vpk, the Velopack version of the app, signs
  # the files of the publish folder as it packs them. The packages run in `gate`, without
  # any secret.
  pack:
    name: pack (${{ matrix.rid }})
    needs: [prepare, build]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    environment: desktop-release
    continue-on-error: ${{ matrix.best-effort }}
    permissions:
      contents: read
      # Azure Artifact Signing, through OIDC: no long-lived Azure secret.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, best-effort: false }
          - { rid: osx-arm64, os: macos-15, best-effort: false }
          - { rid: osx-x64, os: macos-15-intel, best-effort: false }
          # Best effort (ADR 0008): published when it passes, never blocking.
          - { rid: linux-x64, os: ubuntu-24.04, best-effort: true }
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: tools/desktop-update-e2e

      # vpk is a .NET tool: the SDK runs it, never the app's build.
      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Download the publish folder
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-publish-${{ matrix.rid }}
          path: build

      # The build job holds no secret and this one signs: a link planted in the archive would
      # make vpk package a file of this runner. A publish folder never needs one.
      - name: Unpack the publish folder
        run: |
          mkdir publish && tar -C publish -xf build/desktop-publish.tar
          if find publish -type l | grep -q .; then
            find publish -type l -exec printf '::error::Symbolic link in the publish folder: %s\n' {} +
            exit 1
          fi

      - name: Install vpk
        env:
          VPK_VERSION: ${{ needs.prepare.outputs.vpk }}
        run: dotnet tool install --global vpk --version "$VPK_VERSION"

      # mksquashfs builds the AppImage.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes squashfs-tools

      # previous/version tells the gate which N-1 it installs (empty: first release).
      - name: Fetch N-1 (full package, installable build)
        run: |
          previous="$("$E2E/previous.sh" --rid "$RID" --channel "$CHANNEL" \
            --repo "$GITHUB_REPOSITORY" --releases releases --installable-dir previous)"
          echo "PREVIOUS=$previous" >> "$GITHUB_ENV"
          printf '%s\n' "$previous" > previous/version

      - name: Developer ID and notarisation (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_DEVELOPER_ID_P12: ${{ secrets.APPLE_DEVELOPER_ID_P12 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_APP_IDENTITY: ${{ vars.APPLE_APP_IDENTITY }}
          APPLE_INSTALL_IDENTITY: ${{ vars.APPLE_INSTALL_IDENTITY }}
        run: '"$E2E/signing.sh" macos "$RUNNER_TEMP/signing"'

      - name: Artifact Signing metadata (Windows)
        if: runner.os == 'Windows'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: '"$E2E/signing.sh" windows "$RUNNER_TEMP/signing"'

      # signtool's Artifact Signing library signs with the Azure CLI session.
      - name: Azure login (OIDC)
        if: runner.os == 'Windows'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Pack (sign, vpk pack)
        run: |
          # The signing options of the steps above; none on Linux.
          sign_args=()
          if [ -f "$RUNNER_TEMP/signing/sign-args" ]; then
            while IFS= read -r arg; do
              sign_args+=("$arg")
            done < "$RUNNER_TEMP/signing/sign-args"
          fi
          "$E2E/pack.sh" --rid "$RID" --version "$VERSION" --channel "$CHANNEL" \
            --publish-dir publish --releases releases -- ${sign_args[@]+"${sign_args[@]}"}

          source "$E2E/lib.sh"
          stem="releases/$LODB_PACK_ID-$VERSION-$(lodb_velopack_channel "$RID" "$CHANNEL")"
          if [ -n "$PREVIOUS" ] && [ ! -f "$stem-delta.nupkg" ]; then
            echo "::error::vpk wrote no delta $PREVIOUS -> $VERSION"
            exit 1
          fi

      - name: Remove the signing keychain
        if: always() && runner.os == 'macOS'
        run: '"$E2E/signing.sh" cleanup "$RUNNER_TEMP/signing"'

      - name: Upload the packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-packed-${{ matrix.rid }}
          path: |
            releases/
            previous/
          if-no-files-found: error
          retention-days: 1

      # The feed alone goes to `sign`: it lists the size and SHA-256 of every package, which
      # is what the signature covers.
      - name: Upload the feed
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-feed-${{ matrix.rid }}
          path: releases/releases.*.json
          if-no-files-found: error
          retention-days: 1

  # The only job holding the feed signing key (tools/desktop-update-signing). It builds
  # nothing, restores no cache and runs nothing the build produced: Node built-ins and the
  # scripts of the commit (sparse checkout) sign the feeds as plain data, after checking
  # that the key is the pair of one compiled into the app. No package comes in.
  sign:
    needs: [prepare, pack]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: desktop-release
    env:
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          # The key the app trusts is read from its source, UpdateFeeds.cs.
          sparse-checkout: |
            tools/desktop-update-e2e
            tools/desktop-update-signing
            tools/live-update
            src/LoDb.Desktop/Updates/Engine

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          # No cache in the job that holds the signing key.
          package-manager-cache: false

      - name: Download the feeds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-feed-*
          path: feeds

      # A required RID whose pack failed has stopped the release already; linux-x64 may lack.
      - name: Sign the feeds
        env:
          LODB_DESKTOP_UPDATE_PRIVATE_KEY: ${{ secrets.LODB_DESKTOP_UPDATE_PRIVATE_KEY }}
        run: |
          source "$E2E/lib.sh"
          for rid in $LODB_RIDS; do
            folder="feeds/desktop-feed-$rid"
            if [ ! -d "$folder" ]; then
              echo "::warning::No feed for $rid: its pack failed."
              continue
            fi
            node "$SIGNING/sign-feed.mjs" --releases "$folder" \
              --channel "$(lodb_velopack_channel "$rid" "$CHANNEL")" --version "$VERSION"
          done

      - name: Upload the signed feeds
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-signed-feeds
          path: feeds/
          if-no-files-found: error
          retention-days: 7

  # Installs N-1 and updates it to N from the signed feed, as a user would, in a job without
  # any secret. Only a release folder that passed goes on to `publish`, as
  # desktop-releases-<rid>.
  gate:
    name: gate (${{ matrix.rid }})
    needs: [prepare, sign]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.best-effort }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, os: windows-latest, best-effort: false }
          - { rid: osx-arm64, os: macos-15, best-effort: false }
          - { rid: osx-x64, os: macos-15-intel, best-effort: false }
          # Best effort (ADR 0008): published when it passes, never blocking.
          - { rid: linux-x64, os: ubuntu-24.04, best-effort: true }
    defaults:
      run:
        shell: bash
    env:
      RID: ${{ matrix.rid }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Checkout the release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            tools/desktop-update-e2e
            tools/desktop-update-signing
            src/LoDb.Desktop/Updates/Engine

      # gate.sh checks the signed feed and its packages with Node.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-packed-${{ matrix.rid }}
          path: .

      - name: Download the signed feeds
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-signed-feeds
          path: signed

      # The feed of this release only, and its signature, in place of the one vpk wrote.
      - name: Use the signed feed
        run: |
          source "$E2E/lib.sh"
          feed="releases.$(lodb_velopack_channel "$RID" "$CHANNEL").json"
          cp "signed/desktop-feed-$RID/$feed" "signed/desktop-feed-$RID/$feed.sig" releases/

      # libfuse2 runs the AppImage.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes libfuse2t64

      - name: Update gate (N-1 -> N, --smoke)
        run: |
          source "$E2E/lib.sh"
          previous="$(cat previous/version)"
          installable="$(lodb_installable "$RID" "$(lodb_velopack_channel "$RID" "$CHANNEL")")"
          feed_key="$(node "$SIGNING/app-key.mjs")"
          if [ -n "$previous" ]; then
            "$E2E/gate.sh" --rid "$RID" --channel "$CHANNEL" --from "$previous" \
              --to "$VERSION" --feed releases --feed-key "$feed_key" --work gate \
              --artifact "previous/$installable"
          else
            echo "::warning::No N-1 on this channel: the gate only starts $VERSION."
            "$E2E/gate.sh" --rid "$RID" --channel "$CHANNEL" --to "$VERSION" \
              --feed releases --feed-key "$feed_key" --work gate \
              --artifact "releases/$installable"
          fi

      - name: Upload the release folder
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-releases-${{ matrix.rid }}
          path: releases/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the gate reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-gate-${{ matrix.rid }}
          path: gate/logs/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [prepare, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      SHA: ${{ inputs.sha }}
      CHANNEL: ${{ inputs.channel }}
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Install vpk
        env:
          VPK_VERSION: ${{ needs.prepare.outputs.vpk }}
        run: dotnet tool install --global vpk --version "$VPK_VERSION"

      # publish.sh checks the signed feeds, before the upload and read back after it.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download the release folders
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-releases-*
          path: artifacts

      # Nothing is uploaded unless every required RID passed its gate and its packages match
      # its signed feed; then pre-release, signed feeds, promotion (stable) or pruning of the
      # old betas (beta).
      - name: Publish
        run: |
          "$E2E/publish.sh" --channel "$CHANNEL" --version "$VERSION" --sha "$SHA" \
            --repo "$GITHUB_REPOSITORY" --artifacts artifacts
          echo "Desktop $VERSION published ($CHANNEL)." >> "$GITHUB_STEP_SUMMARY"
