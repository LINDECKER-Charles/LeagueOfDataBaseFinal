name: Release Android

# Release of the Android app (ADR 0008, docs/guides/release-android.md): the AAB for Play,
# signed with the upload key; the live update bundle of its front, signed with the bundle
# key; with the transitional channel on, the APK signed with the app signing key and its
# latest.json. They land on the GitHub Release android-vX.Y.Z of this repository, and the
# AAB on the internal testing track of Play once the listing exists.
#
# Called after the deployment of prod, on the exact SHA deployed: the android-vX.Y.Z tag on
# the SHA gives the version (versionCode X*1000000 + Y*1000 + Z); without one, nothing is
# released. Can also be run by hand on a SHA. The caller grants contents: write.
#
# build -> stage (pre-release: the bundles at their public URLs) -> gate (emulator: the
# release APK installs; a tampered bundle is refused; a faulty one is rolled back; the
# release one runs and stays) -> publish (promotion, never as the repository's latest
# release, which is the desktop's feed) -> play. Nothing is published unless the gate passed.
#
# Environment android-release: the signing secrets of the guide. Repository variables: the
# public bundle key, the key aliases and the flags. A build without its keys stops there.
on:
  workflow_call:
    inputs:
      sha:
        description: Deployed commit (40 hex characters).
        required: true
        type: string
  workflow_dispatch:
    inputs:
      sha:
        description: Deployed commit (40 hex characters).
        required: true
        type: string

permissions:
  contents: read

# Two releases never overlap: each stages, gates and promotes its own GitHub Release.
concurrency:
  group: release-android
  cancel-in-progress: false

env:
  RELEASE_TOOLS: tools/android-release

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.version.outputs.release }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
      minimum_native: ${{ steps.version.outputs.minimum_native }}
    env:
      SHA: ${{ inputs.sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate the inputs
        run: |
          if [[ ! "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::sha must be a full commit SHA, got '$SHA'"
            exit 1
          fi

      # Every tag: the android-vX.Y.Z tag of the SHA gives the version.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Resolve the version
        id: version
        run: |
          node "$RELEASE_TOOLS/build/release-version.mjs" --sha "$SHA" > "$RUNNER_TEMP/version"
          value() { sed -n "s/^$1=//p" "$RUNNER_TEMP/version"; }
          release="$(value release)" version="$(value version)" tag="$(value tag)"
          reason="$(value reason)"

          # A re-run after a promoted release has nothing left to do.
          if [ "$release" = true ] \
            && [ "$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" \
              --json isPrerelease --jq .isPrerelease 2>/dev/null)" = false ]; then
            release=false reason="$tag is already published"
          fi

          if [ "$release" = true ]; then
            # Stops here when the native layer changed without moving the minimum up.
            node "$RELEASE_TOOLS/build/native-fingerprint.mjs" --check "$version" \
              >> "$GITHUB_OUTPUT"
            {
              echo "version=$version"
              echo "version_code=$(value version_code)"
              echo "tag=$tag"
            } >> "$GITHUB_OUTPUT"
            echo "Android $version (versionCode $(value version_code)), tag $tag" \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Android release: $reason" >> "$GITHUB_STEP_SUMMARY"
            echo "::notice::No Android release: $reason"
          fi
          echo "release=$release" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: android-release
    outputs:
      ready_timeout: ${{ steps.config.outputs.ready_timeout }}
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      TAG: ${{ needs.prepare.outputs.tag }}
      LODB_LIVE_UPDATE_PUBLIC_KEY: ${{ vars.LODB_LIVE_UPDATE_PUBLIC_KEY }}
      OUTPUTS: src/LoDb.Web/android/app/build/outputs
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LoDb.Web/package-lock.json

      # JDK 21, as docker/android-build; the runner's Android SDK does the rest.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install dependencies
        working-directory: src/LoDb.Web
        run: npm ci

      - name: Test the release tools
        run: node --test tools/live-update/test/*.test.mjs "$RELEASE_TOOLS"/test/*.test.mjs

      # The store variant: no payment screen, as Play requires (tools/android).
      - name: Build shell-store
        working-directory: src/LoDb.Web
        run: npm run build:shell:store

      - name: Sign the live update bundles
        env:
          LODB_LIVE_UPDATE_PRIVATE_KEY: ${{ secrets.LODB_LIVE_UPDATE_PRIVATE_KEY }}
          MINIMUM_NATIVE: ${{ needs.prepare.outputs.minimum_native }}
        run: |
          "$RELEASE_TOOLS/build/bundles.sh" --web src/LoDb.Web/dist/shell-store/browser \
            --version "$VERSION" --minimum-native "$MINIMUM_NATIVE" \
            --base-url "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG" \
            --out bundles

      - name: Sync the Android project
        working-directory: src/LoDb.Web
        run: npx cap sync android

      # assembleDebug: the gate's APK, same front and LiveUpdate settings, DevTools open.
      - name: Build the AAB and the APKs
        working-directory: src/LoDb.Web/android
        env:
          APP_LINK_HOST: ${{ vars.ANDROID_APP_LINK_HOST }}
        run: |
          host=()
          if [ -n "$APP_LINK_HOST" ]; then host=("-PlodbAppLinkHost=$APP_LINK_HOST"); fi
          ./gradlew --no-daemon --console=plain bundleRelease assembleRelease assembleDebug \
            -PlodbVersionCode="$VERSION_CODE" -PlodbVersionName="$VERSION" \
            ${host[@]+"${host[@]}"}

      - name: Check the LiveUpdate settings of the APKs
        id: config
        run: |
          check() { node "$RELEASE_TOOLS/build/check-embedded-config.mjs" --apk "$1"; }
          release="$(check "$OUTPUTS/apk/release/app-release-unsigned.apk")"
          debug="$(check "$OUTPUTS/apk/debug/app-debug.apk")"
          if [ "$release" != "$debug" ]; then
            echo "::error::the debug APK, which the gate drives, differs from the release one"
            exit 1
          fi
          echo "$release" >> "$GITHUB_OUTPUT"

      # The keystores live in the runner's temporary folder for this step only.
      - name: Sign the AAB and the APK
        id: sign
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          LODB_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS }}
          LODB_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          LODB_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          APP_SIGNING_KEYSTORE_BASE64: ${{ secrets.ANDROID_APP_SIGNING_KEYSTORE_BASE64 }}
          APP_SIGNING_KEY_ALIAS: ${{ vars.ANDROID_APP_SIGNING_KEY_ALIAS }}
          APP_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_STORE_PASSWORD }}
          APP_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_APP_SIGNING_KEY_PASSWORD }}
          TRANSITIONAL: ${{ vars.ANDROID_TRANSITIONAL_CHANNEL == 'true' }}
        run: |
          keys="$RUNNER_TEMP/android-keys"
          mkdir -m 700 "$keys"
          trap 'rm -rf "$keys"' EXIT
          if [ -z "$UPLOAD_KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_UPLOAD_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          base64 --decode <<<"$UPLOAD_KEYSTORE_BASE64" > "$keys/upload.jks"
          export LODB_UPLOAD_KEYSTORE="$keys/upload.jks"

          # The APK carries the app signing key that Play App Signing imports. Without it,
          # the upload key signs an APK for the gate only, which is never published.
          if [ -n "$APP_SIGNING_KEYSTORE_BASE64" ]; then
            base64 --decode <<<"$APP_SIGNING_KEYSTORE_BASE64" > "$keys/app-signing.jks"
            export LODB_APK_KEYSTORE="$keys/app-signing.jks" \
              LODB_APK_KEY_ALIAS="$APP_SIGNING_KEY_ALIAS" \
              LODB_APK_STORE_PASSWORD="$APP_SIGNING_STORE_PASSWORD" \
              LODB_APK_KEY_PASSWORD="$APP_SIGNING_KEY_PASSWORD"
          elif [ "$TRANSITIONAL" = true ]; then
            echo "::error::the transitional channel needs ANDROID_APP_SIGNING_KEYSTORE_BASE64"
            exit 1
          else
            export LODB_APK_KEYSTORE="$LODB_UPLOAD_KEYSTORE" \
              LODB_APK_KEY_ALIAS="$LODB_UPLOAD_KEY_ALIAS" \
              LODB_APK_STORE_PASSWORD="$LODB_UPLOAD_STORE_PASSWORD" \
              LODB_APK_KEY_PASSWORD="$LODB_UPLOAD_KEY_PASSWORD"
          fi
          "$RELEASE_TOOLS/sign-release.sh" --aab "$OUTPUTS/bundle/release/app-release.aab" \
            --apk "$OUTPUTS/apk/release/app-release-unsigned.apk" --version "$VERSION" \
            --out release

      # Kept 30 days: before the Play automation, the AAB goes to the Play Console by hand.
      - name: Upload the release
        uses: actions/upload-artifact@v7
        with:
          name: android-release
          path: release/
          if-no-files-found: error
          retention-days: 30

      - name: Upload the bundles
        uses: actions/upload-artifact@v7
        with:
          name: android-bundles
          path: bundles/
          if-no-files-found: error
          retention-days: 7

      - name: Upload the gate APK
        uses: actions/upload-artifact@v7
        with:
          name: android-gate-apk
          path: ${{ env.OUTPUTS }}/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  stage:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      LODB_LIVE_UPDATE_PUBLIC_KEY: ${{ vars.LODB_LIVE_UPDATE_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: android-bundles
          path: bundles

      - name: Stage the pre-release
        run: |
          "$RELEASE_TOOLS/publish/stage.sh" --version "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --bundles bundles

  gate:
    needs: [prepare, build, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      READY_TIMEOUT: ${{ needs.build.outputs.ready_timeout }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: release

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: android-bundles
          path: bundles

      - name: Download the gate APK
        uses: actions/download-artifact@v8
        with:
          name: android-gate-apk
          path: gate-apk

      # The emulator needs hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Folded into one line: the action runs each line of the script in its own shell, and
      # the log must be kept whatever the gate's status.
      - name: Update gate (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: >-
            node "$RELEASE_TOOLS/gate/gate.mjs" --release-apk "release/lodb-$VERSION.apk"
            --debug-apk gate-apk/app-debug.apk --bundles bundles --version "$VERSION"
            --ready-timeout "$READY_TIMEOUT"; status=$?;
            adb logcat -d > gate-logcat.txt; exit $status

      - name: Upload the gate log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-gate-logcat
          path: gate-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

  # The gate bundles leave the release whatever the gate said: signed, they must not linger.
  cleanup:
    needs: [prepare, stage, gate]
    if: always() && needs.stage.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove the gate bundles
        run: |
          for kind in faulty tampered; do
            asset="lodb-bundle-$VERSION-gate-$kind.zip"
            gh release delete-asset "$TAG" "$asset" --repo "$GITHUB_REPOSITORY" --yes \
              || echo "::warning::could not remove $asset from $TAG"
          done

  publish:
    needs: [prepare, build, gate, cleanup]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      MINIMUM_NATIVE: ${{ needs.prepare.outputs.minimum_native }}
      TRANSITIONAL: ${{ vars.ANDROID_TRANSITIONAL_CHANNEL == 'true' }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: release

      - name: Download the bundles
        uses: actions/download-artifact@v8
        with:
          name: android-bundles
          path: bundles

      - name: Publish
        run: |
          "$RELEASE_TOOLS/publish/publish.sh" --version "$VERSION" --repo "$GITHUB_REPOSITORY" \
            --release release --transitional "$TRANSITIONAL"

      # The policy is the API's (ADR 0008): an operator publishes it on the host, restating
      # the whole policy of the app, as an option left out clears its value.
      - name: Summary
        run: |
          field() { jq -r ".$1" "bundles/lodb-bundle-$VERSION.json"; }
          {
            echo "### Android $VERSION published"
            echo
            echo "Bundle \`$(field id)\` for the shells from $MINIMUM_NATIVE on."
            echo "To serve it, publish the client policy on the host:"
            echo
            echo '```sh'
            echo "client-policy publish --platform android --minimum <minimum in force> \\"
            echo "  --latest $VERSION --bundle-id $(field id) \\"
            echo "  --bundle-url $(field url) \\"
            echo "  --bundle-checksum $(field checksum) \\"
            echo "  --bundle-signature $(field signature) \\"
            echo "  --bundle-minimum-native $(field minimumNativeVersion)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  play:
    needs: [prepare, publish]
    if: vars.ANDROID_PLAY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-release
    steps:
      - name: Download the release
        uses: actions/download-artifact@v8
        with:
          name: android-release
          path: release

      # A job of its own: a failed upload is re-run alone, after the promotion.
      - name: Upload to the internal testing track of Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.leagueofdatabase.app
          releaseFiles: release/lodb-${{ needs.prepare.outputs.version }}.aab
          releaseName: ${{ needs.prepare.outputs.version }}
          track: internal
          status: completed
