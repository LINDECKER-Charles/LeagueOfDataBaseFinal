name: next CI

# Continuous integration of the new stack (.NET 10 + Angular). The legacy ci.yml is archived
# under legacy/.github/workflows/ and no longer runs. Only the new stack's paths trigger it.
#
# The jobs run in parallel. `contract` and `i18n` call npm scripts declared from the start
# (placeholders until L2.2 and L3.3): those chantiers fill the scripts, never this file.
# A push of dev, once every blocking job is green, builds and pushes the images
# (next-build.yml), then deploys them on next (next-deploy.yml): build once, deploy the
# same artifact. Prod is promoted by hand from a revision next served (next-promote.yml).
on:
  push:
    branches: [docs/reecriture-dotnet-angular, dev, main]
    paths: &next-paths
      - src/**
      - tests/**
      - tools/next/**
      - docker/next/**
      - compose.next*
      - LoDb.slnx
      - Directory.*
      - global.json
      - .github/workflows/next-*
  pull_request:
    paths: *next-paths

permissions:
  contents: read

# A newer push of the same ref makes the running checks obsolete, except on dev: its run ends
# with a deploy, which a cancellation would cut halfway through. dev queues instead.
concurrency:
  group: next-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

jobs:
  dotnet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Build
        run: dotnet build LoDb.slnx -c Release

      # Testcontainers starts its own Postgres through the runner's Docker.
      - name: Test
        run: dotnet test LoDb.slnx -c Release --no-build

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/LoDb.Web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LoDb.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Build web (SSR)
        run: npm run build:web

      - name: Build shell (desktop and Android)
        run: npm run build:shell

  # Drift between the API's OpenAPI documents and the committed client (L2.2). The SDK is
  # installed now because the check builds the API to regenerate the documents.
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET (version from global.json)
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LoDb.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix src/LoDb.Web

      - name: Check the API contract
        run: npm --prefix src/LoDb.Web run api:check

  # Translation completeness (L3.3): reported, never blocking.
  i18n:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: src/LoDb.Web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix src/LoDb.Web

      - name: Report translation completeness
        run: npm --prefix src/LoDb.Web run i18n:report

  e2e:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: lodb-next
      COMPOSE_FILE: compose.next.yaml:compose.next.override.yaml
      APP_REVISION: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Start the lodb-next stack (waits for every probe)
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/LoDb.E2E/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix tests/LoDb.E2E

      - name: Install the browser
        working-directory: tests/LoDb.E2E
        run: npx playwright install --with-deps chromium

      - name: Playwright
        run: npm --prefix tests/LoDb.E2E test

      - name: Stack state and logs
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            tests/LoDb.E2E/playwright-report/
            tests/LoDb.E2E/test-results/
          retention-days: 7

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  build:
    needs: [dotnet, front, contract, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/next-build.yml
    with:
      moving_tag: next

  # The images just built reach next at once; prod stays a manual promotion (next-promote.yml).
  deploy-next:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/next-deploy.yml
    with:
      environment: next
      branch: dev
    secrets: inherit
