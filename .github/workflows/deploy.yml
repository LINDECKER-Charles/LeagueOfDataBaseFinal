name: Deploy

# Deployment over SSH, with the mechanics of the archived legacy _deploy.yml: the host checks
# the branch out for its compose files, receives its .env and its Data Protection
# certificate from secrets, then pulls images that build.yml built once. Nothing is built on
# the host.
#
# - preprod: called by ci.yml after each build of dev, or run by hand (workflow_dispatch);
#   images :preprod, project lodb-preprod.
# - production: called by promote.yml only. The job runs in the environment `production`,
#   whose approval gates it; it first retags the images of the chosen commit as :production
#   (promote by retag, no rebuild), then deploys them as project lodb-production.
#
# Order (heritage.md F3, ADR 0010): pull, migrations in the ephemeral `migrate` container
# (a Doctrine database is marked at the baseline first), then `up -d`, then smoke tests. A
# failed migration stops the job while the running containers keep serving.
#
# Secrets (docs/guides/configuration.md), declared in each GitHub environment under the same
# names: ENV_FILE (the host's .env) and DATA_PROTECTION_PFX. Both environments run on the
# legacy stack's VPS, so its repository secrets PROD_SSH_KEY, PROD_HOST and PROD_SSH_USER
# (optional, root) serve here too; environment secrets SSH_KEY, SSH_HOST and SSH_USER
# override them for a host of its own. DEPLOY_PATH defaults to /opt/<project>.
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch the host checks out for its compose files.
        required: true
        type: string
        default: dev
  workflow_call:
    inputs:
      environment:
        description: Target environment, preprod or production.
        required: true
        type: string
      branch:
        description: Branch the host checks out for its compose files.
        required: true
        type: string
      revision:
        description: Full commit SHA whose images become :production (production only).
        required: false
        type: string
        default: ''
      take_over_domains:
        description: Stop the containers of other projects that claim this stack's domains.
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # Everything that depends on the target, settled before any approval or connection.
  target:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.resolve.outputs.environment }}
      project: ${{ steps.resolve.outputs.project }}
      image_tag: ${{ steps.resolve.outputs.image_tag }}
      noindex: ${{ steps.resolve.outputs.noindex }}
    steps:
      - name: Resolve the target and validate the inputs
        id: resolve
        env:
          ENVIRONMENT: ${{ inputs.environment || 'preprod' }}
          BRANCH: ${{ inputs.branch }}
          REVISION: ${{ inputs.revision }}
          TAKE_OVER: ${{ inputs.take_over_domains || false }}
        run: |
          # The inputs reach a remote shell: only plain names go through.
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid branch name: $BRANCH" >&2
            exit 1
          fi
          case "$ENVIRONMENT" in
            preprod)
              if [ -n "$REVISION" ] || [ "$TAKE_OVER" = true ]; then
                echo "preprod deploys :preprod as it is: no revision, no take-over." >&2
                exit 1
              fi
              printf '%s\n' project=lodb-preprod image_tag=preprod noindex=1 >> "$GITHUB_OUTPUT"
              ;;
            production)
              if [[ ! "$REVISION" =~ ^[0-9a-f]{40}$ ]]; then
                echo "production needs the full commit SHA to promote, got '$REVISION'." >&2
                exit 1
              fi
              printf '%s\n' project=lodb-production image_tag=production noindex=0 \
                >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unknown environment: $ENVIRONMENT (preprod or production)." >&2
              exit 1
              ;;
          esac
          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"

  deploy:
    needs: target
    runs-on: ubuntu-latest
    environment: ${{ needs.target.outputs.environment }}
    # packages: write for the retag of production; preprod's run does not use it.
    permissions:
      contents: read
      packages: write
    # Two deployments of the same environment never overlap; a queued one waits.
    concurrency:
      group: deploy-${{ needs.target.outputs.environment }}
      cancel-in-progress: false
    env:
      TARGET: ${{ needs.target.outputs.environment }}
      EXPECTED_PROJECT: ${{ needs.target.outputs.project }}
      IMAGE_TAG: ${{ needs.target.outputs.image_tag }}
      EXPECTED_NOINDEX: ${{ needs.target.outputs.noindex }}
      REVISION: ${{ inputs.revision }}
      TAKE_OVER: ${{ inputs.take_over_domains || false }}
      BRANCH: ${{ inputs.branch }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
      DEPLOY_HOST: ${{ secrets.SSH_HOST || secrets.PROD_HOST }}
      DEPLOY_PATH: >-
        ${{ secrets.DEPLOY_PATH || format('/opt/{0}', needs.target.outputs.project) }}
      DEPLOY_USER: ${{ secrets.SSH_USER || secrets.PROD_SSH_USER || 'root' }}
    steps:
      - name: Check the secrets
        env:
          SSH_KEY_SET: ${{ (secrets.SSH_KEY || secrets.PROD_SSH_KEY) != '' }}
          ENV_FILE_SET: ${{ secrets.ENV_FILE != '' }}
          PFX_SET: ${{ secrets.DATA_PROTECTION_PFX != '' }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing PROD_HOST"
          [ "$SSH_KEY_SET" = true ] || missing="$missing PROD_SSH_KEY"
          [ "$ENV_FILE_SET" = true ] || missing="$missing ENV_FILE"
          [ "$PFX_SET" = true ] || missing="$missing DATA_PROTECTION_PFX"
          if [ -n "$missing" ]; then
            echo "Missing secrets for $TARGET:$missing" >&2
            exit 1
          fi

      # Promote by retag: the images of the commit validated on preprod, never rebuilt.
      - name: Setup Buildx
        if: env.TARGET == 'production'
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        if: env.TARGET == 'production'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag the revision as :production (no rebuild)
        if: env.TARGET == 'production'
        run: |
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lodb"
          for image in api web-ssr nginx; do
            docker buildx imagetools create \
              --tag "$registry/$image:$IMAGE_TAG" "$registry/$image:$REVISION"
          done

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY || secrets.PROD_SSH_KEY }}

      - name: Known hosts
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # The .env stays readable by root alone. The certificate is read by the API's non-root
      # user through a bind mount: the file is world-readable, its folder root's only.
      - name: Push the env and the Data Protection certificate to the host
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DATA_PROTECTION_PFX: ${{ secrets.DATA_PROTECTION_PFX }}
        run: |
          ssh_target="$DEPLOY_USER@$DEPLOY_HOST"
          # Expanded on the runner on purpose (SC2029), already quoted for the remote shell.
          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          # shellcheck disable=SC2029
          ssh "$ssh_target" "mkdir -p $remote_path/.deploy && chmod 700 $remote_path/.deploy"
          # shellcheck disable=SC2029
          printf '%s\n' "$ENV_FILE" | ssh "$ssh_target" "umask 077 && cat > $remote_path/.env"
          # shellcheck disable=SC2029
          printf '%s' "$DATA_PROTECTION_PFX" | base64 -d \
            | ssh "$ssh_target" "umask 022 && cat > $remote_path/.deploy/data-protection.pfx"

      - name: Deploy (pull, migrate, up, smoke test)
        run: |
          # The remote script receives its inputs as variables, expanded on the runner on
          # purpose (SC2029) and quoted for the remote shell; the script is sent verbatim.
          remote_env=""
          for name in DEPLOY_PATH BRANCH REPO_URL TARGET EXPECTED_PROJECT IMAGE_TAG \
            EXPECTED_NOINDEX REVISION TAKE_OVER; do
            remote_env="$remote_env $name=$(printf '%q' "${!name}")"
          done
          # shellcheck disable=SC2029
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "$remote_env bash -s" <<'EOSSH'
            set -euo pipefail
            cd "$DEPLOY_PATH"
            fail() {
              echo "$*" >&2
              exit 1
            }

            # Idempotent init: the directory already holds the .env pushed just before.
            if [ ! -d .git ]; then
              git init -q
              git remote add origin "$REPO_URL"
            fi
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            # Deployment overlay, WITHOUT compose.override.yaml (dev conveniences).
            export COMPOSE_FILE=compose.yaml:compose.deploy.yaml

            # ── The .env against the target, before anything changes ─────────────────
            env_value() {
              grep -E "^$1=" .env | tail -n 1 | cut -d= -f2- | tr -d "\"'" || true
            }
            expect() {
              local actual
              actual="$(env_value "$1")"
              actual="${actual:-${3:-}}"
              [ "$actual" = "$2" ] || fail "$1 is '$actual' in the .env; $TARGET expects '$2'."
            }
            # A distinct project per environment: no stack of the host is clobbered.
            expect COMPOSE_PROJECT_NAME "$EXPECTED_PROJECT"
            expect IMAGE_TAG "$IMAGE_TAG"
            # preprod is never indexed; production always is.
            expect LODB_NOINDEX "$EXPECTED_NOINDEX" 0

            db_network="$(env_value LODB_DB_NETWORK)"
            if [ "$TARGET" = production ]; then
              # prod joins the existing database where it lives, never a copy.
              [ -n "$db_network" ] \
                || fail "LODB_DB_NETWORK must name the network of the existing database."
              docker network inspect "$db_network" >/dev/null 2>&1 \
                || fail "Network '$db_network' is missing: is the database's stack running?"
              # Overrides the .env: a second "postgres" on that network would shadow the
              # existing database.
              export COMPOSE_PROFILES=
              for key in LoDb__Mail__Host LoDb__Billing__StripeSecretKey \
                LoDb__Billing__StripeWebhookSecret; do
                [ -n "$(env_value "$key")" ] || fail "$key is required in production."
              done
            else
              # preprod runs its own database: it must never reach production's.
              [ -z "$db_network" ] || fail "LODB_DB_NETWORK must stay unset on $TARGET."
              db_network="$EXPECTED_PROJECT-db"
              docker network inspect "$db_network" >/dev/null 2>&1 \
                || docker network create "$db_network" >/dev/null
              # The stack's own Postgres (compose.deploy.yaml).
              export COMPOSE_PROFILES=bundled-database
            fi

            # The edge and its network belong to infra-vps; this job only asserts them.
            docker network inspect edge >/dev/null 2>&1 \
              || fail "Docker network 'edge' is missing — deploy infra-vps before this project."

            # ── Domains already claimed by another project (the legacy stack at cutover) ─
            # "a.com, b.com" -> one domain per line.
            one_per_line() {
              tr -s ', ' '\n' | sed '/^$/d'
            }
            domains() {
              for key in CADDY_DOMAINS API_CADDY_DOMAINS; do
                env_value "$key" | one_per_line
              done
            }
            # Domains of a container's Caddy labels (caddy, caddy_0, caddy_1…).
            claimed_by() {
              docker inspect --format \
                '{{ range $k, $v := .Config.Labels }}{{ $k }}={{ $v }}{{ "\n" }}{{ end }}' "$1" \
                | grep -E '^caddy(_[0-9]+)?=' | cut -d= -f2- | one_per_line
            }
            project_of() {
              docker inspect --format \
                '{{ index .Config.Labels "com.docker.compose.project" }}' "$1"
            }
            claimants=""
            for id in $(docker ps -q); do
              [ "$(project_of "$id")" != "$EXPECTED_PROJECT" ] || continue
              if claimed_by "$id" | grep -qxFf <(domains); then
                claimants="$claimants $id"
              fi
            done
            if [ -n "$claimants" ] && [ "$TAKE_OVER" != true ]; then
              for id in $claimants; do
                echo "Domain claimed by $(docker inspect --format '{{.Name}}' "$id")." >&2
              done
              fail "Other containers serve these domains: rerun with take_over_domains."
            fi

            # ── Pull, then migrations before the traffic switches ──────────────────────
            # The registry sometimes resets a layer mid-copy: retry with backoff.
            for attempt in 1 2 3 4 5; do
              if docker compose pull; then break; fi
              [ "$attempt" != 5 ] || fail "docker compose pull failed after 5 attempts."
              echo "pull failed (attempt $attempt), retrying in $((attempt * 10))s…" >&2
              sleep $((attempt * 10))
            done

            # Fail-fast: the containers in place keep serving if it fails. Idempotent: a
            # database already up to date applies nothing.
            docker compose run --rm migrate

            # ── Traffic switch ─────────────────────────────────────────────────────────
            # Until the smoke tests pass, a failure hands the domains back to whoever held
            # them: their containers stay deployed, only stopped (rollback = start them).
            stopped=""
            # shellcheck disable=SC2329 # invoked by the trap below
            give_back() {
              if [ "$?" -ne 0 ] && [ -n "$stopped" ]; then
                echo "Deploy failed after the take-over: restarting$stopped." >&2
                docker compose stop nginx || true
                # shellcheck disable=SC2086
                docker start $stopped >/dev/null || true
              fi
            }
            trap give_back EXIT
            for id in $claimants; do
              echo "Taking over from $(docker inspect --format '{{.Name}}' "$id")" \
                "(project $(project_of "$id"))."
              docker stop "$id" >/dev/null
              stopped="$stopped $id"
            done

            # --wait: the job fails if a probe does not turn healthy.
            docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180

            # ── Smoke test inside the stack ────────────────────────────────────────────
            canonical="$(env_value LODB_CANONICAL_HOST)"
            api_host="$(env_value API_CADDY_DOMAINS | one_per_line | head -n 1)"
            fetch() {
              docker compose exec -T nginx wget -qO /dev/null --header "Host: $1" \
                "http://127.0.0.1$2"
            }
            fetch "$canonical" /healthz
            docker compose exec -T nginx wget -qO- http://api:8080/readyz
            echo
            # A page rendered by the SSR server, then the API subdomain.
            fetch "$canonical" /en/
            fetch "$api_host" /healthz
            robots="$(docker compose exec -T nginx wget -S -qO /dev/null \
              --header "Host: $canonical" http://127.0.0.1/en/ 2>&1 \
              | grep -i 'x-robots-tag' || true)"
            if [ "$EXPECTED_NOINDEX" = 1 ]; then
              [ -n "$robots" ] || fail "$TARGET must answer X-Robots-Tag: noindex."
            else
              [ -z "$robots" ] || fail "$TARGET must be indexable, got '$robots'."
            fi
            revision="$(docker inspect --format \
              '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$(docker compose ps -q api)")"
            if [ -n "$REVISION" ] && [ "$revision" != "$REVISION" ]; then
              fail "The API runs revision $revision, not the promoted $REVISION."
            fi
            # Read by promote.yml's operator: the revision to promote.
            echo "::notice title=Deployed revision::$TARGET ($EXPECTED_PROJECT) serves $revision"
            stopped=""
            docker image prune -f

            # ── Public TLS check and edge certificate self-heal, as in _deploy.yml ─────
            # A domain whose issuance failed earlier stays in back-off until the edge reloads.
            assert_tls() {
              for domain in $(domains); do
                # No -f/-k: success means the handshake and the certificate check passed.
                curl -sS --max-time 10 -o /dev/null "https://${domain}/healthz" || return 1
              done
            }
            edge_caddy() {
              docker ps -q \
                --filter label=com.docker.compose.project=edge \
                --filter label=com.docker.compose.service=caddy
            }
            if assert_tls; then
              echo "TLS OK for all public domains."
              exit 0
            fi
            echo "TLS check failed — forcing the edge to retry certificate issuance…" >&2
            caddy_id="$(edge_caddy)"
            [ -n "$caddy_id" ] || fail "Edge Caddy container not found — is infra-vps deployed?"
            docker restart "$caddy_id" >/dev/null
            for _ in $(seq 1 18); do
              sleep 5
              if assert_tls; then
                echo "TLS recovered after edge reload."
                exit 0
              fi
            done
            echo "TLS still failing after edge reload. Check DNS, CAA, LE rate limits:" >&2
            docker logs --since 3m "$caddy_id" 2>&1 \
              | grep -iE 'challenge failed|could not get certificate|rateLimited|unauthorized' >&2 \
              || true
            exit 1
          EOSSH
