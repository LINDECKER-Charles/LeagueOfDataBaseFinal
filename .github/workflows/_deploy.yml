name: _deploy

# Reusable: deploy the stack to ONE host over SSH. Same logic for staging and prod —
# the environment is fully parameterized by inputs + secrets (DRY / open-closed).
# No environment-specific value is hardcoded here; everything sensitive comes from
# the caller's secrets, and the host config (domains, tags, app secrets) lives in
# ENV_FILE, pushed to the host as .env. Nothing is built on the host: it pulls the images
# _build.yml built once.
#
# The stack takes the place of the legacy one in the same Compose project (lodb-staging,
# lodb-prod): `up --remove-orphans` retires the legacy containers, the database volume
# (pgdata) is kept and brought up to date by `migrate`, which marks a Doctrine database at
# the baseline first. The legacy `storage` and `app_state` volumes are left untouched.
#
# Order (heritage.md F3, ADR 0010): pull, migrations in the ephemeral `migrate` container,
# then `up -d`, then smoke tests. A failed migration stops the job while the running
# containers keep serving.
on:
  workflow_call:
    inputs:
      environment:
        description: Target environment (staging | prod), checked against the host's .env.
        required: true
        type: string
      branch:
        description: Branch the target host tracks and pulls (test | main).
        required: true
        type: string
    secrets:
      SSH_KEY:
        description: SSH private key (PEM) for the target host.
        required: true
      SSH_HOST:
        description: Target host (IP or FQDN).
        required: true
      DEPLOY_PATH:
        description: Absolute project path on the host (dir holding compose.*.yaml).
        required: true
      SSH_USER:
        description: SSH user (defaults to root when unset).
        required: false
      ENV_FILE:
        description: Full dotenv for this host, written to ${DEPLOY_PATH}/.env.
        required: true
      DATA_PROTECTION_PFX:
        description: Base64 of the Data Protection certificate (PKCS#12) of this host.
        required: true

permissions:
  contents: read
  packages: read   # the host pulls the images with this run's token

# Two deployments of the same environment never overlap; a queued one waits.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.environment }}
      BRANCH: ${{ inputs.branch }}
      REPO_URL: ${{ github.server_url }}/${{ github.repository }}.git
      DEPLOY_HOST: ${{ secrets.SSH_HOST }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_USER: ${{ secrets.SSH_USER || 'root' }}
    steps:
      # A secret the caller maps but GitHub does not hold arrives empty: fail here, not
      # later when the API refuses to start without its certificate.
      - name: Check the secrets
        env:
          SSH_KEY_SET: ${{ secrets.SSH_KEY != '' }}
          ENV_FILE_SET: ${{ secrets.ENV_FILE != '' }}
          PFX_SET: ${{ secrets.DATA_PROTECTION_PFX != '' }}
        run: |
          prefix="$(echo "$TARGET" | tr '[:lower:]' '[:upper:]')"
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing ${prefix}_HOST"
          [ -n "$DEPLOY_PATH" ] || missing="$missing ${prefix}_PATH"
          [ "$SSH_KEY_SET" = true ] || missing="$missing ${prefix}_SSH_KEY"
          [ "$ENV_FILE_SET" = true ] || missing="$missing ENV_$prefix"
          [ "$PFX_SET" = true ] || missing="$missing ${prefix}_DATA_PROTECTION_PFX"
          if [ -n "$missing" ]; then
            echo "Missing secrets for $TARGET:$missing" >&2
            exit 1
          fi

      # Everything that depends on the target, settled before any connection. The inputs
      # reach a remote shell: only plain names go through.
      - name: Resolve the target
        run: |
          if [[ ! "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "Invalid branch name: $BRANCH" >&2
            exit 1
          fi
          case "$TARGET" in
            staging) noindex=1 ;;
            prod) noindex=0 ;;
            *)
              echo "Unknown environment: $TARGET (staging or prod)." >&2
              exit 1
              ;;
          esac
          {
            echo "EXPECTED_PROJECT=lodb-$TARGET"
            echo "IMAGE_TAG=$TARGET"
            echo "EXPECTED_NOINDEX=$noindex"
          } >> "$GITHUB_ENV"

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Known hosts
        run: ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      # The .env stays readable by root alone. The certificate is read by the API's non-root
      # user through a bind mount: the file is world-readable, its folder root's only.
      - name: Push env and Data Protection certificate to host
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
          DATA_PROTECTION_PFX: ${{ secrets.DATA_PROTECTION_PFX }}
        run: |
          ssh_target="$DEPLOY_USER@$DEPLOY_HOST"
          # Expanded on the runner on purpose (SC2029), already quoted for the remote shell.
          remote_path="$(printf '%q' "$DEPLOY_PATH")"
          # shellcheck disable=SC2029
          ssh "$ssh_target" "mkdir -p $remote_path/.deploy && chmod 700 $remote_path/.deploy"
          # shellcheck disable=SC2029
          printf '%s\n' "$ENV_FILE" | ssh "$ssh_target" "umask 077 && cat > $remote_path/.env"
          # shellcheck disable=SC2029
          printf '%s' "$DATA_PROTECTION_PFX" | base64 -d \
            | ssh "$ssh_target" "umask 022 && cat > $remote_path/.deploy/data-protection.pfx"

      - name: Deploy (pull, migrate, up, smoke test)
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The remote script receives its inputs as variables, expanded on the runner on
          # purpose (SC2029) and quoted for the remote shell; the script is sent verbatim.
          remote_env=""
          for name in DEPLOY_PATH BRANCH REPO_URL TARGET EXPECTED_PROJECT IMAGE_TAG \
            EXPECTED_NOINDEX GHCR_USER; do
            remote_env="$remote_env $name=$(printf '%q' "${!name}")"
          done
          # The token goes first on the remote shell's input, never on a command line that
          # `ps` would show on the host; the script follows it. The script is read whole, then
          # run with an empty input: under `bash -s`, `docker compose run` and `exec` would read
          # the rest of the script as their own input, and the job would stop after `migrate`
          # with a success status.
          # shellcheck disable=SC2016  # expanded by the host's shell, not here
          remote_shell='IFS= read -r GHCR_TOKEN && export GHCR_TOKEN && script="$(cat)"'
          # shellcheck disable=SC2016
          remote_shell="$remote_shell"' && exec bash -c "$script" </dev/null'
          # shellcheck disable=SC2029
          { printf '%s\n' "$GHCR_TOKEN"; cat; } <<'EOSSH' \
            | ssh "$DEPLOY_USER@$DEPLOY_HOST" "$remote_env bash -c $(printf '%q' "$remote_shell")"
            set -euo pipefail
            cd "$DEPLOY_PATH"
            fail() {
              echo "$*" >&2
              exit 1
            }

            # Idempotent init: the directory already holds the .env pushed just before.
            if [ ! -d .git ]; then
              git init -q
              git remote add origin "$REPO_URL"
            fi
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
            git reset --hard "origin/$BRANCH"

            # Deploy overlay (edge labels + external network), WITHOUT
            # compose.override.yaml (dev conveniences).
            export COMPOSE_FILE=compose.yaml:compose.deploy.yaml

            # ── The .env against the target, before anything changes ─────────────────
            env_value() {
              grep -E "^$1=" .env | tail -n 1 | cut -d= -f2- | tr -d "\"'" || true
            }
            expect() {
              local actual
              actual="$(env_value "$1")"
              actual="${actual:-${3:-}}"
              [ "$actual" = "$2" ] || fail "$1 is '$actual' in the .env; $TARGET expects '$2'."
            }
            expect COMPOSE_PROJECT_NAME "$EXPECTED_PROJECT"
            expect IMAGE_TAG "$IMAGE_TAG"
            # staging is never indexed; prod always is.
            expect LODB_NOINDEX "$EXPECTED_NOINDEX" 0
            if [ "$TARGET" = prod ]; then
              for key in LoDb__Mail__Host LoDb__Billing__StripeSecretKey \
                LoDb__Billing__StripeWebhookSecret; do
                [ -n "$(env_value "$key")" ] || fail "$key is required in prod."
              done
            fi

            # The edge and its network belong to infra-vps; this job only asserts them.
            docker network inspect edge >/dev/null 2>&1 \
              || fail "Docker network 'edge' is missing — deploy infra-vps before this project."
            # nginx trusts X-Forwarded-For from this subnet only. Docker picks it when infra-vps
            # creates the network, so it is read here rather than copied into ENV_FILE, and
            # kept in the .env so manual `docker compose` runs from this folder resolve it too.
            edge_cidr="$(docker network inspect edge --format '{{(index .IPAM.Config 0).Subnet}}')"
            [[ "$edge_cidr" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}/[0-9]{1,2}$ ]] \
              || fail "The 'edge' network has no IPv4 subnet for nginx to trust."
            sed -i '/^LODB_EDGE_CIDR=/d' .env
            echo "LODB_EDGE_CIDR=$edge_cidr" >> .env

            # ── Pull, then migrations before the traffic switch ────────────────────────
            # Logged in with this run's token for the pull only: the packages may be private,
            # and the host keeps no registry credential once the images are in.
            trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT
            printf '%s' "$GHCR_TOKEN" \
              | docker login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
            unset GHCR_TOKEN
            # The registry sometimes resets a layer mid-copy: retry with backoff.
            for attempt in 1 2 3 4 5; do
              if docker compose pull; then break; fi
              [ "$attempt" != 5 ] || fail "docker compose pull failed after 5 attempts."
              echo "pull failed (attempt $attempt), retrying in $((attempt * 10))s…" >&2
              sleep $((attempt * 10))
            done
            docker logout ghcr.io >/dev/null
            trap - EXIT

            # Fail-fast: the containers in place keep serving if it fails. Idempotent: a
            # database already up to date applies nothing.
            docker compose run --rm migrate

            # --wait: the job fails if a probe does not turn healthy. --remove-orphans
            # retires the containers of the legacy stack (php, go-fetcher, go-api, mailer).
            docker compose up -d --no-build --remove-orphans --wait --wait-timeout 180

            # ── Root administrator of the .env (the legacy ADMIN_LOGIN / ADMIN_PASSWORD) ──
            # The password goes on the command's input, never on a command line; the output,
            # which names the account, stays off the public log.
            admin_login="$(env_value LODB_ADMIN_LOGIN)"
            if [ -n "$admin_login" ]; then
              admin_email="$(env_value LODB_ADMIN_EMAIL)"
              admin_email="${admin_email:-$admin_login@$(env_value LODB_CANONICAL_HOST)}"
              env_value LODB_ADMIN_PASSWORD \
                | docker compose run --rm -T --no-deps api admin root \
                  --username "$admin_login" --email "$admin_email" >/dev/null
            fi

            # ── Smoke test inside the stack ────────────────────────────────────────────
            one_per_line() {
              tr -s ', ' '\n' | sed '/^$/d'
            }
            domains() {
              for key in CADDY_DOMAINS API_CADDY_DOMAINS; do
                env_value "$key" | one_per_line
              done
            }
            canonical="$(env_value LODB_CANONICAL_HOST)"
            api_host="$(env_value API_CADDY_DOMAINS | one_per_line | head -n 1)"
            fetch() {
              docker compose exec -T nginx wget -qO /dev/null --header "Host: $1" \
                "http://127.0.0.1$2"
            }
            fetch "$canonical" /healthz
            docker compose exec -T nginx wget -qO- http://lodb-api:8080/readyz
            echo
            # A page rendered by the SSR server, then the API subdomain.
            fetch "$canonical" /en/
            fetch "$api_host" /healthz
            robots="$(docker compose exec -T nginx wget -S -qO /dev/null \
              --header "Host: $canonical" http://127.0.0.1/en/ 2>&1 \
              | grep -i 'x-robots-tag' || true)"
            if [ "$EXPECTED_NOINDEX" = 1 ]; then
              [ -n "$robots" ] || fail "$TARGET must answer X-Robots-Tag: noindex."
            else
              [ -z "$robots" ] || fail "$TARGET must be indexable, got '$robots'."
            fi
            revision="$(docker inspect --format \
              '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$(docker compose ps -q api)")"
            echo "::notice title=Deployed revision::$TARGET ($EXPECTED_PROJECT) serves $revision"
            docker image prune -f

            # ── Public TLS smoke test + edge cert self-heal ────────────────────────────
            # A domain whose issuance failed earlier stays in back-off until the edge reloads.
            assert_tls() {
              for domain in $(domains); do
                # No -f/-k: success means the handshake and the certificate check passed.
                curl -sS --max-time 10 -o /dev/null "https://${domain}/healthz" || return 1
              done
            }
            # Edge Caddy container, resolved from its Compose labels (project 'edge',
            # service 'caddy'): no dependency on where infra-vps keeps its files.
            edge_caddy() {
              docker ps -q \
                --filter label=com.docker.compose.project=edge \
                --filter label=com.docker.compose.service=caddy
            }
            if assert_tls; then
              echo "TLS OK for all public domains."
              exit 0
            fi
            echo "TLS check failed — forcing the edge to retry certificate issuance…" >&2
            caddy_id="$(edge_caddy)"
            [ -n "$caddy_id" ] || fail "Edge Caddy container not found — is infra-vps deployed?"
            docker restart "$caddy_id" >/dev/null
            for _ in $(seq 1 18); do
              sleep 5
              if assert_tls; then
                echo "TLS recovered after edge reload."
                exit 0
              fi
            done
            echo "TLS still failing after edge reload. Check DNS, CAA, LE rate limits:" >&2
            docker logs --since 3m "$caddy_id" 2>&1 \
              | grep -iE 'challenge failed|could not get certificate|rateLimited|unauthorized' >&2 \
              || true
            exit 1
          EOSSH
