# Dependabot — weekly version updates for every manifest of the new stack.
#
# Decisions:
# - target-branch: dev. A push of dev merges into test, builds the images and deploys
#   staging (ci.yml); prod follows the manual test→main merge, so dependency PRs must land
#   on dev. This file
#   itself is only read from the default branch (main): it is inert until promoted.
# - Security updates (if enabled in the repo settings) always target the default
#   branch and, because target-branch is set, IGNORE every option below (prefix,
#   groups, ignore) — they come with Dependabot's default titles.
# - One weekly window (Monday 06:00 Europe/Paris) for every ecosystem, so all PRs
#   arrive in a single batch.
# - Minor + patch updates are grouped per ecosystem (one PR instead of N); major
#   updates stay as individual PRs because they need a review each.
# - The archived legacy stack (legacy/) gets no update: it no longer builds nor deploys.
# - Commit prefix `build` follows the repo's Conventional Commits map (see AGENTS.md).

version: 2

updates:
  # ─────────────────────────────── Compose service images ─────────────────────
  # Only this repo's compose*.yaml.yaml: the shared edge proxy (caddy-docker-proxy) is
  # owned and version-tracked by the infra-vps repo, not here.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # ─────────────────────────────── GitHub Actions ─────────────────────────────
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ─────────────────────────────── .NET ───────────────────────────────────────
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: dev
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ─────────────────────────────── Angular workspace ──────────────────────────
  # ADR 0005: updates of the SSR server's dependencies are applied first.
  - package-ecosystem: npm
    directory: /src/LoDb.Web
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: dev
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    ignore:
      # Angular pins its supported TypeScript range: bumped with the Angular major.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # @types/node tracks the runtime major (node:24 in docker/web-ssr, CI Node 24).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # The framework moves as one: a split Angular update does not install.
      angular:
        patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
      npm-minor-patch:
        patterns: ["*"]
        exclude-patterns: ["@angular/*", "@angular-devkit/*", "angular-eslint"]
        update-types: [minor, patch]

  # ─────────────────────────────── E2E ────────────────────────────────────────
  - package-ecosystem: npm
    directory: /tests/LoDb.E2E
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]

  # ─────────────────────────────── Docker base images ─────────────────────────
  - package-ecosystem: docker
    directories:
      - /docker/api
      - /docker/web-ssr
      - /docker/nginx
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    target-branch: dev
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    ignore:
      # .NET and Node majors are tied to global.json, the CI and the code: bumped by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
