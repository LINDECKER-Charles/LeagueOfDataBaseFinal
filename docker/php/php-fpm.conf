; Additive overrides for the default [www] pool (php-fpm merges pool sections across files).

; A pool file may reopen [global]; this one is parsed after the base image's
; docker.conf, so the value below replaces its log_limit = 8192. Past the limit
; php-fpm WRAPS a worker line across several physical lines with no marker,
; splitting one JSON record into unparsable fragments.
[global]
log_limit = 65536

[www]
; The base image points access.log at /proc/self/fd/2, so every request adds a
; "GET /index.php" line to the container stream. php-fpm has no "off" switch and
; refuses to start on an empty value; /dev/null is the only way to silence it.
access.log = /dev/null

; Slow-request detector. 5s is an order of magnitude above a warm render and well
; under max_execution_time = 60, so a stuck request surfaces long before it is
; killed. The "executing too slow" warning goes to the pool error log, i.e. the
; container stream.
slowlog = /proc/self/fd/2
request_slowlog_timeout = 5s
; MEASURED on the built app image (master and workers both www-data, worker a
; direct child of the master): ptrace still fails with EPERM, because Docker drops
; CAP_SYS_PTRACE by default — it is the capability, not the uid, that blocks it.
; So a slow request emits TWO lines: the useful "executing too slow" WARNING, and
; an "ERROR: failed to ptrace(ATTACH)" the collector's regex reads as level=error
; while nothing is actually broken. No backtrace is captured.
; Verified: `cap_add: [SYS_PTRACE]` on the php service removes the error line and
; produces the backtrace. Deliberately NOT granted here — widening the capabilities
; of a public-facing container is an infrastructure decision, and the level field is
; already declared non-actionable (docs/guides/logging.md). Revisit if the
; backtrace is ever needed to diagnose a real slow path.

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
ping.path = /ping
; The container healthcheck hits ping.path on every interval. Belt and braces with
; access.log = /dev/null above: whoever re-enables the access log for a debugging
; session must not get the probe's noise back with it.
access.suppress_path[] = /ping

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500
