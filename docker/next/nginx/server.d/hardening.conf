# Limits of the site's server block, before anything reaches the API or the SSR server.

# A client gets 10 s to send its headers or its next body chunk, and 30 s to read an answer:
# slow clients cannot hold connections for long.
client_header_timeout  10s;
client_body_timeout    10s;
send_timeout           30s;

# Dotfiles (/.env, /.git/config…) exist nowhere on this site: scanners get a plain 404 here
# instead of booting a render that the page cache would then keep. /.well-known/ stays open.
location ~ /\.(?!well-known/) {
    return 404;
}
