# Manifest of the Android transitional channel (L10.3, ADR 0008): the app reads the newest
# APK here (transitional/transitional-channel-token.ts), where a GitHub Release asset has no
# CORS headers. Each release publishes it as the asset lodb-android-latest.json
# (tools/next/android-release/publish/publish.sh); the served environment copies it to
#
#   /etc/nginx/android/latest.json
#
# next to assetlinks.json (assetlinks.conf), from a folder it mounts read-only on
# /etc/nginx/android: a folder rather than the file, so that replacing the file at the next
# release reaches nginx. Never from /srv/storage, of which nginx serves blobs/ alone
# (ADR 0004). Without the file the URL answers 404, which the app reads as "no offer".
#
# The WebView of the app has the origin https://localhost and fetches the file with a plain
# GET, without credentials nor custom headers: a simple request, never preflighted.
location = /android/latest.json {
    root         /etc/nginx/android;
    try_files    /latest.json =404;
    types        { }
    default_type application/json;
    # Not `always`: a 404 is neither cached nor handed to the app.
    add_header   Access-Control-Allow-Origin "https://localhost";
    # Short: a release reaches the installed apps within minutes.
    add_header   Cache-Control "public, max-age=300";
    include      /etc/nginx/snippets/security-headers.conf;
}
