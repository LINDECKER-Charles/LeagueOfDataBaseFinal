# Constant security headers for every response of both server blocks. `always` covers the
# error responses too.
#
# nginx quirk: add_header does not inherit into a block that declares its own add_header,
# so every such location includes this file again.
#
# HSTS (two years) is ignored over plain HTTP (local stack), so it is safe everywhere. The
# Content-Security-Policy is the SSR server's: it hashes the inline scripts of each page
# (src/LoDb.Web/src/server/security/). X-Frame-Options doubles its frame-ancestors 'none'
# for older agents; nothing of the site is ever framed.
add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options       "nosniff"                                      always;
add_header X-Frame-Options              "DENY"                                         always;
add_header Referrer-Policy              "strict-origin-when-cross-origin"              always;
# same-origin, except the public images of /cdn/blobs/ (see $lodb_resource_policy).
add_header Cross-Origin-Resource-Policy $lodb_resource_policy                          always;

# "noindex, nofollow" when LODB_NOINDEX=1 (next, staging), empty otherwise: nginx drops an
# add_header whose value is empty. A header rather than robots.txt: engines must still
# crawl the pages to see the noindex.
add_header X-Robots-Tag                 $lodb_robots_tag                               always;
