# Shared cache of the SSR server's answers (ADR 0005), included by the locations that proxy to
# web-ssr. nginx follows the upstream's Cache-Control: s-maxage for the lifetime (it wins over
# max-age), stale-while-revalidate for the stale window; private and no-store are never kept.
#
# Key: deployment revision + scheme + host + URI. A deploy changes the revision, so no page of
# the previous build is ever served again, and nothing needs a manual purge.
proxy_cache                    lodb_pages;
proxy_cache_key                "$lodb_cache_revision|$lodb_forwarded_proto://$host$request_uri";

# A response that sets a cookie belongs to one visitor: never kept (nginx's default, stated).
proxy_no_cache                 $upstream_http_set_cookie;

# One render per key at a time; the others wait for it rather than stampeding the SSR server.
proxy_cache_lock               on;
proxy_cache_lock_timeout       10s;

# Past s-maxage and within stale-while-revalidate (the latest version's pages), the stale copy
# answers at once while one background request refreshes it. `updating` is left out on purpose:
# listed here, it would outrank the header and serve stale beyond its window. A failing SSR
# server leaves the last copy in place rather than an error.
proxy_cache_use_stale          error timeout http_500 http_502 http_503 http_504;
proxy_cache_background_update  on;

# A render the SSR server has not produced in 30 s will not come.
proxy_connect_timeout          5s;
proxy_read_timeout             30s;

# HIT, MISS, EXPIRED, STALE, UPDATING, BYPASS: what the cache did with this request.
add_header X-Cache-Status $upstream_cache_status always;
include    /etc/nginx/snippets/security-headers.conf;
