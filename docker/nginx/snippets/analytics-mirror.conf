# Page-view mirror of the page locations (L7.1, plan section 13): every request of a page,
# answered from the cache or by the SSR server, is copied to /_analytics/page
# (server.d/analytics.conf), which hands it to the API. The copy starts before the page is
# looked up in the cache, so a cached page is counted as any other; its answer is dropped.
# The navigations inside the application never reach nginx: the router's beacon counts them.
mirror              /_analytics/page;
mirror_request_body off;
