# What both caches of the SSR server's pages share: snippets/page-cache.conf (the latest
# patch, and every other answer outside a pinned version) and archive-cache.conf (the past
# patches). nginx follows the upstream's Cache-Control: s-maxage for the lifetime (it wins over
# max-age), stale-while-revalidate for the stale window; private and no-store are never kept.

# A response that sets a cookie belongs to one visitor: never kept (nginx's default, stated).
proxy_no_cache                 $upstream_http_set_cookie;

# The SSR server compresses a page once, as it renders it (src/server/compression): asked for
# gzip whatever the client sent, it hands one copy that every client shares, several times
# smaller in the cache, never compressed again on a HIT. A client without gzip gets it
# decompressed here. The upstream's Vary stays out of the cache, which would otherwise keep a
# copy of the same bytes per Accept-Encoding header seen; nginx states Vary: Accept-Encoding to
# the clients itself (gzip_vary, nginx.conf), once.
proxy_set_header               Accept-Encoding gzip;
proxy_ignore_headers           Vary;
proxy_hide_header              Vary;
gunzip                         on;

# One render per key at a time; the others wait for it rather than stampeding the SSR server,
# for as long as a render may take (proxy_read_timeout below). A shorter wait would send them
# all to the SSR server at once behind a slow render.
proxy_cache_lock               on;
proxy_cache_lock_timeout       30s;
proxy_cache_lock_age           30s;

# A stale copy answers at once while one background request refreshes it.
proxy_cache_background_update  on;

# A render the SSR server has not produced in 30 s will not come.
proxy_connect_timeout          5s;
proxy_read_timeout             30s;

# HIT, MISS, EXPIRED, STALE, UPDATING, BYPASS: what the cache did with this request.
add_header X-Cache-Status $upstream_cache_status always;
include    /etc/nginx/snippets/security-headers.conf;
