# Included by every location that proxies to the API or the SSR server.
#
# HTTP/1.1 with an empty Connection header keeps the upstream connections alive.
proxy_http_version 1.1;
proxy_set_header   Connection         "";

# $remote_addr is already the real client address (real_ip module, trusted edge only):
# it is sent alone, so no address a client wrote into X-Forwarded-For travels further.
# The API trusts these headers from the stack's network only (LoDb:Hosting).
proxy_set_header   Host               $host;
proxy_set_header   X-Forwarded-For    $remote_addr;
proxy_set_header   X-Forwarded-Proto  $lodb_forwarded_proto;
proxy_set_header   X-Forwarded-Host   $host;

# The edge's secret (sites/site.conf) stops here: neither the API nor the SSR server sees it.
proxy_set_header   X-LoDb-Edge        "";
# The prerender pass's marker (ADR 0011): only the API sets it, calling the SSR server on the
# stack's network, never through nginx. A client that sends it gets no render of the pass's
# lane nor its build list (src/server/admission, src/server/prerender).
proxy_set_header   X-LoDb-Prerender   "";
# W3C trace context: each request starts a trace here, whose id is the request's own
# ($request_id), so that the SSR server's and the API's log lines of one request share their
# trace_id; the SSR server passes it on to the API calls of its render. A trace sent by the
# client is replaced, never continued: nothing in front of nginx starts traces, and a client
# must not choose the trace id the logs carry. nginx records no span (flags 00): the API
# samples the traces it exports by their id (LoDb:Telemetry). An empty value sends no header.
proxy_set_header   traceparent        "00-$request_id-$lodb_trace_parent_id-00";
proxy_set_header   tracestate         "";
proxy_set_header   baggage            "";
