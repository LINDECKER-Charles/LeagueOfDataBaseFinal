# Cache of the latest patch's pages, and of every other answer of the SSR server outside a
# version pinned in the path (ADR 0005), included by `location /`. The past patches' pages
# have theirs (archive-cache.conf).
#
# Key: deployment revision + scheme + host + URI. A deploy changes the revision, so no page of
# the previous build is ever served again, and nothing needs a manual purge.
proxy_cache                    lodb_pages;
proxy_cache_key                "$lodb_cache_revision|$lodb_forwarded_proto://$host$request_uri";

# Past s-maxage and within stale-while-revalidate, the stale copy answers at once while one
# background request refreshes it. `updating` is left out on purpose: listed here, it would
# outrank the header and serve stale beyond its window. A failing or shedding SSR server
# leaves the last copy in place rather than an error.
proxy_cache_use_stale          error timeout http_500 http_502 http_503 http_504 http_429;

include /etc/nginx/snippets/rendered-pages.conf;
