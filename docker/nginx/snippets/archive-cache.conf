# Cache of the pages of a version pinned in the path, a past patch's (ADR 0005, amended
# 2026-10-10 and 2026-10-22; ADR 0011, amended 2026-10-27), included by the SSR server's location
# (pages-store/pages.conf): what the SSR server renders, the pages the store does not hold. The
# store's own answers are never kept (pages-store/pages.conf). Each page is kept as long as its
# Cache-Control says: a year for a closed state's page, which never changes again (archived), an
# hour for the open state's, which changes once (revisable). Its key carries no deployment
# revision, so it outlives the deploys and a past patch's page right after one is still a HIT.
# The bundles it names stay served as long (volume front-builds, cache lodb_assets, then the
# store's build/).
#
# Key: epoch + served epoch + scheme + host + URI. LODB_ARCHIVE_EPOCH, raised by hand, purges
# this cache alone, when the chrome, the CSP or the /api contract change visibly, and after any
# security fix of the front; LODB_ARCHIVE_SERVE_EPOCH, the store's folder, purges it with the
# store (docs/guides/configuration.md).
proxy_cache          lodb_archive;
proxy_cache_key      "$lodb_archive_epochs|$lodb_forwarded_proto://$host$request_uri";

# A page is kept from its LODB_ARCHIVE_CACHE_MIN_USES-th request. Below that count, nginx still
# keeps a key per distinct URL until it goes inactive, whatever the answer (a cleaned query's
# 301, a shed 503): the keys zone, not the disk, bounds how many URLs a sweep goes through before
# the least recently asked pages leave the cache. At 1, only the answers kept hold a key.
proxy_cache_min_uses ${LODB_ARCHIVE_CACHE_MIN_USES};

# Past its lifetime, the stale copy may answer while one request refreshes it (`updating`), and
# whenever the SSR server fails or sheds the load.
proxy_cache_use_stale          error timeout updating http_500 http_502 http_503 http_504 http_429;

include    /etc/nginx/snippets/pinned-answer.conf;
