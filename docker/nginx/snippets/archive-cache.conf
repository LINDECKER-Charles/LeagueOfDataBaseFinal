# Cache of the pages of a version pinned in the path, a past patch's (ADR 0005, amended
# 2026-10-10), included by its location in sites/site.conf. Such a page never changes: its key
# carries no deployment revision, so it outlives the deploys and a past patch's page right
# after one is still a HIT. The bundles it names stay served as long (volume front-builds,
# cache lodb_assets).
#
# Key: epoch + scheme + host + URI. The epoch (LODB_ARCHIVE_EPOCH) is the only purge, raised
# by hand when the chrome, the CSP or the /api contract change visibly, and after any security
# fix of the front (docs/guides/configuration.md).
proxy_cache                    lodb_archive;
proxy_cache_key                "$lodb_archive_epoch|$lodb_forwarded_proto://$host$request_uri";

# Kept from its second request only: a crawler that sweeps every patch once never evicts the
# pages visitors come back to.
proxy_cache_min_uses           2;

# Immutable content: past its lifetime, the stale copy may answer while it is refreshed
# (`updating`), as when the SSR server fails or sheds the load.
proxy_cache_use_stale          error timeout updating http_500 http_502 http_503 http_504 http_429;

include /etc/nginx/snippets/rendered-pages.conf;
