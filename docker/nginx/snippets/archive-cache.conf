# Cache of the pages of a version pinned in the path, a past patch's (ADR 0005, amended
# 2026-10-10; ADR 0011), included by both its locations (pages-store/pages.conf): the page
# store fills it, and the SSR server with what the store does not hold. Such a page never
# changes: its key carries no deployment revision, so it outlives the deploys and a past patch's
# page right after one is still a HIT. The bundles it names stay served as long (volume
# front-builds, cache lodb_assets, then the store's build/).
#
# Key: epoch + served epoch + scheme + host + URI. LODB_ARCHIVE_EPOCH, raised by hand, purges
# this cache alone, when the chrome, the CSP or the /api contract change visibly, and after any
# security fix of the front; LODB_ARCHIVE_SERVE_EPOCH, the store's folder, purges it with the
# store (docs/guides/configuration.md).
proxy_cache          lodb_archive;
proxy_cache_key      "$lodb_archive_epochs|$lodb_forwarded_proto://$host$request_uri";

# A page is kept from its LODB_ARCHIVE_CACHE_MIN_USES-th lookup: each location looks it up, so
# a page the store does not hold counts twice per request. Below that count, nginx still keeps
# a key per distinct URL until it goes inactive, whatever the answer (a cleaned query's 301, a
# shed 503): the keys zone, not the disk, bounds how many URLs a sweep goes through before the
# least recently asked pages leave the cache. At 1, only the answers kept hold a key.
proxy_cache_min_uses ${LODB_ARCHIVE_CACHE_MIN_USES};

# Immutable content: past its lifetime, the stale copy may answer while it is refreshed
# (`updating`), as when the SSR server fails or sheds the load.
proxy_cache_use_stale          error timeout updating http_500 http_502 http_503 http_504 http_429;

# Either location may answer a page that the other one kept: what a page carries is set here,
# for both. A stored page's own headers come back from its object's metadata, under the names
# the pass writes them (ADR 0011), and the store's other headers never reach a client; one
# without its policy gets a strict one ($lodb_pinned_policy, sites/site.conf). nginx drops an
# empty value: a page the SSR server rendered keeps its own headers, which it sends.
include    /etc/nginx/snippets/pages-store/answer.conf;
proxy_hide_header Cache-Control;
add_header Cache-Control           $lodb_pinned_cache_control always;
add_header Content-Security-Policy $lodb_pinned_policy always;
add_header Content-Security-Policy-Report-Only
           $upstream_http_x_amz_meta_content_security_policy_report_only always;
add_header Reporting-Endpoints     $upstream_http_x_amz_meta_reporting_endpoints always;
add_header Link                    $upstream_http_x_amz_meta_link always;
add_header X-LoDb-Source           $lodb_pinned_source always;
