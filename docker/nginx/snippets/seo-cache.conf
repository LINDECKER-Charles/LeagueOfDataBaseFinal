# Cache of the crawler-facing files (server.d/seo.conf), built by the API from the catalog.
# nginx follows the API's Cache-Control: an hour for the files, a minute for a redirect or a
# 404; a 503 is never kept.
#
# Key: deployment revision + scheme + host + path, without the query. The revision, as for
# the pages (page-cache.conf): the cache is a volume, and a deploy must not serve the previous
# build's files. No query: none of these files reads one, so a query cannot multiply the
# entries. The path is the one the API receives, as sent ($lodb_request_path,
# sites/site.conf), never the decoded $uri: /sitemaps/fr%2Flatest.xml is a missing file for
# the API, and its 404 must not answer for /sitemaps/fr/latest.xml. The host stays in it: the
# files name the origin they are served from when the API has no canonical origin (local
# stack).
proxy_cache                    lodb_seo;
proxy_cache_key "$lodb_cache_revision|$lodb_forwarded_proto://$host$lodb_request_path";
proxy_no_cache                 $upstream_http_set_cookie;

# One build per file at a time; the others wait for it.
proxy_cache_lock               on;
proxy_cache_lock_timeout       30s;
proxy_cache_lock_age           30s;

# Within its stale window only (see page-cache.conf for `updating`); a failing API leaves the
# last copy in place.
proxy_cache_use_stale          error timeout http_500 http_502 http_503 http_504 http_429;
proxy_cache_background_update  on;

add_header X-Cache-Status $upstream_cache_status always;
include    /etc/nginx/snippets/security-headers.conf;
