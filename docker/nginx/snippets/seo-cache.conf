# Cache of the crawler-facing files (server.d/seo.conf), built by the API from the catalog.
# nginx follows the API's Cache-Control: an hour for the current files, a year for a past
# version's sitemap, a minute for a redirect or a 404; a 503 is never kept.
#
# Key: scheme + host + path, without the query: none of these files reads one, so a query
# cannot multiply the entries. The host stays in it: the files name the origin they are
# served from when the API has no canonical origin (local stack).
proxy_cache                    lodb_seo;
proxy_cache_key                "$lodb_forwarded_proto://$host$uri";
proxy_no_cache                 $upstream_http_set_cookie;

# One build per file at a time; the others wait for it.
proxy_cache_lock               on;
proxy_cache_lock_timeout       30s;
proxy_cache_lock_age           30s;

# Within its stale window only (see page-cache.conf for `updating`); a failing API leaves the
# last copy in place.
proxy_cache_use_stale          error timeout http_500 http_502 http_503 http_504 http_429;
proxy_cache_background_update  on;

add_header X-Cache-Status $upstream_cache_status always;
include    /etc/nginx/snippets/security-headers.conf;
