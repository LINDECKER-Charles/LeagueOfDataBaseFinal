# One request to the page store (ADR 0011), included by each location that asks it
# (pages-store/pages.conf, pages-store/bundles.conf): an anonymous GET of one object, over HTTPS
# on a served host (LODB_PAGES_STORE_SCHEME; plain HTTP to the checks' stub), with nothing of
# the client's.

# No client header goes on, its cookies, an Authorization or an x-amz-* header among them: a
# third party reads none of them, and none of them changes what the store answers. HTTP/1.1 and
# an empty Connection header keep the connections alive (upstream lodb_pages_store,
# sites/site.conf). The store wants its own name as Host, never the site's.
proxy_pass_request_headers  off;
proxy_pass_request_body     off;
proxy_http_version          1.1;
proxy_set_header            Connection "";
proxy_set_header            Host       ${LODB_PAGES_STORE_HOST};

# The store's name is sent and its certificate checked against the system's authorities: a
# page's policy comes from its object, so an answer from anyone in between could run anything
# on the site's origin. Its chain runs through a cross-signed root, one level deeper than
# nginx checks by default.
proxy_ssl_server_name          on;
proxy_ssl_name                 ${LODB_PAGES_STORE_HOST};
proxy_ssl_verify               on;
proxy_ssl_verify_depth         3;
proxy_ssl_trusted_certificate  /etc/ssl/certs/ca-certificates.crt;

# A few milliseconds away (fr-par): a store that does not answer within these bounds is left
# for the location's fallback rather than waited for. A second try at most (a kept-alive
# connection the store has closed), and both within about one read's bound.
proxy_connect_timeout        1s;
proxy_send_timeout           3s;
proxy_read_timeout           3s;
proxy_next_upstream_tries    2;
proxy_next_upstream_timeout  4s;

# Only an object is an answer: any other status goes to the location's error_page, and its
# body, an S3 error document, never reaches a client.
proxy_intercept_errors  on;

# How long an answer stays in the hot cache is the location's to say: a page follows its
# object's Cache-Control, a bundle is kept a year (pages-store/pages.conf, bundles.conf). Never
# an error. The store's Vary and cookies are not a page's.
proxy_hide_header     Vary;
proxy_hide_header     Set-Cookie;

# A page is stored compressed once, as the SSR server sent it, and a bundle may be: a client
# without gzip gets it decompressed, and nginx states Vary: Accept-Encoding itself (gzip_vary,
# nginx.conf).
gunzip  on;
