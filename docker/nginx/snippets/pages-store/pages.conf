# Pages of a version pinned in the path, a past patch's (ADR 0005, ADR 0011), included by the
# site's server block (sites/site.conf) where its regex locations are tried: the page store
# first, then the SSR server and its cache (snippets/archive-cache.conf), which render and keep
# what the store does not hold, a query and any path a pass never writes ($lodb_store_page). The
# same rate as every other page.
#
# The order of the phases matters. The `if` routes in the rewrite phase, before limit_req: the
# SSR server's location limits what it receives that way, and limit_req counts a request once,
# whichever location runs it. A location that declares an error_page inherits none, so this one
# names its own. Its rate refusals answer 420 here, apart from the store's own 429 (Scaleway's
# throttling), which falls back to the SSR server; both locations' refusals reach the client as
# the 429 and Retry-After of every page (@lodb_rate_limited, snippets/server-guards.conf), which
# recursive_error_pages lets the SSR server's location reach after a first redirect.
location ~ "^/[a-z]{2}(?:-han[st])?/[0-9]" {
    set $lodb_pinned_origin store;
    # 418: an answer no upstream gives here, only a route to the SSR server.
    if ($lodb_store_page = "") {
        return 418;
    }
    # The latest patch pinned in the path, which the store never holds ($lodb_latest_pinned,
    # sites/site.conf). After the first `if`: only a request the store would get pays the read.
    if ($lodb_latest_pinned) {
        return 418;
    }
    limit_req             zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
    limit_req_status      420;
    error_page            420 =429 @lodb_rate_limited;
    error_page            301 302 307 308 400 403 404 405 418 429 500 501 502 503 504
                          = @lodb_pinned_ssr;
    recursive_error_pages on;

    proxy_pass ${LODB_PAGES_STORE_SCHEME}://lodb_pages_store$lodb_store_page;
    include    /etc/nginx/snippets/pages-store/request.conf;

    # The store's answer is never kept here (ADR 0011, amendment of 2026-10-27): the store holds
    # every past patch's page and answers in some tens of milliseconds, while a crawl asks each
    # URL about once a day, so a copy written per page is almost never read again. Kept from the
    # first request, those copies filled the cache's 20 GB in about a day, and their inodes and
    # dentries, charged to nginx's memory, its whole limit. The client gets the Cache-Control of the
    # object's class ($lodb_pinned_cache_control). The X-Accel-* controls nginx would obey are
    # not a page's.
    include    /etc/nginx/snippets/pinned-answer.conf;
    proxy_ignore_headers  X-Accel-Expires X-Accel-Redirect X-Accel-Limit-Rate X-Accel-Buffering
                          X-Accel-Charset;

    # A stored page is a page whatever its object says ($lodb_pinned_content_type,
    # sites/site.conf). Here alone: the SSR server's location keeps nginx's own handling of the
    # type its renders state.
    proxy_hide_header Content-Type;
    add_header Content-Type   $lodb_pinned_content_type always;
    include    /etc/nginx/snippets/security-headers.conf;
}

# Reads the latest patch from the API (njs/latest-version.js), on one worker, every 30 s: about
# as soon as the SSR server, whose own copy of /api/meta lives a few minutes, redirects it. A
# named location: no request ever reaches it.
location @lodb_latest_version {
    js_periodic       lodb_latest.refresh interval=30s;
    js_fetch_timeout  5s;
}

# The SSR server's pinned lane, the only way before the store (src/server/admission). The
# analytics mirror stays here: a page the store may hold has a dot in its path, which the mirror
# never counts (server.d/analytics.conf).
location @lodb_pinned_ssr {
    set        $lodb_pinned_origin ssr;
    limit_req  zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
    proxy_pass http://lodb_web_ssr;
    include    /etc/nginx/snippets/proxy-headers.conf;
    include    /etc/nginx/snippets/archive-cache.conf;
    include    /etc/nginx/snippets/rendered-pages.conf;
    include    /etc/nginx/snippets/analytics-mirror.conf;
}
