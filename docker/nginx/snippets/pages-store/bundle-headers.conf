# What every answer of /build/ carries, whichever of its locations gives it (sites/site.conf,
# pages-store/bundles.conf): the cache's verdict, and the constant security headers. A bundle
# runs as a page's script or style, never as a document: as for the blobs, the policy keeps a
# file opened directly from running anything, and is ignored for a script or a style that a
# page loads. The previous builds' files come from a volume the SSR server writes
# (src/server/assets), and the older ones from the page store, not from its image.
add_header X-Cache-Status $upstream_cache_status always;
add_header Content-Security-Policy "default-src 'none'; sandbox" always;
include    /etc/nginx/snippets/security-headers.conf;
