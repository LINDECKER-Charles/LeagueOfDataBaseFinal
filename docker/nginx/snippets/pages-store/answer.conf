# What an answer of the page store carries that no client sees (ADR 0011), included by every
# location that answers from a cache the store fills (snippets/archive-cache.conf): S3 names
# each answer and describes its object, and a stored page's own headers, kept as metadata, are
# posed again under their own names. nginx hides names, never a pattern: a field the pass adds
# to the metadata belongs here as well. So many long names outgrow the default buckets of the
# table nginx builds from them, and it would refuse to start.
proxy_headers_hash_bucket_size  128;
proxy_hide_header x-amz-request-id;
proxy_hide_header x-amz-id-2;
proxy_hide_header x-amz-version-id;
proxy_hide_header x-amz-storage-class;
proxy_hide_header x-amz-expiration;
proxy_hide_header x-amz-server-side-encryption;
proxy_hide_header x-amz-tagging-count;
proxy_hide_header x-amz-missing-meta;
proxy_hide_header x-amz-meta-content-security-policy;
proxy_hide_header x-amz-meta-content-security-policy-report-only;
proxy_hide_header x-amz-meta-reporting-endpoints;
proxy_hide_header x-amz-meta-link;
proxy_hide_header x-amz-meta-lodb-build;
# What a store may add of its own: the checksums and the signed payload's hash an upload
# declared, echoed on a read, its request id under another name, its CORS answer, and what it
# states of the object's region, lock, replication and encryption.
proxy_hide_header x-amzn-requestid;
proxy_hide_header x-amz-content-sha256;
proxy_hide_header x-amz-sdk-checksum-algorithm;
proxy_hide_header x-amz-checksum-crc32;
proxy_hide_header x-amz-checksum-crc32c;
proxy_hide_header x-amz-checksum-crc64nvme;
proxy_hide_header x-amz-checksum-sha1;
proxy_hide_header x-amz-checksum-sha256;
proxy_hide_header x-amz-checksum-type;
proxy_hide_header x-amz-bucket-region;
proxy_hide_header x-amz-object-lock-mode;
proxy_hide_header x-amz-object-lock-retain-until-date;
proxy_hide_header x-amz-object-lock-legal-hold;
proxy_hide_header x-amz-replication-status;
proxy_hide_header x-amz-restore;
proxy_hide_header x-amz-website-redirect-location;
proxy_hide_header x-amz-server-side-encryption-customer-algorithm;
proxy_hide_header Access-Control-Allow-Origin;
proxy_hide_header Access-Control-Expose-Headers;
proxy_hide_header Access-Control-Allow-Credentials;
