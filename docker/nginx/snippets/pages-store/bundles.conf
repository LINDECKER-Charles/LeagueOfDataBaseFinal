# Bundles of a build the SSR server no longer keeps (ADR 0011), included by the site's server
# block (sites/site.conf). A stored page names its build's bundles for as long as it is served,
# longer than the volume front-builds keeps them; the pass copies a build's bundles under
# build/ in the store before any page of it. The bundles' location sends the SSR server's 404
# here, and only that one.
#
# Reached through an error_page, this location may follow one more (recursive_error_pages, set
# by the bundles' location): any answer of the store but an object, and a name the store is not
# asked for, end as the plain 404 of @lodb_build_missing, never as an S3 error document.
#
# A miss is never kept, so any name of the grammar reaches the store again: the pages' rate
# bounds what one client sends it, counted here alone, once per request (limit_req runs after
# the `if`), where a whole old build's chunks fit in the burst. Its refusals answer 420 here,
# apart from the store's own 429 (Scaleway's throttling, a missing bundle), and reach the client
# as the 429 and Retry-After of every page (@lodb_rate_limited, snippets/server-guards.conf).
location @lodb_build_store {
    # The store switched off, or a name no build has ($lodb_store_bundle, sites/site.conf).
    if ($lodb_store_bundle = "") {
        return 404;
    }
    limit_req        zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
    limit_req_status 420;
    error_page       420 =429 @lodb_rate_limited;
    error_page 301 302 307 308 400 403 404 405 429 500 501 502 503 504 =404 @lodb_build_missing;

    proxy_pass ${LODB_PAGES_STORE_SCHEME}://lodb_pages_store$lodb_store_bundle;
    include    /etc/nginx/snippets/pages-store/request.conf;
    include    /etc/nginx/snippets/pages-store/answer.conf;

    # Under the bundles' cache and key: the next request is a HIT in their location.
    proxy_cache               lodb_assets;
    proxy_cache_key           $uri;
    proxy_cache_lock          on;
    proxy_cache_lock_timeout  5s;
    include    /etc/nginx/snippets/pages-store/bundle-headers.conf;
}

# A name that neither the SSR server nor the store has: nginx's own 404, never kept.
location @lodb_build_missing {
    include /etc/nginx/snippets/pages-store/bundle-headers.conf;
    return  404;
}
