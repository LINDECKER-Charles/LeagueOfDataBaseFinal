# Guards of a server block (sites/site.conf, sites/api.conf), included at server level: they
# act before anything reaches the API or the SSR server.

# ── Refused clients ─────────────────────────────────────────────────────────────────
# By their exact User-Agent (nginx.conf, $lodb_blocked_agent): a 403 from nginx, so neither
# the SSR server nor the API spends anything on them. A server-level `return` runs before
# the location is chosen.
if ($lodb_blocked_agent) {
    return 403;
}

# ── Slow clients ────────────────────────────────────────────────────────────────────
# A client gets 10 s to send its headers or its next body chunk, and 30 s to read an answer:
# slow clients cannot hold connections for long.
client_header_timeout  10s;
client_body_timeout    10s;
send_timeout           30s;

# ── Paths that exist nowhere ────────────────────────────────────────────────────────
# Dotfiles (/.env, /.git/config…) and server-side scripts or dumps: nothing of the kind is
# served here. A plain 404 from nginx instead of booting a render that the page cache would
# then keep. /.well-known/ stays open; .xml is left out, the sitemaps end with it.
location ~ /\.(?!well-known/) {
    return 404;
}

# A username may end with one of these extensions (letters, digits, "_", "." and "-"): a
# path whose last segment names a profile (/{locale}/u/, the former /u/, /api/profiles/,
# /v1/profiles/) is left to the SSR server or the API, which know the account.
location ~* "^(?!(?:/[a-z]{2}(?:-han[st])?)?/u/[^/]+$|/(?:api|v1)/profiles/[^/]+$).*\.(?:php\d?|aspx?|jsp|cgi|env|sql|bak|ini|cfm)$" {
    return 404;
}

# ── Clients past their rate (limit_req, sites/site.conf) ────────────────────────────
# A location that declares its own error_page must repeat this one: nginx inherits none then.
error_page 429 @lodb_rate_limited;

location @lodb_rate_limited {
    default_type text/plain;
    add_header   Retry-After   "${LODB_RATE_LIMITED_RETRY_AFTER}" always;
    add_header   Cache-Control "no-store" always;
    include      /etc/nginx/snippets/security-headers.conf;
    return 429 "429 Too Many Requests\n";
}
