# Constant security headers for every response of both server blocks. `always` covers the
# error responses too.
#
# nginx quirk: add_header does not inherit into a block that declares its own add_header,
# so every such location includes this file again.
#
# HSTS (two years) is ignored over plain HTTP (local stack), so it is safe everywhere. The
# Content-Security-Policy is the SSR server's, with its Trusted Types in Report-Only and its
# Reporting-Endpoints: it hashes the inline scripts of each page
# (src/LoDb.Web/src/server/security/csp/). X-Frame-Options doubles its frame-ancestors 'none'
# for older agents; nothing of the site is ever framed.
add_header Strict-Transport-Security    "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options       "nosniff"                                      always;
add_header X-Frame-Options              "DENY"                                         always;
add_header Referrer-Policy              "strict-origin-when-cross-origin"              always;
# same-origin, except the public images of /cdn/blobs/ (see $lodb_resource_policy).
add_header Cross-Origin-Resource-Policy $lodb_resource_policy                          always;
# A page keeps no reference to the window that opened it, nor to a page of another site that
# it opens: signing in with Google and paying are navigations of the page, never pop-ups.
add_header Cross-Origin-Opener-Policy   "same-origin"                                  always;
# Device and payment features the site never uses are denied to every page, and to any script
# running there. Fullscreen, autoplay, sharing and the clipboard keep their defaults: the
# ability videos and the share buttons use them.
add_header Permissions-Policy           "accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(), midi=(), payment=(), serial=(), usb=()" always;

# "noindex, nofollow" when LODB_NOINDEX=1 (staging), empty otherwise: nginx drops an
# add_header whose value is empty. A header rather than robots.txt: engines must still
# crawl the pages to see the noindex.
add_header X-Robots-Tag                 $lodb_robots_tag                               always;
