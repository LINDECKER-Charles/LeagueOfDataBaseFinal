# What a past patch's page carries, whichever way it came (pages-store/pages.conf): from the
# store, from the SSR server, or from the SSR server's cache (archive-cache.conf), which may
# still hold a copy of the store's answer kept before 2026-10-27 (ADR 0011). A stored page's own
# headers come back from its object's metadata, under the names the pass writes them, and the
# store's other headers never reach a client; one without its policy gets a strict one
# ($lodb_pinned_policy, sites/site.conf). nginx drops an empty value: a page the SSR server
# rendered keeps its own headers, which it sends.
include    /etc/nginx/snippets/pages-store/answer.conf;
proxy_hide_header Cache-Control;
add_header Cache-Control           $lodb_pinned_cache_control always;
add_header Content-Security-Policy $lodb_pinned_policy always;
add_header Content-Security-Policy-Report-Only
           $upstream_http_x_amz_meta_content_security_policy_report_only always;
add_header Reporting-Endpoints     $upstream_http_x_amz_meta_reporting_endpoints always;
add_header Link                    $upstream_http_x_amz_meta_link always;
add_header X-LoDb-Source           $lodb_pinned_source always;
