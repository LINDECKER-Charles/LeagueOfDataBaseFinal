# Template rendered by envsubst at start (LODB_* variables only).
#
# The public API subdomain (API_CADDY_DOMAINS, which must start with "api."): /v1/ and
# /healthz, everything else a plain 404, as go-api answers today.
#
# Regex server names are tried in file order and this file sorts before site.conf: an
# "api.….fr" host must reach this block before the site's ".fr" redirect.
server {
    listen 80;
    server_name ~^api\.;

    include /etc/nginx/snippets/security-headers.conf;

    location /v1/ {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Proxied, not answered here: the edge's smoke test then proves the API itself is up.
    location = /healthz {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    location / {
        default_type text/plain;
        return 404 "404 page not found\n";
    }
}
