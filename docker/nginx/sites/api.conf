# Template rendered by envsubst at start (LODB_* variables only, defaults in the Dockerfile).
#
# The public API subdomain (API_CADDY_DOMAINS, which must start with "api."): /v1/, /healthz
# and /readyz, everything else a plain 404, as go-api answers today.
#
# Regex server names are tried in file order and this file sorts before site.conf: an
# "api.….fr" host must reach this block before the site's ".fr" redirect.
server {
    listen 8080;
    server_name ~^api\.;

    include /etc/nginx/snippets/edge-guard.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/server-guards.conf;

    location /v1/ {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Proxied, not answered here: the edge's smoke test then proves the API itself is up.
    location = /healthz {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Readiness of the API (database and storage) for the external probe: a page would hide
    # an API outage behind the page cache's stale copy. Each call reaches the database,
    # hence its own rate per address.
    location = /readyz {
        limit_req  zone=lodb_rate_readyz burst=${LODB_READYZ_BURST} nodelay;
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    location / {
        default_type text/plain;
        return 404 "404 page not found\n";
    }
}
