# Template rendered by envsubst at start (LODB_* variables only, defaults in the Dockerfile).

# ── http level, shared with api.conf ────────────────────────────────────────────────
# Real client address: only the edge's network may state it in X-Forwarded-For. Anyone
# else (a local client, a container of the stack) keeps its own address.
set_real_ip_from ${LODB_EDGE_CIDR};
real_ip_header   X-Forwarded-For;

# Requests that did not come through the edge: every container of the shared `edge` network
# reaches this port, the edge alone knows LODB_EDGE_SECRET (written once per host by the
# deploy job, sent in X-LoDb-Edge, compose.deploy.yaml). Any other request is refused with a
# 403 (snippets/edge-guard.conf), except /healthz, the container's probe. With the secret
# empty (a local stack), nothing is required. proxy-headers.conf keeps the header from the
# API and the SSR server. A map ignores case, which costs a hexadecimal value nothing.
map "${LODB_EDGE_SECRET}" $lodb_edge_required {
    ""       0;
    default  1;
}

map $http_x_lodb_edge $lodb_edge_presented {
    default                0;
    "${LODB_EDGE_SECRET}"  1;
}

# /healthz as `location = /healthz` reads it: with case and to the very end (`\z`, where `$`
# would also accept a trailing %0A). A plain string here would ignore case, and /HEALTHZ
# would reach the SSR server without the header.
map "$lodb_edge_required$lodb_edge_presented:$uri" $lodb_edge_refused {
    default              0;
    "~^10:/healthz\z"    0;
    "~^10:"              1;
}

map "${LODB_NOINDEX}" $lodb_robots_tag {
    default  "";
    "1"      "noindex, nofollow";
}

# The AI crawlers ($lodb_ai_crawler, nginx.conf) where nothing is indexed: a 403 there
# (snippets/server-guards.conf). An indexed stack lets them through.
map "${LODB_NOINDEX}:$lodb_ai_crawler" $lodb_refused_crawler {
    default  0;
    "1:1"    1;
}

# Deployment revision, first part of the page cache's key (snippets/page-cache.conf).
map "" $lodb_cache_revision {
    default  "${LODB_REVISION}";
}

# Epoch of the stored pages that nginx serves (ADR 0011): the folder pages/{epoch}/ it reads in
# the page store.
map "" $lodb_archive_serve_epoch {
    default  "${LODB_ARCHIVE_SERVE_EPOCH}";
}

# Both epochs of the past patches' pages, first part of their cache's key instead of the
# revision (snippets/archive-cache.conf): LODB_ARCHIVE_EPOCH, raised by hand, purges that cache
# alone; serving another epoch of the store leaves behind the pages kept from the previous one.
map "" $lodb_archive_epochs {
    default  "${LODB_ARCHIVE_EPOCH}.$lodb_archive_serve_epoch";
}

# The locale a visitor asked the switcher to remember: the `loc` field of the lod_prefs
# cookie, which only the browser writes (`loc=fr&v=…`). `/` opens on it rather than on
# Accept-Language, as the legacy site's session did. The shape alone is checked here: the
# browser writes site locales only, and the SSR answers any other with a 404.
map $cookie_lod_prefs $lodb_remembered_locale {
    default                                                    "";
    "~(?:^|&)loc=(?<lodb_loc>[a-z]{2}(?:-han[st])?)(?:&|$)"   $lodb_loc;
}

# The site's pages, as the SSR server's pre-router tells them from its files: `/`, and the paths
# whose first segment is a locale, `b` (a shared build) or `admin`. While a deploy replaces the
# stack, they alone answer the maintenance page (server.d/maintenance.conf); the API, the media,
# the bundles and the crawler files keep their own answers. Case and end as in the pre-router.
map $uri $lodb_maintenance_page {
    default                                   0;
    "/"                                       1;
    "~^/(?:[a-z]{2}(?:-han[st])?|b|admin)(?:/|\z)"  1;
}

# The path as the client sent it, without the query (snippets/seo-cache.conf): what a
# proxy_pass without a URI hands the upstream. $uri is nginx's decoded, merged form, under
# which two paths the upstream tells apart would share one cache entry.
map $request_uri $lodb_request_path {
    default                       $request_uri;
    "~^(?<lodb_raw_path>[^?]*)"   $lodb_raw_path;
}

# ── Page store (ADR 0011) ───────────────────────────────────────────────────────────
# An S3 bucket (path style) that only the host's address may read, anonymously. Its name is
# resolved again as it changes (resolver, nginx.conf) and is never needed to start: a page
# nginx cannot fetch there falls back to the SSR server.
upstream lodb_pages_store {
    zone      lodb_pages_store 64k;
    server    ${LODB_PAGES_STORE_HOST}:${LODB_PAGES_STORE_PORT} resolve;
    keepalive 8;
}

# The object a past patch's page is read from (snippets/pages-store/pages.conf), or "" when the
# store is not asked: switched off (LODB_PAGES_STORE_ENABLED=0, a local stack and the CI), a
# method other than GET or HEAD, a query (the SSR server renders it, nothing stores it), or a
# path a pass never writes, outside the 4 lists, the patch page (changes) and the entity pages
# of a version (src/LoDb.Domain/Paths, VersionPages). Read on the path as sent: a proxy_pass with
# variables hands it on unnormalized, so no other character ever reaches the store (no "%",
# "..", "//"). A page the pass writes that this map leaves out silently stays on the SSR server.
map "${LODB_PAGES_STORE_ENABLED}:$request_method$is_args$lodb_request_path" $lodb_store_page {
    default  "";
    "~(?x) ^1:(?:GET|HEAD) (?<lodb_store_page_path> /[a-z]{2}(?:-han[st])? /[0-9]+(?:\.[0-9]+)+
        / (?: (?:champions|summoners) (?:/[A-Za-z0-9_]+)?
            | (?:items|runes) (?:/[0-9]+(?:-[a-z0-9]+)*)?
            | changes ) )\z"
        "/${LODB_PAGES_STORE_BUCKET}/pages/$lodb_archive_serve_epoch$lodb_store_page_path";
}

# The latest patch, which no pass ever stores (ADR 0011): the API states it, and a promotion
# changes it between deploys, so nginx reads it at run time (njs/latest-version.js, refreshed by
# @lodb_latest_version, snippets/pages-store/pages.conf) rather than from a variable set at
# start. "" until a first read.
js_path              /etc/nginx/njs/;
js_import            lodb_latest from latest-version.js;
js_shared_dict_zone  zone=lodb_latest_version:64k type=string;
js_set               $lodb_latest_version lodb_latest.read;

# The robots journal (njs/robot-journal.js, ADR 0013): every request of a client that says it
# is a robot ($lodb_robot_agent, nginx.conf), whatever its path, and every page request of the
# others, whose pace alone gives a hidden robot away; the API keeps the robots' only. Neither
# the probe nor a request refused for coming around the edge. The site's access log writes
# nothing anywhere: formatting its line runs record(), which queues the request. A record the
# API has not taken within 10 minutes is dropped, the oldest first once the zone is full.
js_import            lodb_robots from robot-journal.js;
js_shared_dict_zone  zone=lodb_robot_journal:8m type=string timeout=10m evict;
js_shared_dict_zone  zone=lodb_robot_journal_lock:64k type=string timeout=30s;
js_set               $lodb_robot_record lodb_robots.record;
log_format           lodb_robot_journal '$lodb_robot_record';

map $uri $lodb_journal_scope {
    default                              file;
    /healthz                             none;
    /                                    page;
    /robots.txt                          page;
    "~^/sitemap"                         page;
    "~^/[a-z]{2}(?:-han[st])?(?:/|$)"    page;
}

map "$lodb_edge_refused:$lodb_journal_scope:$lodb_robot_agent" $lodb_robot_candidate {
    default        0;
    "~^0:page:"    1;
    "0:file:1"     1;
}

# 1 for the latest patch pinned in its path (/en/16.21.1/…): the SSR server answers its 301 to
# the short URL, without a miss of the store first (snippets/pages-store/pages.conf). The version
# read is matched again, whole, in the path. Read only where the store would be asked: before
# any read, or with the store switched off, nginx behaves as without it.
map "$lodb_latest_version:$lodb_request_path" $lodb_latest_pinned {
    default  0;
    "~^([0-9]+(?:\.[0-9]+)+):/[a-z]{2}(?:-han[st])?/\1(?:/|\z)"  1;
}

# The object of a bundle the SSR server no longer has (snippets/pages-store/bundles.conf): a
# hashed name under build/, or "" as above, for a name no build has.
map "${LODB_PAGES_STORE_ENABLED}:$request_method$lodb_request_path" $lodb_store_bundle {
    default  "";
    "~(?x) ^1:(?:GET|HEAD) (?<lodb_store_bundle_path>
        /build/ (?:media/)? [A-Za-z0-9_-]+ (?:\.[A-Za-z0-9_-]+)+ )\z"
        "/${LODB_PAGES_STORE_BUCKET}$lodb_store_bundle_path";
}

# What answered a past patch's page, in X-LoDb-Source for the edge's journal: the hot cache
# (whoever filled it), or the one its location asked ($lodb_pinned_origin): the store or the
# SSR server. A store that turns every reader away (its policy, the host's address) shows
# only there, as a share of "ssr" that stays high once a pass is over.
map "$lodb_pinned_origin:$upstream_cache_status" $lodb_pinned_source {
    volatile;
    "~:(?:HIT|STALE|UPDATING|REVALIDATED)\z"  cache;
    "~^(?<lodb_pinned_asked>[a-z]+):"         $lodb_pinned_asked;
}

# Cache-Control of a past patch's page: an answer of the store gets its object's class, the
# one its render chose (src/LoDb.Web/src/app/core/routing/response/cache-control.ts, held equal
# by tools/nginx/test/archived-cache-control.test.mjs): `revisable` for an object of that class,
# the open state's page; `archived` for any other, a closed state's page, or an object stored
# before the classes or without a Cache-Control. Any other answer keeps its own. Told apart by
# the build the pass writes in every page's metadata (lodb-build), which the cache keeps with
# the page: no transport header of S3's is sent by every store alike (the local stack's
# simulated one has none of Scaleway's). The class's value is matched whole, quoted for its
# spaces.
map "$upstream_http_x_amz_meta_lodb_build|$upstream_http_cache_control"
    $lodb_pinned_cache_control {
    volatile;
    "~^\|"  $upstream_http_cache_control;
    "~^[^|]+\|public, max-age=3600, s-maxage=3600, stale-while-revalidate=3600\z"
             "public, max-age=3600, s-maxage=3600, stale-while-revalidate=3600";
    default  "public, max-age=3600, s-maxage=31536000";
}

# Policy of a past patch's page: an answer of the store whose object lacks its own (a defect of
# the pass, or a write with the writer's key) gets a strict one rather than none, stricter than
# any the SSR server sends (src/LoDb.Web/src/server/security/csp/document-policy.ts, without
# its scripts' hashes nor the Riot art): the site's own files, no inline script, no plugin, never
# framed. Any other answer keeps the policy of its metadata, or none: the SSR server sends its
# own.
map "" $lodb_store_policy_sources {
    default  "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'";
}

map "" $lodb_store_policy_embedding {
    default  "object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'";
}

map "$upstream_http_x_amz_meta_lodb_build|$upstream_http_x_amz_meta_content_security_policy"
    $lodb_pinned_policy {
    volatile;
    default        $upstream_http_x_amz_meta_content_security_policy;
    "~^[^|]+\|\z"  "$lodb_store_policy_sources; $lodb_store_policy_embedding; form-action 'self'";
}

# Type of a past patch's page: an answer of the store is a page whatever its object says (S3
# answers binary/octet-stream for an object stored without a type, which a browser would
# download), and any other answer keeps its own (snippets/pages-store/pages.conf).
map $upstream_http_x_amz_meta_lodb_build $lodb_pinned_content_type {
    volatile;
    ""       $upstream_http_content_type;
    default  "text/html; charset=utf-8";
}

# Request bodies: the API takes small JSON documents only, and a body that passes is held
# in memory, never spilled to disk. The Stripe webhook alone takes more (location below).
client_max_body_size    ${LODB_MAX_BODY_SIZE};
client_body_buffer_size ${LODB_MAX_BODY_SIZE};

# Request rate per client address ($binary_remote_addr is the real one, see above). Only
# the anonymous, cacheable or cheap-to-repeat paths have one: an account's own actions
# never do, many members may share one address (ADR 0009). A refusal is a 429 with
# Retry-After (snippets/server-guards.conf). The rates bound one client; what a
# distributed crawl costs is bounded further in, where the expensive work happens.
limit_req_zone $binary_remote_addr zone=lodb_rate_pages:10m     rate=${LODB_PAGES_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_api_reads:10m rate=${LODB_API_READS_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_legacy:4m     rate=${LODB_LEGACY_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_sitemaps:1m   rate=${LODB_SITEMAPS_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_readyz:1m     rate=${LODB_READYZ_RATE};
limit_req_status 429;
# Below error_log's level: one line per refusal would flood the host's collector, and the
# edge's journal already records every 429.
limit_req_log_level notice;

# Page caches in front of web-ssr (ADR 0005), each folder a volume (compose.yaml): a cache
# outlives a recreated container. Their memory and the kernel's cache of their files count
# against nginx's memory limit (compose.deploy.yaml).
#
# The latest patch's pages (snippets/page-cache.conf): its key sorts the revisions, so a deploy
# leaves the previous build's entries to age out within a day.
proxy_cache_path /var/cache/nginx/pages levels=1:2 use_temp_path=off
                 keys_zone=lodb_pages:${LODB_PAGE_CACHE_KEYS_SIZE}
                 max_size=${LODB_PAGE_CACHE_SIZE} inactive=${LODB_PAGE_CACHE_INACTIVE};
# The past patches' pages (snippets/archive-cache.conf), the hot copy of the page store and of
# the SSR server's renders, kept as long as their Cache-Control says (a year for a closed
# state's page, an hour for the open state's) and across the deploys: a page stays on disk for
# as long as it is asked for. Larger, as there are a few hundred patches; a sweep of every patch
# cannot evict the latest patch's pages.
proxy_cache_path /var/cache/nginx/archive levels=1:2 use_temp_path=off
                 keys_zone=lodb_archive:${LODB_ARCHIVE_CACHE_KEYS_SIZE}
                 max_size=${LODB_ARCHIVE_CACHE_SIZE} inactive=${LODB_ARCHIVE_CACHE_INACTIVE};

# The hashed bundles of /build/, keyed by their name alone: a name is its content, the same
# for every host and every deploy. On a volume too, so that a deploy finds them warm. The
# front-builds volume keeps the previous builds' files LODB_FRONT_BUILDS_RETENTION_DAYS (400)
# days (src/server/assets, purged by the deploy job), this cache for as long as they are asked
# for.
proxy_cache_path /var/cache/nginx/assets levels=1:2 use_temp_path=off
                 keys_zone=lodb_assets:${LODB_ASSETS_CACHE_KEYS_SIZE}
                 max_size=${LODB_ASSETS_CACHE_SIZE} inactive=${LODB_ASSETS_CACHE_INACTIVE};

# Crawler files (server.d/seo.conf) and the former site's 301 (legacy-redirects.conf), kept
# for as long as the API's Cache-Control allows. On volumes, like the pages, under a key that
# starts with the revision: a deploy never serves the previous build's answers, which age out.
proxy_cache_path /var/cache/nginx/seo levels=1:2 use_temp_path=off keys_zone=lodb_seo:4m
                 max_size=256m inactive=7d;
proxy_cache_path /var/cache/nginx/legacy levels=1:2 use_temp_path=off
                 keys_zone=lodb_legacy:8m max_size=256m inactive=1h;

# ── Host hygiene ────────────────────────────────────────────────────────────────────
# "www." and ".fr" hosts are 301'd to the canonical host, so a page answers on a single
# origin and never boots the SSR. The destination is fixed, never taken from the
# client-controlled Host: no open redirect. Bounded to one hour: a bare 301 is cached
# almost forever by browsers, while engines consolidate on the status alone.
server {
    listen 8080;
    server_name ~^www\. ~\.fr$;

    include /etc/nginx/snippets/edge-guard.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    return 301 https://${LODB_CANONICAL_HOST}$request_uri;
}

# ── The site ────────────────────────────────────────────────────────────────────────
# Every public host that is neither the API subdomain nor a redirected one.
server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/snippets/edge-guard.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/server-guards.conf;

    # The robots journal, whatever location answers, its refusals included (see above).
    access_log /dev/null lodb_robot_journal if=$lodb_robot_candidate;

    # Liveness of nginx itself, for the container probe: it proxies nothing.
    location = /healthz {
        default_type text/plain;
        add_header   Cache-Control "no-store";
        include      /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Posts the robots journal to the API (njs/robot-journal.js), on one worker, every 2 s. A
    # named location: no request ever reaches it.
    location @lodb_robot_journal {
        js_periodic       lodb_robots.flush interval=2s;
        js_fetch_timeout  5s;
    }

    # Content-addressed media, straight from the storage volume (read-only here, written by
    # the API alone): the hash of the bytes and a media extension, nothing else of the
    # folder. A key is the hash: immutable, cached for a year. The policy keeps a file that
    # is opened directly from running anything.
    location ~ "^/cdn/blobs/(?<lodb_blob>[0-9a-f]{64}\.(?:png|jpe?g|webp|gif|webm|mp4))$" {
        alias      /srv/storage/blobs/$lodb_blob;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        include    /etc/nginx/snippets/security-headers.conf;
    }

    # Allow-list: blobs are the only web-facing part of the storage (ADR 0004).
    location /cdn/ {
        return 404;
    }

    # The API's public reads (catalog, pickers, shared builds…), open to anyone without an
    # account: what a page or an app fetches while browsing. Matched whatever the case: the
    # API routes /api/Catalog/… as /api/catalog/…, which /api/ below would let through.
    location ~* ^/api/(?:catalog|pickers|meta|legacy|trends|share)(?:/|$) {
        limit_req  zone=lodb_rate_api_reads burst=${LODB_API_READS_BURST} nodelay;
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Everything else of /api/: an account's actions, never limited by address.
    location /api/ {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    location /v1/ {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Stripe's events outgrow the other bodies; the API caps them at 1 MiB as well.
    location /webhooks/ {
        client_max_body_size ${LODB_WEBHOOK_MAX_BODY_SIZE};
        proxy_pass           http://lodb_api;
        include              /etc/nginx/snippets/proxy-headers.conf;
    }

    # Hashed front bundles only (deployUrl of the `web` build), this build's and the previous
    # ones': a year, immutable, set by the SSR server, which answers a plain 404 for any other
    # name. A 404 carries no lifetime and is never kept. `^~` keeps every regex location, the
    # legacy redirects included, away from this prefix: no page lives here.
    location ^~ /build/ {
        proxy_pass http://lodb_web_ssr;
        include    /etc/nginx/snippets/proxy-headers.conf;

        proxy_cache               lodb_assets;
        proxy_cache_key           $uri;
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  30s;
        proxy_cache_use_stale     error timeout http_500 http_502 http_503 http_504 http_429;
        proxy_connect_timeout     5s;

        # A name the SSR server does not know may be an older build's, kept by the page store:
        # its 404 alone goes there (snippets/pages-store/bundles.conf), whose answers this
        # cache then keeps, under the same key.
        proxy_intercept_errors    on;
        recursive_error_pages     on;
        error_page                404 = @lodb_build_store;
        include    /etc/nginx/snippets/pages-store/answer.conf;
        include    /etc/nginx/snippets/pages-store/bundle-headers.conf;
    }
    include /etc/nginx/snippets/pages-store/bundles.conf;

    # `/` answers a 302 that depends on Accept-Language: never cached here. A remembered
    # locale answers first, here, since the SSR server reads no cookie (ADR 0005).
    location = / {
        limit_req  zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
        # A relative Location (absolute_redirect, nginx.conf), as the SSR's own.
        if ($lodb_remembered_locale) {
            include    /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "private, no-store" always;
            return     302 /$lodb_remembered_locale/;
        }
        proxy_pass http://lodb_web_ssr;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Pages of a version pinned in the path, a past patch's (ADR 0005, ADR 0011): their cache,
    # then the page store, then the SSR server. Here, among the regex locations, in this order.
    include /etc/nginx/snippets/pages-store/pages.conf;

    # Pages and the files of public/: the SSR server, behind the shared cache. The rate
    # counts cached answers too: it bounds one client, whatever the cache holds.
    location / {
        limit_req  zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
        proxy_pass http://lodb_web_ssr;
        include    /etc/nginx/snippets/proxy-headers.conf;
        include    /etc/nginx/snippets/page-cache.conf;
        include    /etc/nginx/snippets/analytics-mirror.conf;
    }

    # Server-level additions (seo, legacy redirects, analytics, Android files).
    include /etc/nginx/server.d/*.conf;
}
