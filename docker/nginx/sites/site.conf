# Template rendered by envsubst at start (LODB_* variables only, defaults in the Dockerfile).

# ── http level, shared with api.conf ────────────────────────────────────────────────
# Real client address: only the edge's network may state it in X-Forwarded-For. Anyone
# else (a local client, a container of the stack) keeps its own address.
set_real_ip_from ${LODB_EDGE_CIDR};
real_ip_header   X-Forwarded-For;

# Requests that did not come through the edge: every container of the shared `edge` network
# reaches this port, the edge alone knows LODB_EDGE_SECRET (written once per host by the
# deploy job, sent in X-LoDb-Edge, compose.deploy.yaml). Any other request is refused with a
# 403 (snippets/edge-guard.conf), except /healthz, the container's probe. With the secret
# empty (a local stack), nothing is required. proxy-headers.conf keeps the header from the
# API and the SSR server. A map ignores case, which costs a hexadecimal value nothing.
map "${LODB_EDGE_SECRET}" $lodb_edge_required {
    ""       0;
    default  1;
}

map $http_x_lodb_edge $lodb_edge_presented {
    default                0;
    "${LODB_EDGE_SECRET}"  1;
}

map "$lodb_edge_required$lodb_edge_presented:$uri" $lodb_edge_refused {
    default        0;
    "10:/healthz"  0;
    "~^10:"        1;
}

map "${LODB_NOINDEX}" $lodb_robots_tag {
    default  "";
    "1"      "noindex, nofollow";
}

# Deployment revision, first part of the page cache's key (snippets/page-cache.conf).
map "" $lodb_cache_revision {
    default  "${LODB_REVISION}";
}

# Epoch of the past patches' pages, first part of their cache's key instead of the revision
# (snippets/archive-cache.conf): raised by hand, it is their only purge.
map "" $lodb_archive_epoch {
    default  "${LODB_ARCHIVE_EPOCH}";
}

# The locale a visitor asked the switcher to remember: the `loc` field of the lod_prefs
# cookie, which only the browser writes (`loc=fr&v=…`). `/` opens on it rather than on
# Accept-Language, as the legacy site's session did. The shape alone is checked here: the
# browser writes site locales only, and the SSR answers any other with a 404.
map $cookie_lod_prefs $lodb_remembered_locale {
    default                                                    "";
    "~(?:^|&)loc=(?<lodb_loc>[a-z]{2}(?:-han[st])?)(?:&|$)"   $lodb_loc;
}

# The path as the client sent it, without the query (snippets/seo-cache.conf): what a
# proxy_pass without a URI hands the upstream. $uri is nginx's decoded, merged form, under
# which two paths the upstream tells apart would share one cache entry.
map $request_uri $lodb_request_path {
    default                       $request_uri;
    "~^(?<lodb_raw_path>[^?]*)"   $lodb_raw_path;
}

# Request bodies: the API takes small JSON documents only, and a body that passes is held
# in memory, never spilled to disk. The Stripe webhook alone takes more (location below).
client_max_body_size    ${LODB_MAX_BODY_SIZE};
client_body_buffer_size ${LODB_MAX_BODY_SIZE};

# Request rate per client address ($binary_remote_addr is the real one, see above). Only
# the anonymous, cacheable or cheap-to-repeat paths have one: an account's own actions
# never do, many members may share one address (ADR 0009). A refusal is a 429 with
# Retry-After (snippets/server-guards.conf). The rates bound one client; what a
# distributed crawl costs is bounded further in, where the expensive work happens.
limit_req_zone $binary_remote_addr zone=lodb_rate_pages:10m     rate=${LODB_PAGES_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_api_reads:10m rate=${LODB_API_READS_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_legacy:4m     rate=${LODB_LEGACY_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_sitemaps:1m   rate=${LODB_SITEMAPS_RATE};
limit_req_zone $binary_remote_addr zone=lodb_rate_readyz:1m     rate=${LODB_READYZ_RATE};
limit_req_status 429;
# Below error_log's level: one line per refusal would flood the host's collector, and the
# edge's journal already records every 429.
limit_req_log_level notice;

# Page caches in front of web-ssr (ADR 0005), each folder a volume (compose.yaml): a cache
# outlives a recreated container. Their memory and the kernel's cache of their files count
# against nginx's memory limit (compose.deploy.yaml).
#
# The latest patch's pages (snippets/page-cache.conf): its key sorts the revisions, so a deploy
# leaves the previous build's entries to age out within a day.
proxy_cache_path /var/cache/nginx/pages levels=1:2 use_temp_path=off
                 keys_zone=lodb_pages:${LODB_PAGE_CACHE_KEYS_SIZE}
                 max_size=${LODB_PAGE_CACHE_SIZE} inactive=${LODB_PAGE_CACHE_INACTIVE};
# The past patches' pages (snippets/archive-cache.conf), kept a week by the SSR's s-maxage and
# across the deploys: a page stays on disk for as long as it may be served. Larger, as there
# are a few hundred patches; a sweep of every patch cannot evict the latest patch's pages.
proxy_cache_path /var/cache/nginx/archive levels=1:2 use_temp_path=off
                 keys_zone=lodb_archive:${LODB_ARCHIVE_CACHE_KEYS_SIZE}
                 max_size=${LODB_ARCHIVE_CACHE_SIZE} inactive=${LODB_ARCHIVE_CACHE_INACTIVE};

# The hashed bundles of /build/, keyed by their name alone: a name is its content, the same
# for every host and every deploy. On a volume too, so that a deploy finds them warm. The SSR
# server keeps the previous builds' files 30 days (src/server/assets), this cache for as long
# as they are asked for.
proxy_cache_path /var/cache/nginx/assets levels=1:2 use_temp_path=off
                 keys_zone=lodb_assets:${LODB_ASSETS_CACHE_KEYS_SIZE}
                 max_size=${LODB_ASSETS_CACHE_SIZE} inactive=${LODB_ASSETS_CACHE_INACTIVE};

# Crawler files (server.d/seo.conf) and the former site's 301 (legacy-redirects.conf), kept
# for as long as the API's Cache-Control allows. On volumes, like the pages, under a key that
# starts with the revision: a deploy never serves the previous build's answers, which age out.
proxy_cache_path /var/cache/nginx/seo levels=1:2 use_temp_path=off keys_zone=lodb_seo:4m
                 max_size=256m inactive=7d;
proxy_cache_path /var/cache/nginx/legacy levels=1:2 use_temp_path=off
                 keys_zone=lodb_legacy:8m max_size=256m inactive=1h;

# ── Host hygiene ────────────────────────────────────────────────────────────────────
# "www." and ".fr" hosts are 301'd to the canonical host, so a page answers on a single
# origin and never boots the SSR. The destination is fixed, never taken from the
# client-controlled Host: no open redirect. Bounded to one hour: a bare 301 is cached
# almost forever by browsers, while engines consolidate on the status alone.
server {
    listen 8080;
    server_name ~^www\. ~\.fr$;

    include /etc/nginx/snippets/edge-guard.conf;
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=3600";
    return 301 https://${LODB_CANONICAL_HOST}$request_uri;
}

# ── The site ────────────────────────────────────────────────────────────────────────
# Every public host that is neither the API subdomain nor a redirected one.
server {
    listen 8080 default_server;
    server_name _;

    include /etc/nginx/snippets/edge-guard.conf;
    include /etc/nginx/snippets/security-headers.conf;
    include /etc/nginx/snippets/server-guards.conf;

    # Liveness of nginx itself, for the container probe: it proxies nothing.
    location = /healthz {
        default_type text/plain;
        add_header   Cache-Control "no-store";
        include      /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Content-addressed media, straight from the storage volume (read-only here, written by
    # the API alone): the hash of the bytes and a media extension, nothing else of the
    # folder. A key is the hash: immutable, cached for a year. The policy keeps a file that
    # is opened directly from running anything.
    location ~ "^/cdn/blobs/(?<lodb_blob>[0-9a-f]{64}\.(?:png|jpe?g|webp|gif|webm|mp4))$" {
        alias      /srv/storage/blobs/$lodb_blob;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        include    /etc/nginx/snippets/security-headers.conf;
    }

    # Allow-list: blobs are the only web-facing part of the storage (ADR 0004).
    location /cdn/ {
        return 404;
    }

    # The API's public reads (catalog, pickers, shared builds…), open to anyone without an
    # account: what a page or an app fetches while browsing. Matched whatever the case: the
    # API routes /api/Catalog/… as /api/catalog/…, which /api/ below would let through.
    location ~* ^/api/(?:catalog|pickers|meta|legacy|trends|share)(?:/|$) {
        limit_req  zone=lodb_rate_api_reads burst=${LODB_API_READS_BURST} nodelay;
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Everything else of /api/: an account's actions, never limited by address.
    location /api/ {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    location /v1/ {
        proxy_pass http://lodb_api;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Stripe's events outgrow the other bodies; the API caps them at 1 MiB as well.
    location /webhooks/ {
        client_max_body_size ${LODB_WEBHOOK_MAX_BODY_SIZE};
        proxy_pass           http://lodb_api;
        include              /etc/nginx/snippets/proxy-headers.conf;
    }

    # Hashed front bundles only (deployUrl of the `web` build), this build's and the previous
    # ones': a year, immutable, set by the SSR server, which answers a plain 404 for any other
    # name. A 404 carries no lifetime and is never kept. `^~` keeps every regex location, the
    # legacy redirects included, away from this prefix: no page lives here.
    location ^~ /build/ {
        proxy_pass http://lodb_web_ssr;
        include    /etc/nginx/snippets/proxy-headers.conf;

        proxy_cache               lodb_assets;
        proxy_cache_key           $uri;
        proxy_cache_lock          on;
        proxy_cache_lock_timeout  30s;
        proxy_cache_use_stale     error timeout http_500 http_502 http_503 http_504 http_429;
        proxy_connect_timeout     5s;
        add_header X-Cache-Status $upstream_cache_status always;
        # A bundle runs as a page's script or style, never as a document: as for the blobs, the
        # policy keeps a file opened directly from running anything. The previous builds' files
        # come from a volume the SSR server writes (src/server/assets), not from its image.
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        include    /etc/nginx/snippets/security-headers.conf;
    }

    # `/` answers a 302 that depends on Accept-Language: never cached here. A remembered
    # locale answers first, here, since the SSR server reads no cookie (ADR 0005).
    location = / {
        limit_req  zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
        # A relative Location (absolute_redirect, nginx.conf), as the SSR's own.
        if ($lodb_remembered_locale) {
            include    /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "private, no-store" always;
            return     302 /$lodb_remembered_locale/;
        }
        proxy_pass http://lodb_web_ssr;
        include    /etc/nginx/snippets/proxy-headers.conf;
    }

    # Pages of a version pinned in the path, a past patch's (ADR 0005): their own cache, which
    # outlives the deploys (snippets/archive-cache.conf). The same rate as every other page.
    #
    # A page is kept from its LODB_ARCHIVE_CACHE_MIN_USES-th request (2): a render asked for
    # once never reaches the disk. Below that count, nginx still keeps a key per distinct URL
    # until it goes inactive, whatever the answer (a cleaned query's 301, a shed 503): the keys
    # zone, not the disk, bounds how many URLs a sweep goes through before the least recently
    # asked pages leave the cache. At 1, only the answers kept hold a key.
    location ~ "^/[a-z]{2}(?:-han[st])?/[0-9]" {
        limit_req  zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
        proxy_pass http://lodb_web_ssr;
        include    /etc/nginx/snippets/proxy-headers.conf;
        include    /etc/nginx/snippets/archive-cache.conf;
        proxy_cache_min_uses ${LODB_ARCHIVE_CACHE_MIN_USES};
        include    /etc/nginx/snippets/analytics-mirror.conf;
    }

    # Pages and the files of public/: the SSR server, behind the shared cache. The rate
    # counts cached answers too: it bounds one client, whatever the cache holds.
    location / {
        limit_req  zone=lodb_rate_pages burst=${LODB_PAGES_BURST} nodelay;
        proxy_pass http://lodb_web_ssr;
        include    /etc/nginx/snippets/proxy-headers.conf;
        include    /etc/nginx/snippets/page-cache.conf;
        include    /etc/nginx/snippets/analytics-mirror.conf;
    }

    # Server-level additions (seo, legacy redirects, analytics, Android files).
    include /etc/nginx/server.d/*.conf;
}
