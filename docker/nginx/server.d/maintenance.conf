# The maintenance page: while a deploy replaces the containers, every page of the site answers a
# 503 with the page of docker/nginx/maintenance, instead of an error or a page of the build being
# replaced. The deploy job writes the state on the host
# (.deploy/maintenance/active.json, tools/deploy/maintenance.sh), a folder that
# compose.deploy.yaml mounts read-only on /srv/maintenance: the file there IS the switch, and a
# replaced nginx finds it as it was. Without the folder (a local stack), the switch never turns.
#
# Server-level `if`s run after edge-guard.conf's and server-guards.conf's, which come first in the
# server block: a request the edge did not send is still refused, a blocked agent still turned
# away. Only the pages turn ($lodb_maintenance_page, sites/site.conf): the API, the media, the
# bundles and the crawler files keep their own answers, and the page's files below stay served.
set $lodb_maintenance $lodb_maintenance_page;
if (!-f /srv/maintenance/active.json) {
    set $lodb_maintenance 0;
}
if ($lodb_maintenance) {
    return 503;
}

# Inherited by every location that declares no error_page of its own. Only nginx's own 503 is
# replaced: the SSR server's and the API's (shedding, with their Retry-After) pass as they are,
# no location intercepting their errors but the former site's, which declares its own.
error_page 503 @lodb_maintenance;

# A 503 the crawlers come back to: Retry-After in seconds, about a deploy's duration. Never
# stored: the next request after the deploy gets the page itself.
location @lodb_maintenance {
    root        /usr/share/nginx/maintenance;
    rewrite     ^ /index.html break;
    default_type text/html;
    charset     utf-8;
    add_header  Retry-After   "120" always;
    add_header  Cache-Control "no-store" always;
    # Its scripts, styles and faces come from /maintenance/ alone; nothing inline runs.
    add_header  Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; require-trusted-types-for 'script'" always;
    include     /etc/nginx/snippets/security-headers.conf;
}

# The deploy's state, which the page polls: its start and the duration the host expects
# (tools/deploy/maintenance.sh), then a 404 once the deploy is over, which reloads the page.
location = /maintenance/status.json {
    alias        /srv/maintenance/active.json;
    default_type application/json;
    add_header   Cache-Control "no-store" always;
    include      /etc/nginx/snippets/security-headers.conf;
}

# The page's files, from the image: they never change within a build, and a build that changes
# them comes with a new nginx. Revalidated rather than kept, as they are only asked for during a
# deploy. `^~` keeps the guards' regex locations away: none of them names such a file. The page
# itself (index.html) is out of this folder: it is only ever an answer to a page's address. As
# for the bundles, a file opened directly runs nothing.
location ^~ /maintenance/ {
    alias      /usr/share/nginx/maintenance/assets/;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    include    /etc/nginx/snippets/security-headers.conf;
}
