# The former site's URLs (L3.12): one 301 to their new form, resolved by the API, which
# turns an old {name} into a canonical path and knows the latest version
# (docs/reecriture/plan-migration.md, table of the legacy 301).
#
# Matched on the first segment an old route owned: the resource segments, a numeric version,
# the editorial, community and account pages. The new URLs never start with one of them
# (a locale, /b/, /api/, /v1/, /webhooks/, /cdn/, /admin, the front's own files), so no
# target comes back here: one hop. /sitemap.xml and /sitemaps/ are seo.conf's (L3.4).
#
# The raw $request_uri is passed, never the decoded $uri: an encoded "?" in a path must not
# become a query on the way. The API answers a real 404 for whatever the old site did not
# serve; the SSR server then renders its 404 page for the same URI.
location ~ ^/(?:home|champions?|objects?|runes?|summoners?|about|faq|changelog|developers|donate|legal|trends|u|login|register|profile|reset-password|builds|[0-9]+(?:\.[0-9]+)+)(?:/|$) {
    proxy_pass             http://lodb_api/api/legacy$request_uri;
    include                /etc/nginx/snippets/proxy-headers.conf;
    proxy_intercept_errors on;
    error_page             404 = @lodb_legacy_unknown;
}

location @lodb_legacy_unknown {
    proxy_pass http://lodb_web_ssr;
    include    /etc/nginx/snippets/proxy-headers.conf;
}
