# Crawler-facing files, built by the API from the catalog (L3.4). Without these locations
# they would fall through to "location /" and reach the SSR, which knows none of them.
# The API sets their caching: an hour for the files, a minute for the redirects of the
# previous site's forms. nginx keeps them for that long (snippets/seo-cache.conf).

location = /sitemap.xml {
    proxy_pass http://lodb_api;
    include    /etc/nginx/snippets/proxy-headers.conf;
    include    /etc/nginx/snippets/seo-cache.conf;
}

# Every locale's sitemaps and the previous site's /sitemaps/{latest,version}.xml. One file
# per version and locale: a client sweeping them all is held to its own rate.
location /sitemaps/ {
    limit_req  zone=lodb_rate_sitemaps burst=${LODB_SITEMAPS_BURST} nodelay;
    proxy_pass http://lodb_api;
    include    /etc/nginx/snippets/proxy-headers.conf;
    include    /etc/nginx/snippets/seo-cache.conf;
}

location = /robots.txt {
    proxy_pass http://lodb_api;
    include    /etc/nginx/snippets/proxy-headers.conf;
    include    /etc/nginx/snippets/seo-cache.conf;
}

location = /llms.txt {
    proxy_pass http://lodb_api;
    include    /etc/nginx/snippets/proxy-headers.conf;
    include    /etc/nginx/snippets/seo-cache.conf;
}

# The IndexNow key file, /{key}.txt (LoDb:Seo:IndexNowKey): the API answers the configured key
# and a 404 for any other name. The names robots.txt and llms.txt never get here: an exact
# location wins over a regex.
location ~ "^/[A-Za-z0-9-]{8,128}\.txt$" {
    proxy_pass http://lodb_api;
    include    /etc/nginx/snippets/proxy-headers.conf;
    include    /etc/nginx/snippets/seo-cache.conf;
}
