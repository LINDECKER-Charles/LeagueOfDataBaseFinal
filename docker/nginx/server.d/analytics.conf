# Internal target of the page-view mirror (snippets/analytics-mirror.conf, L7.1). A client
# cannot request it (internal): only the mirror's subrequests reach it, with the page's
# method, URI and headers. It forwards each view to the API's /internal/analytics/page,
# which no public location routes to, then enqueues it and answers at once.
#
# Filtered here, before any upstream call: a method other than GET, and anything that
# cannot be a counted page (a file, a pinned version, a path deeper than a detail). The API
# decides the rest from the catalog. Cookies and credentials never travel: a view needs the
# client's address, user agent and referrer only, which the page request already carries.
#
# The mirror holds the client's connection until its subrequest ends: one second at most.
location = /_analytics/page {
    internal;

    if ($request_method != GET) {
        return 204;
    }

    # /{locale}[/{resource}[/{entry}]][/][?query]: no dot in the path, three segments at most.
    if ($request_uri !~ "^/[a-z]{2}(?:-[a-z]+)?(?:/[^./?]+){0,2}/?(?:\?.*)?$") {
        return 204;
    }

    proxy_pass              http://lodb_api/internal/analytics/page;
    include                 /etc/nginx/snippets/proxy-headers.conf;
    proxy_method            POST;
    proxy_pass_request_body off;
    proxy_set_header        Content-Length "";
    proxy_set_header        Cookie         "";
    proxy_set_header        Authorization  "";
    proxy_set_header        X-Original-URI $request_uri;

    proxy_connect_timeout   1s;
    proxy_send_timeout      1s;
    proxy_read_timeout      1s;
}
