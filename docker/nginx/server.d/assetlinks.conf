# Digital Asset Links of the Android app (L10.1, ADR 0007): Android fetches this file before
# it lets the app open the OAuth return link (ADR 0009). It names the app's signing
# certificate, a parameter of the served environment rather than of the image:
#
#   node tools/android/assetlinks.mjs --fingerprint <SHA-256> --out assetlinks.json
#
# and the environment mounts the result read-only at /etc/nginx/android/assetlinks.json.
# Without it the URL answers 404: App Links stay unverified, password sign-in still works.
# Android wants a 200 in JSON, without redirect, from the host of the app's intent filter.
location = /.well-known/assetlinks.json {
    root       /etc/nginx/android;
    try_files  /assetlinks.json =404;
    # Not `always`: a 404 is not kept an hour by the caches once the file is mounted.
    add_header Cache-Control "public, max-age=3600";
    include    /etc/nginx/snippets/security-headers.conf;
}
