# No `user` directive: the image starts nginx as its unprivileged `nginx` user
# (docker/nginx/Dockerfile), which the master process stays.
worker_processes  auto;

# The image links this path to stderr, the only error stream the host's collector reads.
error_log  /var/log/nginx/error.log warn;
# The root filesystem is read-only on the stack (compose.yaml): /tmp, a tmpfs, is writable.
pid        /tmp/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # A full User-Agent ($lodb_blocked_agent) outgrows the default bucket of the maps' hash
    # (64 bytes). Set before any map: nginx fixes the size when it meets the first one.
    map_hash_bucket_size  128;

    # No per-request access log: the shared edge journals every request centrally, with
    # the real client address (docs/guides/observabilite.md). `off`, not a deleted line:
    # nginx's compiled-in default would keep logging in the combined format.
    access_log  off;

    # Request bodies and answers too large for the memory buffers: what a slow client has not
    # read yet waits there. On a volume (compose.yaml), not in the bounded tmpfs of /tmp: a
    # few slow readers of large answers would fill it, and every answer or body that outgrows
    # the buffers would then fail. nginx unlinks each of these files as it opens it: none
    # outlives its request, a crash included. It makes the FastCGI, uWSGI and SCGI folders at
    # start although nothing here uses them.
    client_body_temp_path  /var/cache/nginx/temp/client;
    proxy_temp_path        /var/cache/nginx/temp/proxy;
    fastcgi_temp_path      /tmp/fastcgi_temp;
    uwsgi_temp_path        /tmp/uwsgi_temp;
    scgi_temp_path         /tmp/scgi_temp;

    # A redirect nginx writes itself (`/api` to `/api/`, a `return` to a path) keeps a relative
    # Location: an absolute one would carry nginx's own scheme and port (http, 8080), not the
    # visitor's.
    absolute_redirect  off;

    sendfile           on;
    tcp_nopush         on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    # The SSR server sends its bundles as text/javascript: both script types are listed.
    gzip_types        text/plain text/css application/json application/problem+json
                      application/javascript text/javascript application/manifest+json
                      text/xml application/xml image/svg+xml;

    # Docker's embedded DNS. Re-resolving the upstreams lets nginx follow an api or
    # web-ssr container recreated by a deploy, instead of keeping its old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Project aliases (compose.yaml), never the service names: on a host nginx also sits on
    # the shared `edge` network, where `api` resolves to other projects' containers as well,
    # and `resolve` would spread the requests over all of them.
    upstream lodb_api {
        zone lodb_api 64k;
        server lodb-api:8080 resolve;
        keepalive 16;
    }

    upstream lodb_web_ssr {
        zone lodb_web_ssr 64k;
        server lodb-web-ssr:4000 resolve;
        keepalive 16;
    }

    # The edge terminates TLS and says so in X-Forwarded-Proto; without an edge (local
    # stack) the scheme is nginx's own. Only the edge reaches nginx on a served host.
    map $http_x_forwarded_proto $lodb_forwarded_proto {
        default  $scheme;
        https    https;
    }

    # Clients refused outright (snippets/server-guards.conf), by their exact User-Agent.
    # 2026-10-10: a crawler from ~240 cloud addresses swept every patch in every language at
    # ~25 requests a second and never backed off on 503. No visitor runs this exact build of
    # Chrome on Linux ARM; an exact string, never a pattern, so nothing else is caught.
    map $http_user_agent $lodb_blocked_agent {
        default  0;
        "Mozilla/5.0 (X11; Linux aarch64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/139.0.0.0 Safari/537.36"  1;
    }

    # Parent id of the W3C trace each proxied request starts (snippets/proxy-headers.conf):
    # the first half of the request's id, 16 random bytes in hex, so never all zeros.
    map $request_id $lodb_trace_parent_id {
        "~^(?<lodb_trace_head>[0-9a-f]{16})"  $lodb_trace_head;
    }

    # The blobs are public, immutable images that the Android shell (another origin) must
    # be able to embed; everything else stays readable by the site's own pages only.
    map $uri $lodb_resource_policy {
        default          same-origin;
        ~^/cdn/blobs/    cross-origin;
    }

    # Rendered at start from the templates (Dockerfile). site.conf also sets the request
    # bounds and the cache zones, tunable there.
    include /etc/nginx/sites/*.conf;
}
