# Local overlay of compose.yaml, never used on a served host.
#
# Host ports come from the LODB_*_PORT variables (plan, §6.3). The defaults are the
# integration stack's; a slot sets its own, for instance slot 1:
#   LODB_HTTP_PORT=18180 LODB_API_PORT=18181 LODB_SSR_PORT=18182 \
#   LODB_PG_PORT=15532 LODB_MAIL_PORT=18125 \
#   docker compose -p lodb-dev-e1 -f compose.yaml -f compose.override.yaml up -d --build
# The metrics port (9464) is never published: read it from the stack's network.

services:
  api:
    ports:
      - "${LODB_API_PORT:-18081}:8080"
    environment:
      # Serves the OpenAPI documents (MapOpenApi is Development-only).
      ASPNETCORE_ENVIRONMENT: Development
      # The e-mail outbox (L4.3) sends to the stack's mailpit; an empty host turns it off.
      LoDb__Mail__Host: mailpit
      LoDb__Mail__Port: "1025"
      LoDb__Mail__Security: None
      # The E2E workers open older patches and languages, all from one address, far
      # faster than a served host admits their cold catalogs, ingestions and warm-ups
      # (pieges.md, Tests E2E).
      LoDb__Catalog__ColdLoadConcurrency: "16"
      LoDb__Catalog__ColdLoadsPerSecond: "1000"
      LoDb__Catalog__PublicColdLoadsPerSecond: "500"
      LoDb__Catalog__ColdLoadBurst: "1000"
      LoDb__Catalog__WarmUp__MaxStreams: "64"
      LoDb__Catalog__WarmUp__MaxStreamsPerClient: "64"
      LoDb__Catalog__WarmUp__PerClientPerHour: "100000"
      LoDb__Ingestion__ColdDatasetsPerMinute: "6000"
      LoDb__Ingestion__ColdImagesPerMinute: "1000000"
      LoDb__Ingestion__MaxWaitingIngestions: "1024"
      LoDb__Ingestion__SlotWait: "00:00:20"
      # The E2E suite signs every account in through the API from one address, far more
      # often than a served host allows one client (docs/architecture/pieges.md).
      LoDb__RateLimiting__SignInPerWindow: "1000"
      # The E2E accounts vote the minute they exist: a served host makes an account wait a
      # day before it votes (docs/architecture/pieges.md, Tests E2E).
      LoDb__Builds__Votes__MinimumAccountAge: "00:00:00"
      # The pre-rendering pass writes to the stack's simulated store (pages-store below),
      # over plain HTTP, with its fixed key. No pass starts by itself: an E2E run promotes
      # versions, and each would render a whole catalogue.
      LoDb__Prerender__Endpoint: http://lodb-pages-store:5000
      LoDb__Prerender__AllowInsecureEndpoint: "true"
      LoDb__Prerender__Region: fr-par
      LoDb__Prerender__Bucket: lodb-pages-dev
      LoDb__Prerender__AccessKey: lodb-dev
      LoDb__Prerender__SecretKey: lodb-dev
      LoDb__Prerender__PublicHost: localhost
      LoDb__Prerender__AutoEnqueueOnPromotion: "false"
      # A wide adaptive range, to watch the regulator climb in a few minutes: its signals are
      # the Docker VM's, not a host's. The step is the floor.
      LoDb__Prerender__Pace__MinRendersPerMinute: "120"
      LoDb__Prerender__Pace__MaxRendersPerMinute: "1200"
      LoDb__Prerender__Pace__StepRendersPerMinute: "120"

  web-ssr:
    ports:
      - "${LODB_SSR_PORT:-18082}:4000"
    # The E2E workers open older patches far faster than a served host admits them, all from
    # one address, and their first visit to a patch waits for its ingestion
    # (docs/architecture/pieges.md, Tests E2E).
    environment:
      LODB_RENDER_MAX_IN_FLIGHT: "32"
      LODB_PINNED_RENDER_MAX_IN_FLIGHT: "16"
      LODB_PINNED_RENDERS_PER_MINUTE: "6000"
      LODB_PINNED_RENDER_BURST: "1000"
      LODB_CURRENT_RENDERS_PER_MINUTE: "6000"
      LODB_CURRENT_RENDER_BURST: "1000"
      LODB_RENDER_PER_CLIENT_MAX_IN_FLIGHT: "32"
      LODB_PINNED_RENDERS_PER_CLIENT_PER_MINUTE: "6000"
      LODB_CURRENT_RENDERS_PER_CLIENT_PER_MINUTE: "6000"
      LODB_CURRENT_RENDER_PER_CLIENT_BURST: "1000"
      LODB_RENDER_DEADLINE_SECONDS: "30"
      LODB_RENDER_API_TIMEOUT_SECONDS: "30"
      # The pass's lane, as lifted as the others: its in-flight cap stays under the total.
      LODB_PRERENDER_RENDERS_PER_MINUTE: "6000"
      LODB_PRERENDER_RENDER_BURST: "1000"
      LODB_PRERENDER_MAX_IN_FLIGHT: "8"
      LODB_PRERENDER_VISITOR_RESERVE: "4"

  # The pass's renderer, without quota or weight locally. Its lane is lifted to the top of
  # the regulator's range above; no host port, neither 4000 nor 9464: the API reaches it on
  # the stack's network.
  web-ssr-prerender:
    environment:
      LODB_PRERENDER_RENDERS_PER_MINUTE: "1200"

  nginx:
    ports:
      - "${LODB_HTTP_PORT:-18080}:8080"
    # The E2E workers all come from one address (the Docker gateway) and open pages, API
    # reads, old URLs and sitemaps far faster than one visitor: the rates per address are
    # lifted here only. To get a default back, drop the key (`!reset null`): an empty value
    # makes nginx refuse its configuration.
    environment:
      LODB_PAGES_RATE: 1000r/s
      LODB_PAGES_BURST: "10000"
      LODB_API_READS_RATE: 1000r/s
      LODB_API_READS_BURST: "10000"
      LODB_LEGACY_RATE: 1000r/s
      LODB_LEGACY_BURST: "10000"
      LODB_SITEMAPS_RATE: 1000r/s
      LODB_SITEMAPS_BURST: "10000"
      # nginx reads the past patches' pages from the simulated store, as a served host does
      # from Scaleway's.
      LODB_PAGES_STORE_ENABLED: "1"
      LODB_PAGES_STORE_SCHEME: http
      LODB_PAGES_STORE_HOST: lodb-pages-store
      LODB_PAGES_STORE_PORT: "5000"
      LODB_PAGES_STORE_BUCKET: lodb-pages-dev

  postgres:
    ports:
      - "${LODB_PG_PORT:-15432}:5432"

  # SMTP sink for the account emails (lot 4). Only the web interface is published: the
  # SMTP port stays on the stack's network, where the API reaches mailpit:1025.
  mailpit:
    image: axllent/mailpit:v1.32.0
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${LODB_MAIL_PORT:-18025}:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The object store of the pre-rendered pages (ADR 0011), simulated by moto: S3's API, in
  # memory, without checking signatures. MinIO's images no longer pull, and ADR 0004 keeps it
  # out of production anyway; what Scaleway itself does is proven by
  # tools/prerender/scaleway-bucket.sh verifier. At each start it creates the bucket and lets
  # anyone read pages/ and build/ (moto reads AWS's policy format, and HEAD as its own
  # action), as the bucket policy lets the host read on Scaleway; a restart empties it.
  pages-store:
    image: motoserver/moto:5.2.3@sha256:91fd602a21f49cf9eb82fdf474015a3c131d40104c8297ea6a2ca920708ae32c
    init: true
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    tmpfs:
      - /tmp:size=16m
    entrypoint: [python, -c]
    command:
      - |
        import json, pathlib, threading
        import boto3
        from moto.server import ThreadedMotoServer
        server = ThreadedMotoServer(ip_address="0.0.0.0", port=5000)
        server.start()
        bucket = "lodb-pages-dev"
        store = boto3.client("s3", endpoint_url="http://127.0.0.1:5000", region_name="fr-par",
                             aws_access_key_id="lodb-dev", aws_secret_access_key="lodb-dev")
        store.create_bucket(Bucket=bucket,
                            CreateBucketConfiguration={"LocationConstraint": "fr-par"})
        store.put_bucket_policy(Bucket=bucket, Policy=json.dumps({
            "Version": "2012-10-17",
            "Statement": [{"Effect": "Allow", "Principal": "*",
                           "Action": ["s3:GetObject", "s3:HeadObject"],
                           "Resource": [f"arn:aws:s3:::{bucket}/pages/*",
                                        f"arn:aws:s3:::{bucket}/build/*"]}]}))
        pathlib.Path("/tmp/ready").touch()
        threading.Event().wait()
    networks:
      default:
        # The name the API and nginx call, unique on a shared network (see compose.yaml).
        aliases: [lodb-pages-store]
    # No host port: the API and nginx reach it on the stack network, and a slot stack
    # would otherwise collide with the integration stack's port.
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      # Ready once the bucket and its policy are in place, not when the port first answers.
      test: ["CMD", "test", "-f", "/tmp/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
