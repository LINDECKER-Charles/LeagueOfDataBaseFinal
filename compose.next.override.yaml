# Local overlay of compose.next.yaml, never used on a served host.
#
# Host ports come from the LODB_NEXT_*_PORT variables (plan, §6.3). The defaults are the
# integration stack's; a slot sets its own, for instance slot 1:
#   LODB_NEXT_HTTP_PORT=18180 LODB_NEXT_API_PORT=18181 LODB_NEXT_SSR_PORT=18182 \
#   LODB_NEXT_PG_PORT=15532 LODB_NEXT_MAIL_PORT=18125 \
#   docker compose -p lodb-next-e1 -f compose.next.yaml -f compose.next.override.yaml up -d --build
# The metrics port (9464) is never published: read it from the stack's network.

services:
  api:
    ports:
      - "${LODB_NEXT_API_PORT:-18081}:8080"
    environment:
      # Serves the OpenAPI documents (MapOpenApi is Development-only).
      ASPNETCORE_ENVIRONMENT: Development
      # The e-mail outbox (L4.3) sends to the stack's mailpit; an empty host turns it off.
      LoDb__Mail__Host: mailpit
      LoDb__Mail__Port: "1025"
      LoDb__Mail__Security: None

  web-ssr:
    ports:
      - "${LODB_NEXT_SSR_PORT:-18082}:4000"

  nginx:
    ports:
      - "${LODB_NEXT_HTTP_PORT:-18080}:80"

  postgres:
    ports:
      - "${LODB_NEXT_PG_PORT:-15432}:5432"

  # SMTP sink for the account emails (lot 4). Only the web interface is published: the
  # SMTP port stays on the stack's network, where the API reaches mailpit:1025.
  mailpit:
    image: axllent/mailpit:v1.31.2
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "${LODB_NEXT_MAIL_PORT:-18025}:8025"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
