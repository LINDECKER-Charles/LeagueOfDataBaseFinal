<nav class="bottom-nav" [attr.aria-label]="'footer.navigation.title' | transloco">
  @for (link of links(); track link.entry.path) {
    <a
      [routerLink]="link.target"
      routerLinkActive
      [routerLinkActiveOptions]="{ exact: link.entry.path === '' }"
      ariaCurrentWhenActive="page"
    >
      @if (link.entry.icon) {
        <lodb-icon [name]="link.entry.icon" />
      }
      <span>{{ link.entry.label | transloco }}</span>
    </a>
  }
</nav>
