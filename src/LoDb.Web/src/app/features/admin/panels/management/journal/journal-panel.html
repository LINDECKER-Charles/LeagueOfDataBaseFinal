<lodb-page-head
  [eyebrow]="'admin.nav.management' | adminText"
  [title]="'admin.journal.title' | adminText"
  [subtitle]="'admin.journal.lede' | adminText"
/>

<lodb-panel-state [panel]="volume" shape="card" />
@if (volume.value(); as held) {
  <div class="grid grid-cols-2 gap-3 lg:grid-cols-4">
    <lodb-kpi
      [label]="'admin.journal.volume.entries' | adminText"
      [value]="held.entries | figure"
      [sub]="held.totalBytes | figure: 'bytes'"
    />
    <lodb-kpi
      tone="hex"
      [label]="'admin.journal.volume.oldest' | adminText"
      [value]="held.oldest | stamp"
    />
    <lodb-kpi
      tone="hex"
      [label]="'admin.journal.volume.newest' | adminText"
      [value]="held.newest | stamp: 'minute'"
    />
    <lodb-kpi
      tone="muted"
      [label]="'admin.journal.volume.retention' | adminText: { months: held.retentionMonths }"
      [value]="held.retentionCutoff | stamp"
      [sub]="'admin.journal.volume.cutoff' | adminText"
    />
  </div>
}

<lodb-admin-card class="mt-6" [heading]="'admin.journal.filters.title' | adminText">
  @if (vocabulary.failure()) {
    <lodb-panel-state [panel]="vocabulary" shape="card" />
  }
  <lodb-journal-filters [vocabulary]="vocabulary.value()" />
</lodb-admin-card>

<div class="mt-6">
  <lodb-panel-state [panel]="journal" shape="table" />
  @if (journal.value(); as page) {
    <lodb-audit-table [entries]="page.items" [attr.aria-busy]="journal.busy()" />
    <lodb-admin-pager [page]="page.page" [hasMore]="page.hasMore" />
  }
</div>

<lodb-admin-card class="mt-8" [heading]="'admin.journal.purge.title' | adminText">
  <lodb-journal-purge (purged)="reload()" />
</lodb-admin-card>
