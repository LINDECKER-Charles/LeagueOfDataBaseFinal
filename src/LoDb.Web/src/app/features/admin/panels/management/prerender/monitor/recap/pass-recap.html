<lodb-admin-card [heading]="title()" [attr.data-recap]="pass().state">
  <button
    lodbCardHead
    lodbButton="ghost"
    lodbButtonSize="small"
    type="button"
    data-recap-dismiss
    (click)="dismiss()"
  >
    {{ 'admin.prerender.live.recap.dismiss' | adminText }}
  </button>

  <p class="readout-text mb-3" data-recap-summary>{{ summary() }}</p>
  <lodb-stacked-bar size="hero" [segments]="segments()" [label]="summary()" />

  <div class="mt-5 flex flex-wrap items-center gap-3">
    @if (relaunch(); as relaunch) {
      <button
        lodbButton="primary"
        lodbButtonSize="small"
        type="button"
        data-relaunch
        (click)="launch.emit(relaunch.preset)"
      >
        {{ relaunchLabel() }}
      </button>
    }
    @if (!isCompleted()) {
      <button
        [lodbButton]="relaunch() ? 'ghost' : 'primary'"
        lodbButtonSize="small"
        type="button"
        data-complete
        (click)="complete()"
      >
        {{ 'admin.prerender.live.recap.complete' | adminText: { epoch: pass().epoch } }}
      </button>
    }
    <button
      lodbButton="ghost"
      lodbButtonSize="small"
      type="button"
      (click)="detail.emit(pass().id)"
    >
      {{ 'admin.prerender.live.recap.detail' | adminText }}
    </button>
  </div>
</lodb-admin-card>
