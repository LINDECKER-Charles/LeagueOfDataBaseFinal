<lodb-page-head
  [eyebrow]="'admin.nav.analytics' | adminText"
  [title]="'admin.traffic.title' | adminText"
  [subtitle]="'admin.traffic.lede' | adminText"
>
  <lodb-range-bar [current]="query.range()" />
  <button lodbButton="gold" type="button" [disabled]="rollingUp()" (click)="rollUp()">
    {{ 'admin.traffic.roll_up' | adminText }}
  </button>
</lodb-page-head>

<lodb-panel-state [panel]="report" shape="chart" />
@if (report.value(); as data) {
  <div class="grid grid-cols-2 gap-3 lg:grid-cols-4" [attr.aria-busy]="report.busy()">
    <lodb-kpi
      [label]="'admin.traffic.kpi.views' | adminText"
      [value]="data.totals.views | figure"
      [sub]="'admin.traffic.kpi.pages' | adminText: { count: data.totals.pagesTracked }"
    />
    <lodb-kpi
      tone="hex"
      [label]="'admin.traffic.kpi.visitors' | adminText"
      [value]="data.totals.uniqueVisitors | figure"
    />
    <lodb-kpi
      tone="muted"
      [label]="'admin.traffic.kpi.returning' | adminText"
      [value]="data.totals.returningVisitors | figure"
    />
    <lodb-kpi
      tone="warn"
      [label]="'admin.traffic.kpi.bots' | adminText"
      [value]="data.totals.botViews | figure"
    />
  </div>

  <lodb-admin-card
    class="mt-6"
    [heading]="'admin.traffic.daily' | adminText"
    [chip]="'admin.traffic.period' | adminText: { from: data.from, to: data.to }"
  >
    <lodb-time-series-chart
      [dates]="traffic().dates"
      [series]="traffic().series"
      [label]="'admin.traffic.daily' | adminText"
    />
    <lodb-legend [items]="traffic().legend" />
  </lodb-admin-card>

  <lodb-admin-card class="mt-6" [heading]="'admin.traffic.heatmap' | adminText">
    <lodb-heatmap [grid]="data.heatmap" />
  </lodb-admin-card>

  <div class="mt-6 grid gap-6 lg:grid-cols-2">
    <lodb-admin-card [heading]="'admin.traffic.top_pages' | adminText">
      <lodb-rank-list [rows]="pages()" [limit]="limit" />
    </lodb-admin-card>
    <lodb-admin-card [heading]="'admin.traffic.top_entities' | adminText">
      <lodb-rank-list tone="hex" [rows]="entities()" [limit]="limit" />
    </lodb-admin-card>
    <lodb-admin-card [heading]="'admin.traffic.by_type' | adminText">
      <lodb-donut-chart
        [slices]="types()"
        [label]="'admin.traffic.by_type' | adminText"
        [total]="data.totals.views | figure: 'compact'"
        [caption]="'admin.traffic.views_caption' | adminText"
      />
      <lodb-rank-list class="mt-4" [rows]="kinds()" />
    </lodb-admin-card>
    <lodb-admin-card [heading]="'admin.traffic.statuses' | adminText">
      <lodb-rank-list tone="hex" [rows]="statuses()" />
      <h3 class="mt-6 mb-3 eyebrow">{{ 'admin.traffic.routes' | adminText }}</h3>
      <lodb-rank-list [rows]="routes()" [limit]="limit" />
    </lodb-admin-card>
  </div>
}
