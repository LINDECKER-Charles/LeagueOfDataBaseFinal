<lodb-page-head
  [eyebrow]="'admin.eyebrows.analytics' | adminText"
  [title]="'admin.traffic.title' | adminText"
  [subtitle]="'admin.traffic.lede' | adminText"
>
  <lodb-segment-bar
    param="range"
    label="admin.range.label"
    [segments]="ranges"
    [current]="query.range()"
  />
</lodb-page-head>

<lodb-panel-state [panel]="report" shape="chart" />
@if (report.value(); as data) {
  <div class="kpi-grid mb-6" [attr.aria-busy]="report.busy()">
    <lodb-kpi
      [label]="'admin.traffic.kpi.views' | adminText"
      [value]="data.totals.views | figure: 'compact'"
      [sub]="
        'admin.traffic.trend.' + viewsTrend().direction
          | adminText: { change: (viewsTrend().change | figure: 'share') }
      "
    >
      <lodb-sparkline [values]="chart().series[0]?.values ?? []" color="var(--color-gold)" />
    </lodb-kpi>
    <lodb-kpi
      accent="hex"
      [label]="'admin.traffic.kpi.visitors' | adminText"
      [value]="data.totals.uniqueVisitors | figure: 'compact'"
      [sub]="
        'admin.traffic.trend.' + visitorsTrend().direction
          | adminText: { change: (visitorsTrend().change | figure: 'share') }
      "
    >
      <lodb-sparkline [values]="chart().series[1]?.values ?? []" />
    </lodb-kpi>
    <lodb-kpi
      accent="green"
      [label]="'admin.traffic.kpi.per_day' | adminText"
      [value]="perDay() | figure"
      [sub]="'admin.traffic.kpi.visitors_sub' | adminText: { count: data.totals.returningVisitors }"
    />
    <lodb-kpi
      accent="blue"
      [label]="'admin.traffic.kpi.pages' | adminText"
      [value]="data.totals.pagesTracked | figure: 'compact'"
      [sub]="'admin.traffic.kpi.pages_sub' | adminText"
    />
    @if (robots.value(); as journal) {
      <a
        lodbKpi
        accent="red"
        routerLink="/admin/robots"
        [queryParams]="{ range: query.range() }"
        [isLink]="true"
        [label]="'admin.traffic.kpi.robots' | adminText"
        [value]="journal.totals.figures.hits | figure: 'compact'"
        [sub]="
          'admin.traffic.kpi.robots_sub' | adminText: { share: (robotShare() | figure: 'share') }
        "
      >
        <lodb-sparkline [values]="robotDays()" color="var(--color-series-red)" />
      </a>
    }
  </div>

  <lodb-admin-card
    [heading]="'admin.traffic.daily' | adminText"
    [chip]="'admin.traffic.daily_chip' | adminText"
  >
    <lodb-time-series-chart
      [dates]="chart().dates"
      [series]="chart().series"
      [label]="'admin.traffic.daily' | adminText"
    />
    <lodb-legend [items]="chart().legend" />
  </lodb-admin-card>

  <lodb-admin-card
    class="mt-[1.15rem] block"
    [heading]="'admin.traffic.explorer.title' | adminText"
    [chip]="'admin.traffic.explorer.chip' | adminText"
  >
    <lodb-traffic-explorer [range]="query.range()" />
  </lodb-admin-card>

  <lodb-admin-rule [label]="'admin.traffic.rules.content' | adminText" />
  <div class="admin-grid admin-grid--3">
    <lodb-admin-card [heading]="'admin.traffic.top_entities' | adminText">
      <lodb-rank-list
        tone="hex"
        [rows]="entities()"
        [limit]="8"
        empty="admin.traffic.top_entities_empty"
      />
    </lodb-admin-card>
    <lodb-admin-card [heading]="'admin.overview.by_resource' | adminText">
      <lodb-rank-list [rows]="types()" [limit]="6" />
    </lodb-admin-card>
    <lodb-admin-card [heading]="'admin.traffic.by_kind' | adminText">
      <lodb-rank-list tone="hex" [rows]="kinds()" [limit]="6" />
    </lodb-admin-card>
  </div>

  <lodb-admin-rule [label]="'admin.traffic.rules.quality' | adminText" />
  <div class="admin-grid admin-grid--3">
    <lodb-admin-card [heading]="'admin.traffic.locales' | adminText">
      <lodb-rank-list [rows]="locales()" [limit]="8" />
    </lodb-admin-card>
    <lodb-admin-card [heading]="'admin.traffic.langs' | adminText">
      <lodb-rank-list tone="hex" [rows]="langs()" [limit]="8" />
    </lodb-admin-card>
    <lodb-admin-card [heading]="'admin.traffic.statuses' | adminText">
      <lodb-status-table [statuses]="data.status" />
    </lodb-admin-card>
  </div>

  <lodb-admin-card
    class="mt-[1.15rem] block"
    [heading]="'admin.traffic.heatmap' | adminText"
    [chip]="'admin.traffic.heatmap_chip' | adminText"
  >
    <lodb-heatmap [grid]="data.heatmap" />
  </lodb-admin-card>
}
