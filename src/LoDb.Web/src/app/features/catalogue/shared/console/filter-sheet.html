<div class="sheet__handle" aria-hidden="true"></div>
<div class="sheet__head">
  <span class="marker" aria-hidden="true"></span>
  <h2 class="title" [id]="headingId">{{ 'filter.filters' | transloco }}</h2>
  @if (filter.activeCount() > 0) {
    <b class="badge">{{ filter.activeCount() }}</b>
  }
  <span class="gauge">{{ filter.view().matching }} / {{ filter.view().total }}</span>
</div>
<div class="sheet__body">
  <lodb-facet-panel surface="sheet" />
</div>
<div class="sheet__foot">
  <button
    type="button"
    class="sheet__clear"
    [disabled]="!filter.isEngaged()"
    (click)="filter.clearAll()"
  >
    {{ 'filter.clear' | transloco }}
  </button>
  <button type="button" lodbButton="gold" class="sheet__done" (click)="close()">
    {{ 'filter.show_results' | transloco: { count: filter.view().matching } }}
  </button>
</div>
