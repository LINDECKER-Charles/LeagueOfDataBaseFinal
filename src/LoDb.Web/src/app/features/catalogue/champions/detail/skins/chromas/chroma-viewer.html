<lodb-dialog
  [heading]="data.skinName"
  [headingId]="headingId"
  [closeLabel]="'champions.viewer.close' | transloco"
>
  @if (chroma(); as shown) {
    <p
      class="mb-3 truncate font-beaufort tracking-wide text-gold-bright uppercase"
      aria-live="polite"
    >
      {{ shown.label }}
    </p>
    <div class="relative grid place-items-center bg-void/60 p-6">
      @for (current of [shown]; track current.id) {
        <img
          class="hx-img art size-64 max-w-full object-contain"
          [src]="current.swatch"
          [alt]="current.label"
        />
      }
      @if (count > 1) {
        <lodb-viewer-arrows (step)="step($event)" />
      }
    </div>
    <div class="mt-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-1.5">
        @for (color of shown.colors; track $index) {
          <span
            class="size-4 rounded-sm border border-gold-deep/50"
            [style.background]="color"
            [title]="color"
          ></span>
        }
      </div>
      @if (count > 1) {
        <span class="font-mono text-xs text-text-dim">
          {{ 'champions.viewer.counter' | transloco: { index: index() + 1, count } }}
        </span>
      }
    </div>
  }
</lodb-dialog>
