<lodb-dialog
  [heading]="data.championName"
  [headingId]="headingId"
  [closeLabel]="'champions.viewer.close' | transloco"
>
  @if (skin(); as shown) {
    <figure>
      <div class="relative">
        @for (current of [shown]; track current.id) {
          <img
            class="hx-img splash mx-auto max-h-[70vh] w-full object-contain"
            [src]="current.art.splash"
            [alt]="current.name"
          />
        }
        @if (count > 1) {
          <lodb-viewer-arrows (step)="step($event)" />
        }
      </div>
      <figcaption class="mt-3 flex items-center justify-between gap-4">
        <p
          class="truncate font-beaufort tracking-wide text-gold-bright uppercase"
          aria-live="polite"
        >
          {{ shown.name }}
        </p>
        @if (count > 1) {
          <span class="shrink-0 font-mono text-xs text-text-dim">
            {{ 'champions.viewer.counter' | transloco: { index: index() + 1, count } }}
          </span>
        }
      </figcaption>
    </figure>
  }
</lodb-dialog>
