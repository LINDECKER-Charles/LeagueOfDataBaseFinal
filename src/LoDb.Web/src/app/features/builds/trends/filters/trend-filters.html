@let applied = filters();
<form class="trend-filters" method="get" [attr.action]="action()" (submit)="apply($event)">
  @for (param of context(); track param.name) {
    <input type="hidden" [name]="param.name" [value]="param.value" />
  }
  <label class="trend-filters__field">
    <span class="trend-filters__label">{{ 'community.trends.filter.champion' | transloco }}</span>
    <select lodbField name="champion">
      <option value="">{{ 'community.trends.filter.all_champions' | transloco }}</option>
      @for (option of champions(); track option.id) {
        <option
          [value]="option.id"
          [selected]="applied.champion === option.id"
          [attr.selected]="applied.champion === option.id ? '' : null"
        >
          {{ option.name }}
        </option>
      }
    </select>
  </label>
  <label class="trend-filters__field">
    <span class="trend-filters__label">{{ 'community.trends.filter.mode' | transloco }}</span>
    <select lodbField name="mode">
      <option value="">{{ 'community.trends.filter.all_modes' | transloco }}</option>
      @for (option of modeOptions(); track option.mode) {
        <option
          [value]="option.mode"
          [selected]="applied.mode === option.mode"
          [attr.selected]="applied.mode === option.mode ? '' : null"
        >
          {{ option.key | transloco }}
        </option>
      }
    </select>
  </label>
  <label class="trend-filters__field">
    <span class="trend-filters__label">{{ 'community.trends.filter.language' | transloco }}</span>
    <select lodbField name="language">
      <option value="">{{ 'community.trends.filter.all_languages' | transloco }}</option>
      @for (option of languageOptions(); track option.code) {
        <option
          [value]="option.code"
          [selected]="applied.language === option.code"
          [attr.selected]="applied.language === option.code ? '' : null"
        >
          {{ option.label }}
        </option>
      }
    </select>
  </label>
  <button type="submit" lodbButton="gold" class="trend-filters__submit">
    {{ 'community.trends.filter.apply' | transloco }}
  </button>
</form>
