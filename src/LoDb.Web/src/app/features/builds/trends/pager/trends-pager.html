@if (pages() > 1) {
  @let prevLabel = 'filter.prev' | transloco;
  @let nextLabel = 'filter.next' | transloco;
  <nav class="trends-pager" [attr.aria-label]="'community.trends.title' | transloco">
    @if (previous(); as params) {
      <a
        class="trends-pager__nav"
        rel="prev"
        [routerLink]="[]"
        [queryParams]="params"
        queryParamsHandling="merge"
        [attr.aria-label]="prevLabel"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M15 6l-6 6 6 6" />
        </svg>
      </a>
    } @else {
      <span class="trends-pager__nav trends-pager__nav--off" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M15 6l-6 6 6 6" />
        </svg>
      </span>
    }
    <!-- ltr: the fraction reads "2 / 3" in a right-to-left page too. -->
    <span class="trends-pager__position" dir="ltr">{{ page() }} / {{ pages() }}</span>
    @if (next(); as params) {
      <a
        class="trends-pager__nav"
        rel="next"
        [routerLink]="[]"
        [queryParams]="params"
        queryParamsHandling="merge"
        [attr.aria-label]="nextLabel"
      >
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M9 6l6 6-6 6" />
        </svg>
      </a>
    } @else {
      <span class="trends-pager__nav trends-pager__nav--off" aria-hidden="true">
        <svg
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          aria-hidden="true"
        >
          <path d="M9 6l6 6-6 6" />
        </svg>
      </span>
    }
  </nav>
}
