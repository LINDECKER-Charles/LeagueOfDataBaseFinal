@let build = row();
<a class="forge-row__id" [routerLink]="shareLink()">
  <span class="forge-row__portrait" [class.forge-ghost]="build.champion.missing">
    <lodb-image
      class="size-full"
      imgClass="object-cover"
      [src]="imageSource(build.champion.image)"
      [alt]="build.champion.name"
      [width]="56"
      [height]="56"
      [initials]="initialsOf(build.champion.name)"
    />
    @if (imageSource(build.keystone.icon); as keystone) {
      <img
        class="forge-row__keystone"
        [src]="keystone"
        [alt]="build.keystone.name"
        width="26"
        height="26"
        loading="lazy"
        decoding="async"
      />
    }
  </span>
  <span class="min-w-0">
    <span class="block truncate font-beaufort text-lg tracking-wide text-gold-grad">
      {{ build.name }}
    </span>
    <span
      class="block truncate font-mono text-xs text-text-muted"
      [class.forge-ghost]="build.champion.missing"
      [attr.title]="build.champion.missing ? ('build.show.missing' | transloco) : null"
    >
      {{ build.champion.name }} · {{ 'build.list.updated' | transloco: { date: updated() } }}
    </span>
  </span>
</a>

<div class="forge-row__meta">
  <span class="hx-chip" [class.forge-chip--public]="build.isPublic">
    {{ (build.isPublic ? 'build.list.public' : 'build.list.private') | transloco }}
  </span>
  <div class="forge-row__actions">
    <form class="forge-row__import" (submit)="$event.preventDefault(); importTo.emit(to.value)">
      <label class="sr-only" [for]="selectId()">{{ 'build.import.to' | transloco }}</label>
      <select #to lodbField class="forge-row__select" [id]="selectId()">
        @for (version of choices(); track version) {
          <option [value]="version">{{ version }}</option>
        }
      </select>
      <button
        lodbButton="ghost"
        type="submit"
        class="forge-btn-sm"
        [title]="'build.import.hint' | transloco"
      >
        {{ 'build.import.action' | transloco }}
      </button>
    </form>
    <a lodbButton="ghost" class="forge-btn-sm" [routerLink]="editLink()">
      {{ 'build.list.edit' | transloco }}
    </a>
    <button
      lodbButton="ghost"
      type="button"
      class="forge-btn-sm forge-btn-danger"
      (click)="discard.emit()"
    >
      {{ 'build.list.delete' | transloco }}
    </button>
  </div>
</div>
