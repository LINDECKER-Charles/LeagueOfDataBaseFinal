<h2 id="profile-password-title" class="profile-panel__title">
  {{ 'profile.password.title' | transloco }}
</h2>
<p class="mt-2 max-w-2xl text-sm text-text-muted">{{ 'profile.password.help' | transloco }}</p>
@if (submission.error(); as message) {
  <p class="auth-error mt-4" role="alert">{{ message | transloco }}</p>
}
<form
  class="mt-5 max-w-md space-y-5"
  aria-labelledby="profile-password-title"
  (submit)="save($event)"
>
  <lodb-password-pair
    idPrefix="profile"
    [errors]="submission.errors()"
    [(password)]="password"
    [(confirmation)]="confirmation"
  />
  <button lodbButton type="submit" [disabled]="submission.busy()">
    {{ 'profile.password.submit' | transloco }}
  </button>
</form>
