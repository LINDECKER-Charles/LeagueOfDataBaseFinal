<lodb-auth-card [heading]="heading() | transloco">
  @if (sent()) {
    <p class="auth-notice mt-6" role="status">{{ 'auth.reset.check_email_lede' | transloco }}</p>
  } @else {
    <p class="mt-6 text-sm text-text-muted">{{ 'auth.reset.request_lede' | transloco }}</p>
    @if (error(); as message) {
      <p class="auth-error mt-6" role="alert">{{ message | transloco }}</p>
    }
    <form class="mt-6 space-y-5" (submit)="request($event)">
      <div>
        <label for="forgot-email" class="auth-label">{{ 'auth.reset.email' | transloco }}</label>
        <input
          lodbField
          id="forgot-email"
          name="email"
          type="email"
          class="mt-1.5"
          required
          autocomplete="email"
          [attr.aria-invalid]="errors()['email'] ? true : null"
        />
        @if (errors()['email']; as message) {
          <p class="auth-field-error" role="alert">{{ message | transloco }}</p>
        }
      </div>
      <button lodbButton type="submit" class="w-full" [disabled]="busy()">
        {{ 'auth.reset.submit_request' | transloco }}
      </button>
    </form>
  }
  <div class="gold-hairline mt-8 pt-5 text-center text-sm">
    <a class="nav-link text-gold" [routerLink]="login()">
      {{ 'auth.reset.back_to_login' | transloco }}
    </a>
  </div>
</lodb-auth-card>
