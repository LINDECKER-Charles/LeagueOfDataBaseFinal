<lodb-auth-card [heading]="'auth.reset.reset_title' | transloco">
  @if (invalid()) {
    <p class="auth-error mt-6" role="alert">{{ 'auth.flash.reset_error' | transloco }}</p>
    <a lodbButton class="mt-6 w-full" [routerLink]="forgot()">
      {{ 'auth.reset.submit_request' | transloco }}
    </a>
  } @else {
    @if (error(); as message) {
      <p class="auth-error mt-6" role="alert">{{ message | transloco }}</p>
    }
    <form class="mt-6 space-y-5" (submit)="reset($event)">
      <lodb-password-pair
        idPrefix="reset"
        [errors]="errors()"
        [(password)]="password"
        [(confirmation)]="confirmation"
      />
      <button lodbButton type="submit" class="w-full" [disabled]="busy()">
        {{ 'auth.reset.submit_reset' | transloco }}
      </button>
    </form>
  }
</lodb-auth-card>
