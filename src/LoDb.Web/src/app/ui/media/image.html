@if (src(); as source) {
  <picture>
    @if (webp(); as candidate) {
      <source type="image/webp" [attr.srcset]="candidate" />
    }
    <img
      #img
      class="hx-img size-full"
      [class]="imgClass()"
      [src]="source"
      [alt]="alt()"
      [width]="width()"
      [height]="height()"
      [attr.loading]="eager() ? 'eager' : 'lazy'"
      [attr.fetchpriority]="eager() ? 'high' : null"
      decoding="async"
      [attr.data-img-state]="state()"
      (load)="settle('loaded')"
      (error)="settle('error')"
    />
  </picture>
} @else {
  <span class="hx-img-initials size-full">{{ initials() }}</span>
}
