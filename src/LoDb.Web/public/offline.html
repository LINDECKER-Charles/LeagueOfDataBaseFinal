<!doctype html>
<!--
  Answered by the service worker (src/sw) for a page that is neither reachable nor cached.
  Self-contained: no script (the CSP admits none here) and nothing it cannot render offline.
  The font is the site's own, which the worker keeps once any page has loaded it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#010a13" />
    <title>Offline · Hors ligne — League Of Data Base</title>
    <style>
      @font-face {
        font-family: 'Beaufort';
        src: url('/fonts/BeaufortforLOL-Bold.woff2') format('woff2');
        font-weight: 700;
        font-display: swap;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: grid;
        place-items: center;
        padding: 2rem;
        background:
          radial-gradient(60rem 30rem at 50% -10%, rgba(3, 151, 171, 0.12), transparent 60%),
          #0a1428;
        color: #f0e6d2;
        font-family: ui-sans-serif, system-ui, sans-serif;
        text-align: center;
      }
      main {
        max-width: 28rem;
      }
      svg {
        width: 4.5rem;
        height: 4.5rem;
        color: #c8aa6e;
      }
      h1 {
        margin: 1.2rem 0 0.4rem;
        font-family: 'Beaufort', serif;
        font-size: 1.5rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
      section + section {
        margin-top: 1.6rem;
        padding-top: 1.2rem;
        border-top: 1px solid rgba(200, 170, 110, 0.3);
      }
      p {
        margin: 0.4rem 0;
        line-height: 1.6;
        color: #a09b8c;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.7rem 1.4rem;
        border: 1px solid rgba(200, 170, 110, 0.7);
        background: rgba(200, 170, 110, 0.14);
        color: #f0e6d2;
        font-family: 'Beaufort', serif;
        letter-spacing: 0.15em;
        text-decoration: none;
        text-transform: uppercase;
      }
      a:hover,
      a:focus-visible {
        background: rgba(200, 170, 110, 0.25);
      }
    </style>
  </head>
  <body>
    <main>
      <svg viewBox="0 0 800 800" fill="currentColor" aria-hidden="true">
        <path
          d="M438.14,168A235.31,235.31,0,0,1,580.08,552.7h79.45a299,299,0,0,0,41.4-152.25c0-153.18-114.63-279.58-262.79-298.11Z"
        />
        <path
          d="M208.88,631.86V537.33a235.17,235.17,0,0,1,0-273.77V169a300.44,300.44,0,0,0,0,462.83Z"
        />
        <polygon
          points="393.14 75 220.98 75 253.88 142.3 253.88 658.33 221.32 724.89 611.49 724.89 647.14 597.7 393.14 597.7 393.14 75"
        />
      </svg>
      <section lang="en">
        <h1>You are offline</h1>
        <p>Pages you have already visited stay available. This one is not saved yet.</p>
        <!-- An empty href reloads the address the visitor asked for, not this file. -->
        <a href="">Try again</a>
      </section>
      <section lang="fr">
        <h1>Vous êtes hors ligne</h1>
        <p>Les pages déjà visitées restent consultables. Celle-ci n’est pas encore enregistrée.</p>
        <a href="">Réessayer</a>
      </section>
    </main>
  </body>
</html>
