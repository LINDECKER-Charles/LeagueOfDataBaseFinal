# see https://symfony.com/doc/current/reference/configuration/framework.html
framework:
    secret: '%env(APP_SECRET)%'
    csrf_protection: true
    # Note that the session will be started ONLY if you read or write from it.
    session:
        # Without save_path the framework leaves PHP's native handler on its ini
        # save_path (/tmp in the official image), which the container recreation of
        # every deploy wipes — logging every signed-in user out. Setting save_path
        # switches the handler to session.handler.native_file (FrameworkExtension)
        # and puts the files under the volume-backed var/state.
        save_path: '%kernel.project_dir%/var/state/sessions'

    # Behind Caddy (TLS) -> nginx -> php-fpm. Trust the direct upstream and read the
    # X-Forwarded-* it relays so generated URLs use https and the real client IP is seen.
    trusted_proxies: '%env(TRUSTED_PROXIES)%'
    trusted_headers: ['x-forwarded-for', 'x-forwarded-host', 'x-forwarded-proto', 'x-forwarded-port']

    default_locale: en
    # UI catalogs shipped under translations/. Derived from the selected Data Dragon
    # language by LocaleSubscriber + UiLocaleResolver (2-letter base, zh split by script).
    enabled_locales:
        - ar
        - cs
        - de
        - el
        - en
        - es
        - fr
        - hu
        - id
        - it
        - ja
        - ko
        - pl
        - pt
        - ro
        - ru
        - th
        - tr
        - vi
        - zh_Hans
        - zh_Hant
    translator:
        default_path: '%kernel.project_dir%/translations'
        fallbacks: [en]
        cache_dir: '%kernel.cache_dir%/translations'

    # Throttles the "resend confirmation email" banner action (per authenticated
    # user). Password-reset requests are throttled by the reset-password bundle.
    rate_limiter:
        email_verification:
            policy: 'sliding_window'
            limit: 3
            interval: '15 minutes'
        # Anonymous, abuse-prone surfaces, all keyed by client IP (see ThrottlesByIp).
        # Public contact form — caps mail/DB abuse from a host.
        contact_form:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # Sign-up — caps mass account creation + confirmation-mail bombing per host.
        registration:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # Forgot-password requests — the bundle throttles per account (1/h); this
        # complements it by capping a host spraying requests across many addresses.
        password_request:
            policy: 'sliding_window'
            limit: 5
            interval: '1 hour'
        # Donation checkout — caps Stripe Checkout session spam from a host.
        donation_checkout:
            policy: 'sliding_window'
            limit: 10
            interval: '1 hour'
    #esi: true
    #fragments: true

when@test:
    framework:
        test: true
        session:
            storage_factory_id: session.storage.factory.mock_file

when@prod:
    framework:
        # Symfony logs any HttpException below 500 at ERROR on the `request`
        # channel. With an always-on NOTICE+ handler, every crawler probe would
        # otherwise land in a 90-day log store. INFO keeps them off the live
        # stream while still replaying them as context around a real error.
        exceptions:
            Symfony\Component\HttpKernel\Exception\NotFoundHttpException:
                log_level: info
            Symfony\Component\HttpKernel\Exception\MethodNotAllowedHttpException:
                log_level: info
            # The four IP rate limiters declared in this same file throw a 429, which
            # ErrorListener also logs at ERROR. A throttled bot would otherwise write
            # an ERROR record per attempt — the very noise this block exists to stop.
            # NOTICE, not INFO: unlike a 404 this one is worth seeing on the stream.
            Symfony\Component\HttpKernel\Exception\TooManyRequestsHttpException:
                log_level: notice
