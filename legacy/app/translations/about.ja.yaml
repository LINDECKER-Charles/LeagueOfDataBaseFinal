# /about、/about/data、/faq の各ページの本文。
# faq.* の id は App\Controller\Editorial\AboutController::FAQ_ENTRIES で定義されています。
eyebrow: "サイトについて"

index:
  title: "League Of Data Base について"
  lead: "League Of Data Base は無料の League of Legends 百科事典です。すべてのチャンピオン、アイテム、ルーン、サモナースペルを、任意のパッチについて 21 言語で提供します。"
  what:
    title: "このサイトについて"
    body: "League Of Data Base は League of Legends のゲームデータのリファレンスサイトです。ゲーム本体のファイル（チャンピオン、アイテム、ルーン、サモナースペル）を、閲覧・絞り込み・比較ができる読みやすいページとして公開しています。すべての数値は Riot 公式の Data Dragon 配信から取得しており、ここに書かれているのはゲームに実際に含まれる内容です。推定値やコミュニティの推測ではありません。"
  audience:
    title: "対象となる方"
    body: "試合の合間にチャンピオンのスキルやアイテムの価格を確認するプレイヤー、パッチ間で数値を比較する方、正確な数字を必要とする配信者・制作者、そして同じデータを API 経由で扱いたい開発者に向けています。ログインが必要な箇所はなく、閲覧にアカウントは不要です。"
  features:
    title: "できること"
    codex:
      title: "全データを閲覧する"
      body: "各チャンピオン（スキル、スキン、基礎ステータス、ストーリー）、各アイテム（価格、ステータス、ビルドツリー）、各ルーンパス、各サモナースペルの詳細ページ。すべての一覧に即時検索と絞り込みを備えています。"
    patches:
      title: "パッチをさかのぼる"
      body: "Data Dragon の任意のパッチに切り替えると、そのバージョン当時の状態でサイトを読めます。過去のページは独自のアドレスを保持するため、旧パッチへのリンクは常に正確なままです。"
    languages:
      title: "母語で読む"
      body: "インターフェースとゲームデータは、Riot が公開する 21 言語で利用できます。英語・フランス語から、韓国語、日本語、アラビア語、中国語の簡体字・繁体字まで対応しています。"
    builds:
      title: "ビルドを作成・共有する"
      body: "アーモリーエディタでアイテムビルドを段階的に組み立て、リンクで共有できます。ビルドには投票でき、公開プロフィールにあなたが公開したビルドがまとまります。"
    trends:
      title: "よく参照されている対象を見る"
      body: "トレンドページでは、サイト上で最も多く閲覧されたチャンピオン、アイテム、ルーンを順位付けします。試合統計ではなく、コミュニティの関心を示す指標です。"
    api:
      title: "プログラムからデータを取得する"
      body: "JSON 形式の REST API が、公開プロフィール、共有ビルド、閲覧トレンドを提供します。無料枠に加え、より多い利用向けの有料クレジットパックもあります。"
    offline:
      title: "インストールして使い続ける"
      body: "本サイトはインストール可能なプログレッシブウェブアプリです。ホーム画面に追加すれば、一度開いたページは接続がなくても読めます。"
  data:
    title: "データの出典"
    body: "サイト上のすべての数値は、League of Legends のゲームデータを公式に静的出力した Riot Games の Data Dragon から読み込んでいます。スキンのクロマについては Community Dragon で補完しています。手作業での編集は一切行っていません。本サイトは読み取り側であり、編集者ではありません。"
    link: "データと出典のページ全文を読む"
  who:
    title: "運営者"
    body: "League Of Data Base は、一人の開発者が制作・保守し、任意の寄付によって支えられている独立プロジェクトです。広告は掲載せず、個人データの販売も行いません。"
    opensource: "ソースコードは次で公開しています:"
  more:
    title: "さらに詳しく"

data:
  title: "データと出典"
  lead: "本サイトが公開している内容、その出典、鮮度、そして意図的に主張していないことについて。"
  dataset_name: "League of Legends ゲームデータ — パッチ %version%"
  snapshot:
    title: "現在の状況"
    patch: "パッチ"
    languages: "言語数"
    patches: "パッチ数"
  sources:
    title: "上流の出典"
    body: "本サイトは独自のゲームデータを保有していません。表示される内容はすべて公式配信から取得し、公開されたままの形で提供しています。"
    ddragon:
      title: "Data Dragon（Riot Games）"
      body: "主要な出典です。Riot がパッチごとに公開する公式の静的データ出力で、チャンピオン、アイテム、ルーン、サモナースペル、それらのローカライズ済みテキストと画像を提供します。"
    cdragon:
      title: "Community Dragon"
      body: "用途は一つだけです。Data Dragon が存在を示すのみで説明しないチャンピオンスキンのクロマに使用します。ここで表示する色名は、Riot の製品名ではなく画像の実際の色相から導いたものです。"
  freshness:
    title: "データの鮮度"
    body: "新しいパッチは、公開され次第 Riot のバージョン一覧から取り込みます。通常はゲームパッチ適用から数時間以内です。以前のパッチも保持され引き続き閲覧できるため、新しいパッチが来ても失われるものはありません。"
  coverage:
    title: "対象範囲"
    body: "各パッチ・各言語について、本サイトは次を公開します。"
    champions: "チャンピオン — スキル、基礎ステータスとレベルごとの成長、ロール、リソース種別、スキンとクロマ、ストーリー。"
    items: "アイテム — ゴールドコスト、ビルドツリー、売却額、ステータス、カテゴリ、マップ別の使用可否。"
    runes: "ルーンパス — 各スロット、キーストーンおよびマイナールーンとその効果テキスト。"
    summoners: "サモナースペル — クールダウン、射程、解放レベル、対応ゲームモード。"
  limits:
    title: "明示する制約"
    body: "本サイトはゲームファイルの内容を伝えるものです。勝率、ピック率、ティアリストの算出は行わず、試合履歴も保持しません。それらは実際の対戦データに由来し、Data Dragon では提供されないためです。Riot がプレースホルダを未解決のまま出力しているスキル説明は、推測せず出力されたまま表示します。"
  reuse:
    title: "データの再利用"
    body: "ゲームデータは Riot Games に帰属し、同社の規約が引き続き適用されます。本サイト独自の情報（閲覧トレンド、公開プロフィール、共有ビルド）は、ドキュメント付きの JSON API から利用できます。"
    link: "開発者向け API を見る"
  disclaimer:
    title: "Riot Games に関する免責"
    body: "League Of Data Base は Riot Games の承認を受けたものではなく、Riot Games ならびに League of Legends の制作・運営に公式に関与する人物の見解や意見を反映するものでもありません。League of Legends および Riot Games は Riot Games, Inc. の商標または登録商標です。"

faq:
  title: "よくある質問"
  lead: "このサイトが何であるか、データの出典、そして何ができるのかへの率直な回答です。"
  more:
    title: "お探しの情報が見つかりませんか"
    body: "次のページでより詳しく説明しています。"
  what-is-it:
    question: "League Of Data Base とは何ですか。"
    answer: "League Of Data Base は League of Legends に特化した無料のオンライン百科事典です。ゲーム内のすべてのチャンピオン、アイテム、ルーン、サモナースペルを正確なステータスとともに、任意のパッチについて 21 言語で調べられます。独立したプロジェクトであり、Riot Games の公式サイトではありません。"
  data-source:
    question: "データはどこから来ていますか。"
    answer: "ゲームデータはすべて、Riot Games がパッチごとに公開する公式の静的データ出力である Data Dragon から取得しています。Data Dragon が説明していないスキンのクロマは Community Dragon から取得します。本サイトはこれらの値を改変せず、読み取って表示するだけです。"
  freshness:
    question: "データはどのくらいの頻度で更新されますか。"
    answer: "新しいパッチは公開され次第 Riot のバージョン一覧から検出します。通常はパッチ適用から数時間以内です。過去のパッチも引き続き利用できるため、いつでもさかのぼって当時の状態でサイトを読めます。"
  languages:
    question: "対応言語を教えてください。"
    answer: "本サイトは、Riot がゲームデータを公開している 21 言語に対応しています。英語、フランス語、ドイツ語、スペイン語、イタリア語、ポルトガル語、ポーランド語、ルーマニア語、ハンガリー語、ギリシャ語、チェコ語、トルコ語、ロシア語、アラビア語、タイ語、ベトナム語、インドネシア語、日本語、韓国語、簡体字中国語、繁体字中国語です。インターフェースとゲームテキストのいずれも、選択した言語に従います。"
  old-patches:
    question: "過去のパッチを調べられますか。"
    answer: "はい。Riot が Data Dragon で公開したすべてのパッチは引き続き閲覧でき、過去のページには固有の恒久アドレスがあります。これにより、二つのバージョン間でチャンピオンやアイテムを比較したり、特定パッチ当時の状態にリンクしたりできます。"
  free:
    question: "無料ですか。"
    answer: "はい。サイト全体を無料で利用でき、広告や有料の閲覧制限はありません。運営は任意の寄付によって支えられています。有料のクレジットパックが必要になるのは開発者向け API を大量に利用する場合のみで、その API にも無料枠があります。"
  account:
    question: "アカウントは必要ですか。"
    answer: "いいえ。チャンピオン、アイテム、ルーン、サモナースペル、任意のパッチの閲覧にアカウントは不要です。アカウントが必要なのは、お気に入りの保存、アイテムビルドの作成・共有、他の利用者が共有したビルドへの投票を行う場合だけです。"
  builds:
    question: "アイテムビルドを作成して共有できますか。"
    answer: "はい。アーモリーエディタでビルドを段階的に組み立て、共有可能なリンクとして公開できます。共有されたビルドには他の訪問者が投票でき、公開プロフィールにあなたが公開したビルドが一覧表示されます。"
  api:
    question: "API はありますか。"
    answer: "あります。JSON 形式の REST API が、本サイト独自のデータ（公開プロフィール、共有ビルド、閲覧トレンド）を提供します。無料枠に加え、大量利用向けのクレジットパックもあります。Riot のゲームデータ自体は、引き続き Data Dragon から直接取得できます。"
  offline:
    question: "オフラインでも使えますか。"
    answer: "一部使えます。本サイトはインストール可能なプログレッシブウェブアプリで、ホーム画面やデスクトップに追加でき、一度開いたページは接続がなくても読めます。未閲覧のページを開くにはネットワーク接続が必要です。"
  riot-affiliation:
    question: "このサイトは Riot Games と関係がありますか。"
    answer: "いいえ。League Of Data Base は独立したプロジェクトであり、Riot Games の承認を受けたものではなく、Riot Games ならびに League of Legends の制作・運営に公式に関与する人物の見解や意見を反映するものでもありません。League of Legends および Riot Games は Riot Games, Inc. の商標または登録商標です。"
